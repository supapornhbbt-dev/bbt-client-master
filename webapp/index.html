<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap">
<title>BBT Client Master</title>
<style>
  /* โทนตาม BBT Reimburse (iOS design language): พื้น #F2F2F7 · ตัวหนังสือ #1C1C1E · เขียวแบรนด์ */
  /* 3 ก.ย. 2569 — ปรับเป็น "แนว C มินิมอลตามคู่มือ": ใช้รหัสสีตาม ~/Downloads/DESIGN-BBT.md ทุกตัว
     (เดิม brand เพี้ยน 1 หลัก · muted เข้มเกิน · สีสถานะเป็นชุดของตัวเอง) ชื่อ token เดิมคงไว้ไม่ต้องแก้ทั้งไฟล์ */
  :root { --bg:#f2f2f7; --card:#fff; --line:#e5e5ea; --txt:#1c1c1e; --txt2:#3a3a3c; --mut:#8e8e93;
          --blue:#6fae2b; --blue-bg:#f3faea; --green:#557f25; --green-bg:#f3faea;
          --red:#c8322c; --red-bg:#ffeceb; --amber:#8a5a10; --amber-bg:#fff4e3; --brand:#8cc63f;
          --ok:#34c759; --warn:#ff9f0a; --danger:#ff3b30; --info:#0a84ff;
          --hover:rgba(140,198,63,.07); }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,system-ui,"SF Pro Text","SF Pro Display","Helvetica Neue","Sukhumvit Set",Sarabun,"Noto Sans Thai",sans-serif; background:var(--bg); color:var(--txt); font-size:16px; -webkit-font-smoothing:antialiased; }
  button { font:inherit; cursor:pointer; }
  input,select { font:inherit; }
  .badge { display:inline-block; padding:3px 12px; border-radius:999px; font-size:13px; background:var(--bg); color:var(--mut); }
  table td, table th, .num input { font-variant-numeric:tabular-nums; }
  input:focus, select:focus { outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(140,198,63,.18); }
  button:active:not(.cmb) { transform:scale(.97); }
  .badge.blue { background:var(--blue-bg); color:var(--blue); }
  .badge.green { background:var(--green-bg); color:var(--green); }
  .badge.red { background:var(--red-bg); color:var(--red); }
  .badge.amber { background:var(--amber-bg); color:var(--amber); }

  #login { max-width:400px; margin:12vh auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px; }
  #login h1 { font-size:22px; margin-bottom:4px; }
  #login p { color:var(--mut); font-size:14px; margin-bottom:20px; }
  #login input { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; margin-bottom:12px; font-size:16px; }
  #login button { width:100%; padding:14px; border:none; border-radius:12px; background:#6fae2b; color:#fff; font-size:16px; font-weight:600; box-shadow:0 8px 24px rgba(140,198,63,.35); }
  #login h1 { font-weight:800; letter-spacing:-.7px; }
  #loginErr { color:var(--red); font-size:14px; margin-bottom:10px; display:none; }

  #app { display:none; height:100vh; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header .logo { font-weight:800; font-size:17px; letter-spacing:-.4px; margin-right:4px; }
  header select { padding:8px 10px; border:1px solid var(--line); border-radius:12px; background:#fff; }
  header input { flex:1; min-width:150px; padding:9px 14px; border:1px solid var(--line); border-radius:12px; }
  header .ghost { background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 14px; color:var(--txt); }
  .ghost { background:#fff; color:var(--txt); }
  button:not(.ghost):not(.cmb){ transition:filter .1s; } button:not(.ghost):hover{ filter:brightness(1.05); }
  main { flex:1; display:flex; min-height:0; }
  /* เมนูด้านซ้ายแบ่งหมวด (3 ก.ย.) — sidebar พื้นขาวตามคู่มือ */
  #nav { width:252px; min-width:252px; background:var(--card); border-right:1px solid var(--line); overflow-y:auto; padding:14px 12px 28px; }
  #nav .sec { font-size:13px; font-weight:700; letter-spacing:.04em; color:var(--mut); padding:18px 12px 7px; }
  #nav .sec:first-child { padding-top:4px; }
  #nav a { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; font-size:15.5px; color:var(--txt); cursor:pointer; text-decoration:none; line-height:1.4; }
  #nav a:hover { background:var(--hover); }
  #nav a.on { background:var(--blue-bg); color:var(--green); font-weight:700; }
  #nav a svg { flex:none; opacity:.8; }
  #nav a.on svg { opacity:1; }
  #nav a .soon { font-size:10.5px; color:var(--amber); font-weight:400; }
  #nav a .navdot { flex:none; opacity:0; color:var(--mut); font-size:16px; line-height:1; padding:0 2px; border-radius:6px; transition:opacity .12s; }
  #nav a:hover .navdot { opacity:.75; }
  #nav a .navdot:hover { opacity:1; background:var(--bg); color:var(--txt); }
  @media (max-width:900px){ #nav { display:none; } }
  .tabpills { display:contents; }
  @media (min-width:901px){ .tabpills { display:none; } }
  #list { width:290px; min-width:220px; overflow-y:auto; background:var(--card); border-right:1px solid var(--line); }
  #list .item { padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  #list .item.sel { background:var(--blue-bg); }
  #list .item .c { font-weight:600; font-size:14px; }
  #list .item .n { font-size:13px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #list .item .tag { font-size:11px; color:var(--mut); }
  #detail { flex:1; overflow-y:auto; padding:20px; }
  .card { background:var(--card); border:none; border-radius:16px; padding:18px 20px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04); }
  .card h3 { font-size:16px; color:var(--txt); font-weight:800; letter-spacing:-.3px; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .kv .k { font-size:12px; color:var(--mut); }
  .kv .v { font-size:15px; }
  .role { background:var(--bg); border-radius:12px; padding:10px 12px; }
  .role .k { font-size:12px; color:var(--mut); margin-bottom:4px; }
  .role select { width:100%; padding:8px; border:1px solid var(--line); border-radius:12px; background:#fff; }
  .num input { width:100%; padding:8px; border:1px solid var(--line); border-radius:12px; }
  #saveBar { display:none; position:sticky; bottom:0; padding:10px 0; }
  #saveBar button { width:100%; padding:13px; border:none; border-radius:12px; background:var(--blue); color:#fff; font-size:16px; }
  .tasks li { margin-left:20px; padding:3px 0; font-size:14px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--txt); color:#fff; padding:10px 22px; border-radius:999px; font-size:14px; display:none; z-index:9; }
  #dash .card { width:max-content; min-width:100%; }
  #dash > div:first-child { margin-top:20px; }
  th .cmb { opacity:.3; transition:opacity .15s; }
  th:hover .cmb { opacity:1; }
  /* 3 ก.ย. — กฎกลางให้ทุกแถบหน้าตาเหมือนกัน (แนว C ตามคู่มือ) */
  #dash th { font-size:12px; font-weight:600; color:var(--mut); }
  #dash tbody tr:hover > td, #dash table tr:hover > td { background:var(--hover); }
  #dash table tr.tot:hover > td, #dash table tr.grp:hover > td { background:inherit; }
  #dash select, #dash input:not([type=checkbox]):not([type=radio]) { border-radius:12px; }
  #detail select, #detail input:not([type=checkbox]):not([type=radio]) { border-radius:12px; }
  #dash .card table { font-variant-numeric:tabular-nums; }
  @media (max-width:700px){ #list{width:150px;} #detail{padding:12px;} }
.cwh{transition:background .1s}
/* ---- บอร์ดภาษีโฉมใหม่ (2 ก.ย.) — ป้ายสถานะสีทึบแบบ Monday แทน dropdown ---- */
.txp{display:block;width:100%;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;text-align:center;cursor:pointer;line-height:1.3;transition:filter .1s,transform .05s;user-select:none}
.txp:hover{filter:brightness(1.06)} .txp:active{transform:scale(.98)}
.txp .d{font-size:10.5px;font-weight:500;opacity:.85;margin-top:1px}
.txm{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:200px;padding:6px;text-align:left;cursor:default;white-space:normal}
.txm .o{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:500}
.txm .o:hover{background:var(--bg)}
.txm .dot{width:11px;height:11px;border-radius:4px;flex:none}
#dash tr.tax-row:hover > td{background:var(--hover)}
#dash tr.tax-row:hover > td[style*="background:#fff"]{background:var(--hover) !important}
.txfiles{display:inline-flex;gap:3px;align-items:center;font-size:11px;color:var(--mut);flex:none;white-space:nowrap}
.txfiles a{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:600}
.txfiles .add{opacity:0;transition:opacity .12s;cursor:pointer}
td:hover .txfiles .add{opacity:.75}
.txfiles a{font-size:13px;line-height:1}
/* ---- หน้าตาแบบ Settings ของ iPhone (1 ก.ย.) ใช้ในแถบสิทธิ์ผู้ใช้ ---- */
.ios-sec{font-size:12px;color:var(--mut);font-weight:600;padding:0 4px 6px;margin-top:18px}
.ios-group{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ios-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);font-size:14px}
.ios-row:first-child{border-top:none}
/* แผงสิทธิ์: การ์ดตีกรอบชัดเจน 3 คอลัมน์ หน้าตาเดียวกับการ์ดหมวดงานหน้าแรก (3 ก.ย.) */
.perm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:none;border:none;border-radius:0;overflow:visible}
.perm-grid .ios-row{display:flex;flex-direction:column;align-items:stretch;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 15px;transition:border-color .12s,background .12s}
.perm-grid .ios-row:hover{border-color:var(--brand);background:var(--hover)}
.perm-grid .ios-row .lbl{flex:none;font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.perm-grid .ios-row .sub{font-weight:400}
.perm-grid .perm-sw{display:flex;gap:22px;align-items:flex-end;border-top:1px solid var(--bg);padding-top:10px;margin-top:auto}
@media (max-width:1100px){ .perm-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:700px){ .perm-grid{grid-template-columns:1fr} }
.ios-row .lbl{flex:1;min-width:0}
.ios-row .sub{font-size:12px;color:var(--mut);margin-top:2px}
.ios-row input[type=text]{border:none;background:none;text-align:right;font-size:14px;width:min(420px,52vw);outline:none;color:var(--blue)}
.sw{position:relative;display:inline-block;width:46px;height:27px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:#e5e5ea;border-radius:999px;transition:background .18s;cursor:pointer;display:block}
.sw i:before{content:"";position:absolute;width:23px;height:23px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.sw input:checked + i{background:var(--brand)}
.sw input:checked + i:before{transform:translateX(19px)}
.sw input:disabled + i{opacity:.35;cursor:not-allowed}
.swlb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);flex:none}
</style>
</head>
<body>

<div id="login">
  <img src="logo.png" alt="BeBigTree" style="height:72px;display:block;margin:0 auto 14px" onerror="this.style.display='none'">
  <h1 style="text-align:center">BBT Client Master</h1>
  <div id="loginErr"></div>
  <input id="email" type="text" placeholder="ตัวย่อพนักงาน (เช่น NTJ)" autocomplete="username" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase">
  <input id="pass" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
  <button onclick="doLogin()">เข้าสู่ระบบ</button>
  <div style="text-align:center;margin-top:12px"><a href="#" onclick="forgotPassword();return false" style="font-size:13px;color:var(--mut)">ลืมรหัสผ่าน?</a></div>
</div>

<div id="app">
  <header style="border-top:3px solid var(--brand)">
    <img src="logo.png" alt="" style="height:30px" onerror="this.style.display='none'">
    <span class="logo">BBT Client Master</span>
    <select id="yearSel" onchange="renderAll()"></select>
    <button class="ghost admin-only" onclick="newYear()" title="คัดลอกโครงสร้างปีปัจจุบันไปเป็นปีถัดไป (ทีม+ลักษณะบริษัท+ชั่วโมง Partner) โดยไม่เอาชั่วโมงจริงที่กรอกไว้">⧉ Duplicate ขึ้นปีใหม่</button>
    <button class="ghost admin-only" onclick="delYear()" title="ลบข้อมูลของปีที่เลือกอยู่ (ทีมแบ่งงาน + ชั่วโมงของปีนั้น) — เผื่อกด Duplicate ผิดปี">✕ ลบปีนี้</button>
    <button class="ghost" onclick="openNewClient()">+ บริษัทใหม่</button>
    <input id="search" type="hidden" value="">
    <select id="statusSel" style="display:none"><option value=""></option></select>
    <button class="ghost admin-only" onclick="doExport()" data-th="ส่งออก" data-en="Export">ส่งออก</button>
    <button class="ghost admin-only" onclick="fileInp.click()" data-th="นำเข้า" data-en="Import">นำเข้า</button>
    <button class="ghost admin-only" onclick="doTemplate()" data-th="แม่แบบ" data-en="Template">แม่แบบ</button>
    <input type="file" id="fileInp" accept=".xlsx" style="display:none" onchange="doImport(this.files[0]);this.value=''">
    <input type="file" id="liqFileInp" multiple style="display:none" onchange="liqUploadPicked(this)">
    <input type="file" id="taxFileInp" multiple style="display:none" onchange="taxUploadPicked(this);this.value=''">
    <input type="file" id="taxYFileInp" multiple style="display:none" onchange="taxYUploadPicked(this);this.value=''">
    <button class="ghost" onclick="changePassword()" title="เปลี่ยนรหัสผ่านของบัญชีที่ล็อกอินอยู่" data-th="รหัสผ่าน" data-en="Password">รหัสผ่าน</button>
    <button class="ghost" onclick="logout()" data-th="ออก" data-en="Sign out">ออก</button>
  </header>
  <main>
    <nav id="nav"></nav>
    <div id="list" style="display:none"></div>
    <div id="detail"><div class="card">เลือกบริษัทจากรายการด้านซ้าย</div></div>
    <div id="dash" style="display:none;flex:1;overflow:auto;padding:0 20px 20px 0"></div>
  </main>
</div>
<div id="toast"></div>

<script>

let userName = '', userRolesDB = null, staffAccessDB = null, managerAccessDB = null, officeAccessDB = null;
function adminList(){ return (userRolesDB && Array.isArray(userRolesDB.admins) && userRolesDB.admins.length) ? userRolesDB.admins : ADMIN_DEFAULT; }

function staffAccess(){
  const d = { tabs:{client:true, grp:true, staff:true, entry:true, frac:false, help:true, liq:true, reg:true, tax:true, taxy:true, sum:true, taxsum:true, payroll:true, audit:true}, hideMoney:true, hideImpExp:true };
  return (staffAccessDB && typeof staffAccessDB==='object') ? Object.assign({}, d, staffAccessDB, { tabs: Object.assign({}, d.tabs, staffAccessDB.tabs||{}) }) : d;

function isManagerAcct(){ return !isAdmin() && managerList().map(x=>String(x).toLowerCase().trim()).includes(userName); }
function managerAccess(){
  const d = { tabs:{client:true, grp:true, staff:true, entry:true, frac:false, help:true, liq:true, reg:true}, hideMoney:true, hideImpExp:true };
  return (managerAccessDB && typeof managerAccessDB==='object') ? Object.assign({}, d, managerAccessDB, { tabs: Object.assign({}, d.tabs, managerAccessDB.tabs||{}) }) : d;
}
// ---- ชั้น "แอดมินจำกัด" (3 ก.ย.) — อยู่ใต้ Manager เหนือพนักงาน ใช้กับธุรการ/แอดมินที่ทำได้บางอย่าง ----
function officeList(){ return (userRolesDB && Array.isArray(userRolesDB.office)) ? userRolesDB.office : []; }
function isOfficeAcct(){ return !isAdmin() && !isManagerAcct() && officeList().map(x=>String(x).toLowerCase().trim()).includes(userName); }
function officeAccess(){
  const d = { tabs:{client:true, grp:true, help:true, reg:true, liq:true}, hideMoney:true, hideImpExp:true };
  return (officeAccessDB && typeof officeAccessDB==='object') ? Object.assign({}, d, officeAccessDB, { tabs: Object.assign({}, d.tabs, officeAccessDB.tabs||{}) }) : d;
}
// สิทธิ์ของบัญชีที่ล็อกอินอยู่ เรียงจากมากไปน้อย: แอดมิน → Manager → แอดมินจำกัด → พนักงาน
function curAccess(){ return isManagerAcct() ? managerAccess() : isOfficeAcct() ? officeAccess() : staffAccess(); }
// ---- ขอบเขตข้อมูลรายบุคคล (1 ก.ย.) — บัญชีชื่อ = ตัวย่อพนักงาน เช่น ntj → staff_token NTJ ----
function myStaffToken(){
  const t = String(userName||'').toUpperCase();
  return D.staff.some(x=>String(x.staff_token).toUpperCase()===t) ? t : null;
}
// เห็นเฉพาะพอร์ตตัวเองไหม — แอดมิน/Manager เห็นครบเสมอ · พนักงานปรับได้ที่การ์ดสิทธิ์ (ownOnly)
function ownOnly(){
  if (isAdmin() || isManagerAcct()) return false;
  if (!myStaffToken()) return false;              // บัญชีที่จับคู่กับพนักงานไม่ได้ ให้เห็นตามสิทธิ์แถบเดิม
  return curAccess().ownOnly !== false;           // ค่าเริ่มต้นของพนักงาน = เห็นเฉพาะของตัวเอง
}
// ชุด tax_id ที่บัญชีนี้รับผิดชอบในปีที่เลือก (ทุกบทบาท)
let _myCoCache = null, _myCoKey = '';
function myClientIds(){
  const tok = myStaffToken(), y = year(), key = tok + '|' + y + '|' + (D.assigns||[]).length;
  if (_myCoKey === key && _myCoCache) return _myCoCache;
  const set = new Set(D.assigns.filter(a=>a.work_year===y && String(a.staff_token).toUpperCase()===tok).map(a=>a.tax_id));
  _myCoKey = key; _myCoCache = set;
  return set;
}
// กรองรายการบริษัทตามขอบเขตของบัญชีที่ล็อกอิน — ใช้กับทุกบอร์ดที่ไล่รายบริษัท
function inScope(list){
  if (!ownOnly()) return list;
  const mine = myClientIds();
  return list.filter(c=>mine.has(c.tax_id));
}
// แถบที่ไม่มีอะไรให้แก้อยู่แล้ว (อ่านอย่างเดียวโดยธรรมชาติ) — ไม่ต้องมีช่อง "แก้ได้"
const VIEW_ONLY_TABS = ['help','taxsum','sum'];
// "แก้ได้" ค่าเริ่มต้น = แก้ได้ ถ้าแอดมินยังไม่เคยตั้ง (ของเดิมทุกคนที่เห็นก็แก้ได้)
function canEditTab(t){
  if (isAdmin()) return true;
  if (!canSeeTab(t)) return false;
  if (VIEW_ONLY_TABS.includes(t)) return false;
  const e = curAccess().edit || {};
  return e[t] !== false;
}
// ---- ล็อกคอลัมน์ห้ามแก้ไข (31 ส.ค.) — คอลัมน์ที่ล็อก แก้ได้เฉพาะแอดมิน + บัญชีที่ได้รับสิทธิ์แก้ข้อมูล ----
let lockedColsDB = null;
function lockedCols(){ return Array.isArray(lockedColsDB) ? lockedColsDB : []; }
function editorList(){ return (userRolesDB && Array.isArray(userRolesDB.editors)) ? userRolesDB.editors : []; }
function canEditCol(k){
  if (isAdmin()) return true;
  if (!lockedCols().includes(k)) return true;
  return editorList().map(x=>String(x).toLowerCase().trim()).includes(userName);
}
// ทำให้เซลล์เป็นอ่านอย่างเดียวเมื่อคอลัมน์ถูกล็อกและผู้ใช้ไม่มีสิทธิ์แก้
function lockCell(k, html){
  if (html===undefined || html===null) return '';
  if (canEditCol(k)) return html;
  return String(html)
    .replace(/<select /g, '<select disabled title="คอลัมน์นี้ถูกล็อก — แก้ได้เฉพาะผู้มีสิทธิ์" ')
    .replace(/<input /g, '<input disabled title="คอลัมน์นี้ถูกล็อก — แก้ได้เฉพาะผู้มีสิทธิ์" ')
    .replace(/<button /g, '<button disabled ')
    .replace(/ on(click|change|input)="[^"]*"/g, '')
    .replace(/cursor:pointer/g, 'cursor:default')
    .replace(/text-decoration:underline dotted/g, '');
}
async function toggleLockCol(k, on){
  const list = lockedCols().filter(x=>x!==k);
  if (on) list.push(k);
  const { error } = await sb.from('app_setting').upsert({ key:'locked_cols', value:list }, { onConflict:'key' });
  if (error){ toast('บันทึกไม่สำเร็จ: ' + error.message); return; }
  lockedColsDB = list;
  toast(on ? 'ล็อกคอลัมน์แล้ว ✓ (คนที่ไม่มีสิทธิ์แก้ไม่ได้)' : 'ปลดล็อกคอลัมน์แล้ว ✓');
  renderDash();
}

// ---- แถบสิทธิ์ผู้ใช้ (30 ส.ค. ดึก — แยกออกจากแถบแบ่งชั่วโมง, ติ๊กแล้วบันทึกทันทีไม่ต้องกดปุ่ม) ----
async function permSaveKey(key, val){
  const { error } = await sb.from('app_setting').upsert({ key, value: val }, { onConflict:'key' });
  if (error){ toast('บันทึกไม่สำเร็จ: ' + error.message); return false; }
  return true;
}
// map ชั้นสิทธิ์ → ฟังก์ชันอ่านค่า · key ใน app_setting · ชื่อที่แสดง
const TIERS = {
  manager: { get:()=>managerAccess(), key:'manager_access', lb:'Manager',      set:v=>{ managerAccessDB = v; } },
  office:  { get:()=>officeAccess(),  key:'office_access',  lb:'แอดมินจำกัด', set:v=>{ officeAccessDB  = v; } },
  staff:   { get:()=>staffAccess(),   key:'staff_access',   lb:'พนักงาน',     set:v=>{ staffAccessDB   = v; } },
};
async function permSet(tier, kind, key, checked){
  const T = TIERS[tier] || TIERS.staff;
  const val = JSON.parse(JSON.stringify(T.get()));
  if (kind==='tab') val.tabs[key] = checked;
  else if (kind==='edit'){ val.edit = val.edit || {}; val.edit[key] = checked; }
  else val[key] = checked;
  if (kind==='tab' && !checked){ val.edit = val.edit || {}; val.edit[key] = false; }   // ปิดการมองเห็น = แก้ไม่ได้ด้วย
  if (await permSaveKey(T.key, val)){
    T.set(val);
    toast('บันทึกทันทีแล้ว ✓ — บัญชีระดับ' + T.lb + ' รีเฟรชหนึ่งครั้งถึงเห็นผล');
  }
  renderDash();
}
// เปิด/ปิดทุกแถบในหมวดเดียวรวดเดียว
async function permSetCat(tier, catKey, on){
  const cat = HOME_CATS.find(c=>c.k===catKey); if (!cat) return;
  const T = TIERS[tier] || TIERS.staff;
  const val = JSON.parse(JSON.stringify(T.get()));
  val.edit = val.edit || {};
  cat.tabs.forEach(t=>{ val.tabs[t] = on; val.edit[t] = on && !VIEW_ONLY_TABS.includes(t); });
  if (await permSaveKey(T.key, val)){
    T.set(val);
    toast((on?'เปิด':'ปิด') + 'หมวด ' + cat.lb + ' แล้ว ✓');
  }
  renderDash();
}
async function permSetRoles(kind, value){

}
// เพิ่มผู้ใช้ใหม่จากหน้าเว็บ — ใช้ client แยก session เพื่อไม่ให้แอดมินหลุดจากระบบ
// สร้างบัญชีพนักงานใหม่ — เรียก Edge Function `admin-create-user` (1 ก.ย. ทางเลือกที่ 2 ของผู้ใช้)
// ฟังก์ชันฝั่งเซิร์ฟเวอร์ตรวจเองว่าคนเรียกอยู่ในรายชื่อแอดมินจริง แล้วค่อยสร้างบัญชีแบบยืนยันอีเมลให้เสร็จ
// จึงสร้างบัญชีได้โดยที่การสมัครเองจากภายนอกยังปิดอยู่ (disable_signup) และไม่ต้องส่งอีเมลเลย
async function permAddUser(){
  const g = id => ((document.getElementById(id)||{}).value || '').trim();
  const uname = g('pu-name').toLowerCase();
  if (!uname){ toast('ใส่อีเมลหรือชื่อผู้ใช้ก่อน'); return; }
  const em = uname.includes('@') ? uname : uname + '@bebigtree.com';
  const short = em.split('@')[0];
  const tier = g('pu-tier') || 'staff';
  const btn = document.getElementById('pu-btn');
  if (btn){ btn.disabled = true; btn.textContent = 'กำลังสร้าง...'; }
  try {
    const { data: sess } = await sb.auth.getSession();
    const token = sess && sess.session && sess.session.access_token;
    if (!token){ toast('เซสชันหมดอายุ — ออกแล้วเข้าใหม่อีกครั้ง'); return; }
    const res = await fetch(SB_URL + '/functions/v1/admin-create-user', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: em, meta: { tier, created_by: userName } }),
    });
    const out = await res.json().catch(()=>({ error: 'ตอบกลับไม่ถูกต้อง' }));
    if (!res.ok || out.error){
      toast('สร้างไม่สำเร็จ: ' + (out.error || res.status));
      window.__puLastMsg = '<b style="color:var(--red)">สร้างบัญชีไม่สำเร็จ</b><br>' + (out.error || ('รหัสตอบกลับ ' + res.status));
      renderDash(); return;
    }
    if (tier==='admin' || tier==='manager'){
      const admins = adminList().map(x=>String(x).toLowerCase().trim());
      const managers = managerList().map(x=>String(x).toLowerCase().trim());
      if (tier==='admin' && !admins.includes(short)) admins.push(short);
      if (tier==='manager' && !managers.includes(short)) managers.push(short);
      const editors = editorList().map(x=>String(x).toLowerCase().trim());
      if (await permSaveKey('user_roles', { admins, managers, editors })) userRolesDB = { admins, managers, editors };
    }
    toast('สร้างบัญชี ' + em + ' แล้ว');
    window.__puLastMsg = 'สร้างบัญชีเรียบร้อย<br>'
      + 'ชื่อผู้ใช้: <b>' + String(short).toUpperCase() + '</b> · ระดับ: ' + (tier==='admin'?'แอดมิน':tier==='manager'?'Manager':'พนักงาน') + '<br>'
      + 'รหัสผ่านชั่วคราว: <b style="font-size:16px;letter-spacing:.5px">' + out.password + '</b><br>'
      + '<span style="color:var(--red)">คัดลอกรหัสนี้ส่งให้เจ้าตัวเป็นรายคน — ปิดหน้านี้แล้วจะดูซ้ำไม่ได้</span> · '
      + 'ให้เจ้าตัวเข้าระบบแล้วกดปุ่ม "รหัสผ่าน" บนหัวเว็บเพื่อเปลี่ยนเป็นของตัวเองทันที (ไม่ต้องรอเมลยืนยัน)';
    const inp = document.getElementById('pu-name'); if (inp) inp.value = '';
    renderDash();
  } catch(e){
    toast('สร้างไม่สำเร็จ: ' + e.message);
  } finally { if (btn){ btn.disabled = false; btn.textContent = '+ สร้างบัญชี'; } }
}

// เข้ามาจากลิงก์รีเซ็ตในอีเมล — ระบบล็อกอินให้อัตโนมัติ แล้วถามตั้งรหัสใหม่ทันที

});

// ตารางที่โหลดไม่สำเร็จตอนเข้าเว็บ — เก็บไว้เตือนบนจอ แทนที่จะโชว์ตัวเลข 0 เงียบ ๆ เหมือนไม่มีข้อมูล (3 ก.ย.)
let loadErrors = [];
async function fetchAll(table, orderCol){
  let all = [], from = 0;
  while (true){
    let q = sb.from(table).select('*').range(from, from + 999);
    if (orderCol) q = q.order(orderCol);
    const { data, error } = await q;
    if (error || !data){
      loadErrors.push(table + (error && error.message ? ' — ' + error.message : ' — โหลดไม่สำเร็จ'));
      break;
    }
    all = all.concat(data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return all;
}
// แถบเตือนสีแดงค้างบนจอ พร้อมปุ่มโหลดใหม่ — ขึ้นเมื่อมีตารางโหลดไม่สำเร็จ
function showLoadErrors(){
  const old = document.getElementById('loaderr'); if (old) old.remove();
  if (!loadErrors.length) return;
  const d = document.createElement('div');
  d.id = 'loaderr';
  d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:9999;max-width:min(680px,92vw);background:#fff2f0;border:1px solid #f0a19a;color:#a01b0b;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.12)';
  d.innerHTML = '<b>โหลดข้อมูลบางส่วนไม่สำเร็จ</b> — ตัวเลขบนหน้าจออาจไม่ครบ กรุณาโหลดหน้าใหม่อีกครั้ง<div style="font-size:12px;margin-top:4px;color:#7a2018">' +
    loadErrors.map(x=>String(x).replace(/</g,'&lt;')).join('<br>') + '</div>' +
    '<div style="margin-top:8px;display:flex;gap:8px"><button onclick="location.reload()" style="border:1px solid #a01b0b;background:#a01b0b;color:#fff;border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer">โหลดใหม่</button>' +
    '<button onclick="this.closest(\'#loaderr\').remove()" style="border:1px solid #f0a19a;background:#fff;color:#a01b0b;border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer">ปิด</button></div>';
  document.body.appendChild(d);
}

async function boot(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  try {
    const { data: sess } = await sb.auth.getSession();
    userName = ((sess && sess.session && sess.session.user && sess.session.user.email) || '').split('@')[0].toLowerCase();
  } catch(e){}
  const [c,n,s,j,t,a,w,lq,rg,tx,ty,aj,ast,aas] = await Promise.all([
    fetchAll('client','client_code'),
    fetchAll('business_nature'),
    fetchAll('staff'),
    fetchAll('service_job','id'),
    fetchAll('task_template'),
    fetchAll('assignment','id'),
    fetchAll('workload_year','id'),
    fetchAll('liquidation'),
    fetchAll('registration_job','id'),
    fetchAll('tax_month','id'),
    fetchAll('tax_year','id'),
    fetchAll('audit_jobs','id'),
    fetchAll('audit_staff','id'),

// หน้าสรุปงานรายพนักงานสำหรับพิมพ์/เซฟ PDF ส่งให้น้อง ๆ (31 ส.ค.) — ไม่มีข้อมูลเงิน เพราะผู้รับคือพนักงาน
// รวบรวมงานของพนักงานหนึ่งคน — ใช้ร่วมกันทั้งพิมพ์ PDF และออกไฟล์ Excel (31 ส.ค.)
function staffJobData(tok){
  const y = year();
  const asgY = D.assigns.filter(a=>a.work_year===y);
  const ROLES = ['Prepare','Support','Closing','Payroll']; // เพิ่ม Payroll 31 ส.ค. — เดิมคนที่ทำแค่เงินเดือนจะเห็นบริษัทโดยไม่มีชื่อตัวเองในตาราง
  const mine = {};
  asgY.filter(a=>a.staff_token===tok && a.role!=='Partner' && (a.role!=='Supervisor' || roleFrac(a.tax_id,'Supervisor',0)>0))
    .forEach(a=>{ (mine[a.tax_id] = mine[a.tax_id] || []).push(a.role); });
  const teamOf = (tax, role) => asgY.filter(a=>a.tax_id===tax && a.role===role)
    .sort((p,q)=>(+q.share_pct||100)-(+p.share_pct||100))
    .map(a=>({ tok:a.staff_token, nm: staffName(a.staff_token) + ((+a.share_pct||100)<100? ` ${Math.round(+a.share_pct)}%`:'') }));
  // ทีมของปีก่อนหน้า — บอกว่ารับงานต่อจากใคร (เทียบเฉพาะบทบาทที่คนนี้ทำอยู่)
  const asgPrev = D.assigns.filter(a=>a.work_year===y-1);
  const items = Object.keys(mine).map(tax=>{
    const c = D.clients.find(x=>x.tax_id===tax)||{};
    const prevBy = role => {
      const l = [...new Set(asgPrev.filter(a=>a.tax_id===tax && a.role===role).map(a=>a.staff_token))];
      if (!l.length) return '—';
      return l.map(t=>staffName(t)).join(' / ');
    };
    return { taxId: tax, code:c.client_code||'', name:c.name_th||'', group:c.client_group||'', status:c.status||'',
             team: ROLES.map(r=>teamOf(tax, r)), roles: mine[tax],
             prevPrep: prevBy('Prepare'), prevClose: prevBy('Closing') };
  });
  // จัดกลุ่มตาม Supervisor ของแต่ละบริษัท (2 ก.ย. — ผู้ใช้สั่งให้ใบงานเรียงตามกลุ่ม Supervisor)
  const supOf = tax => { const l = asgY.filter(a=>a.tax_id===tax && a.role==='Supervisor')
    .sort((p2,q)=>(+q.share_pct||100)-(+p2.share_pct||100)); return l.length ? l[0].staff_token : null; };
  items.forEach(x=>{ x.supTok = supOf(x.taxId || (D.clients.find(c=>c.client_code===x.code)||{}).tax_id); });
  const stRank = { Operate:0, Dormant:1, Closed:2, Settlement:3 };
  items.sort((a,b)=> ((stRank[a.status]??9)-(stRank[b.status]??9)) || a.code.localeCompare(b.code));
  const supKeys = [...new Set(items.map(x=>x.supTok||''))]
    .sort((a,b)=> (a===''?1:0)-(b===''?1:0) || String(staffName(a)).localeCompare(String(staffName(b)),'th'));
  const secs = supKeys.map(t=>[ t? 'Supervisor: ' + staffName(t) : '(ไม่มี Supervisor)', items.filter(x=>(x.supTok||'')===t) ])
    .filter(x=>x[1].length);
  const s = D.staff.find(x=>x.staff_token===tok)||{};
  return { y, items, secs, sName: staffName(tok), s, nRole: r => items.filter(x=>x.roles.includes(r)).length };
}

    [],

  ];
  secs.forEach(([t,list])=>{
    aoa.push([t + ' · ' + list.length + ' บริษัท']);
    list.forEach((x,i)=> aoa.push([i+1, x.code, x.name + (x.status && x.status!=='Operate' ? ' ('+(x.status==='Dormant'?'งบเปล่า':x.status==='Closed'?'เลิกกิจการ':x.status)+')' : ''), x.group||'—', ...x.team.map(txt), x.prevPrep, x.prevClose]));
  });
  aoa.push([]); aoa.push(['', 'รวมทั้งหมด ' + items.length + ' บริษัท']);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  // จัดหน้าตา (1 ก.ย.): กว้างครบ 10 คอลัมน์ (เดิมตกหล่น 2 คอลัมน์ปีก่อน) + ผสานเซลล์แถวหัวเรื่อง/หัวกลุ่ม + filter ที่หัวตาราง
  ws['!cols'] = [{wch:4},{wch:8},{wch:38},{wch:10},{wch:22},{wch:22},{wch:22},{wch:22},{wch:20},{wch:20}];

  aoa.forEach((row,ri)=>{
    const filled = row.filter(v=>v!=='' && v!==null && v!==undefined).length;

      merges.push({ s:{r:ri,c:0}, e:{r:ri,c:NCOL-1} });   // แถวหัวเรื่อง + แถวหัวกลุ่ม กินเต็มความกว้าง

  const wb = XLSX.utils.book_new();

// เกณฑ์ชั่วโมงมาตรฐานต่อเดือน (สูตรปี 2569) — คืน null สำหรับ Dormant/Closed/กลุ่มเหมา
function calcExpected(c, w){

  // ชั่วโมงที่ Partner ระบุใช้ได้ทุกกลุ่มและทุกสถานะ รวมกลุ่มเหมา BC/Constant/SOLVE และ Dormant/Closed
  // (แก้ 30 ส.ค. กลุ่มเหมา — และย้ายเช็คสถานะลงมาทีหลัง เพราะ Dormant/Closed ก็มีชั่วโมงปิดงบที่ Partner ระบุได้)
  if (w.expected_year_override !== null && w.expected_year_override !== undefined && w.expected_year_override !== '')
    return { exp: (+w.expected_year_override)/12, manual: true, parts: null };
  if (c.status !== 'Operate') return null;
  if (['SOLVE','Constant','BC'].includes(c.client_group)) return null; // กลุ่มเหมาไม่มีสูตรคำนวณ — ไม่มีค่า Partner ก็ไม่มีเกณฑ์
  const vt = +w.v_total || 0, ac = +w.account_count || 0;
  const vpm = vt / 12;
  const vol = vt > 0 ? Math.min(vpm,160)/18 + Math.max(0, vpm-160)/90 : (ac > 0 ? ac/18 : 0);
  const mult = c.record_mode === 'Import ระบบ' ? 0.2 : c.record_mode === 'ลูกค้าบันทึกเอง' ? 0.15 : 1;
  let cplx = Math.min(3.5, (w.hp==='Y'?1:0) + (w.lease==='Y'?1:0) + (w.loan_bank==='Y'?0.5:0));
  if (c.record_mode === 'ลูกค้าบันทึกเอง') cplx *= 0.5;
  const diff = w.difficulty === 'ยาก' ? 1.5 : w.difficulty === 'ปานกลาง' ? 1 : 0;
  const types = D.jobs.filter(j=>j.tax_id===c.tax_id && j.active==='Y').map(j=>j.service_type);
  const monthly = (types.includes('PAY')?2:0) + (types.includes('MFS')?1.2:0) + (types.includes('VAT')?0.4:0) + (types.includes('WHT')?0.3:0);
  return { exp: 2.5 + vol*mult + cplx + diff + monthly, parts: { vol: vol*mult, cplx, diff, monthly } };
}
// ชั่วโมงหลักที่ใช้คำนวณทั้งระบบ (คำสั่งผู้ใช้ 30 ส.ค. 2569): ใช้ชั่วโมงที่ Partner ระบุ (เกณฑ์/ปี) เป็นหลัก
// ชั่วโมงที่น้อง ๆ กรอกเป็นข้อมูลเปรียบเทียบ — บริษัทที่ไม่มีเกณฑ์ (Dormant/Closed/เหมา) ใช้ชั่วโมงที่กรอกตามเดิม
function calcUsedHY(c, w){
  const eo = calcExpected(c, w||{});
  if (eo) return eo.exp*12;
  return hoursYearOf(w) ?? 0;
}
// ชม./ปี (จริง) = ชม./เดือน × 12 + ชม.ปิดงบ — คิดสดทุกครั้ง ตรงกับสูตรคอลัมน์ ชม./ปี ในไฟล์ Excel
// ไม่อ่านค่า hours_year ที่เก็บไว้ เพราะแถวที่ไม่เคยแก้ผ่านหน้าจอจะค้างเป็นค่าว่าง
function hoursYearOf(w){
  if (!w) return null;
  const hm = w.hours_month, hcy = w.hours_close_year;
  const eM = (hm===null||hm===undefined||hm===''), eC = (hcy===null||hcy===undefined||hcy==='');
  if (eM && eC) return null;
  return Math.round(((+hm||0)*12 + (+hcy||0))*10)/10;
}
function calcUsedHM(c, w){
  const eo = calcExpected(c, w||{});
  if (eo){
    // Partner ระบุชั่วโมง/เดือนแยกได้ (expected_month_override) — ไม่ระบุใช้ ปี÷12
    if (w && w.expected_month_override!==null && w.expected_month_override!==undefined && w.expected_month_override!=='') return +w.expected_month_override;
    return eo.exp;
  }
  return (w && w.hours_month!==null && w.hours_month!==undefined && w.hours_month!=='') ? +w.hours_month : 0;
}
// % ผลต่างรายเดือน = (ชม. Partner/เดือน − ชม./เดือนจริง) ÷ ชม. Partner/เดือน × 100 — ติดลบ = จริงเกิน (null = คำนวณไม่ได้)
function calcPctDiffM(c, w){
  const eo = calcExpected(c, w||{});
  if (!eo) return null;
  const p = calcUsedHM(c, w);
  const s = (w && w.hours_month!==null && w.hours_month!==undefined && w.hours_month!=='') ? +w.hours_month : null;
  if (!(p>0) || s===null) return null;
  return (p - s) / p * 100; // ติดลบ = ชั่วโมงจริงเกินที่ Partner กำหนด
}
// % ผลต่างปิดงบ = (ชม.ปิดงบ Partner − ชม.ปิดงบจริง) ÷ ของ Partner × 100 — ติดลบ = จริงเกิน (null = คำนวณไม่ได้)
function calcPctDiffC(c, w){
  const p = (w && w.expected_close_override!==null && w.expected_close_override!==undefined && w.expected_close_override!=='') ? +w.expected_close_override : null;
  const s = (w && w.hours_close_year!==null && w.hours_close_year!==undefined && w.hours_close_year!=='') ? +w.hours_close_year : null;
  if (!(p>0) || s===null) return null;
  return (p - s) / p * 100; // ติดลบ = ชั่วโมงจริงเกินที่ Partner กำหนด
}
// % ผลต่าง = (ชม. Partner/ปี − ชม./ปีจริง) ÷ ชม. Partner × 100 — ติดลบ = จริงเกิน (null = คำนวณไม่ได้)
function calcPctDiff(c, w){
  const eo = calcExpected(c, w||{});
  const p = eo ? eo.exp*12 : null;
  const s = hoursYearOf(w);
  if (p===null || p===0 || s===null) return null;
  return (p - s) / p * 100; // ติดลบ = ชั่วโมงจริงเกินที่ Partner กำหนด
}
function calcHoursClass(c, w){
  if (!c) return '';
  if (c.status === 'Dormant') return 'งบเปล่า (Dormant)';
  if (c.status === 'Closed') return 'เลิกกิจการ (Closed)';
  if (c.status && c.status !== 'Operate') return c.status; // สถานะที่ผู้ใช้เพิ่มเอง — เป็นกลุ่มของตัวเอง ไม่เข้าเกณฑ์คำนวณ
  if (['SOLVE','Constant','BC'].includes(c.client_group)) return 'เหมาตามข้อตกลง'; // TOY และ GGT ออกจากเหมาแล้ว 29 ส.ค. 2569 — คิดเกณฑ์ปกติ (GGT = PUI ทำคนเดียว)
  // "มีชั่วโมงจริงแล้ว" = กรอกช่องใดช่องหนึ่ง (เดือน หรือ ปิดงบ) — แก้ 31 ส.ค. เดิมดูแต่ช่องเดือน
  // ทำให้บริษัทงานปิดงบล้วน (เช่น สหพร้อม ปิดงบ 24 ชม. ไม่มีงานรายเดือน) ค้างอยู่กลุ่ม "รอใส่ชั่วโมง" ทั้งที่กรอกแล้ว
  const hasReal = hoursYearOf(w) !== null;
  if (!w || !hasReal) return 'รอใส่ชั่วโมงการทำงาน';
  const hm = +(w.hours_month || 0);
  if (hm === 0) return 'ปิดปีเท่านั้น'; // ไม่มีงานรายเดือน มีแต่ชั่วโมงปิดงบ
  // ไม่มีชั่วโมงที่ Partner ระบุ → รอใส่ชั่วโมงการทำงาน (คำสั่งผู้ใช้ 30 ส.ค. 2569)
  const eo = calcExpected(c, w);
  if (!(eo && eo.manual)) return 'รอใส่ชั่วโมงการทำงาน';
  // แบ่ง 3 กลุ่มตาม % ผลต่างชั่วโมง Partner เทียบชั่วโมงจริง
  const pd = calcPctDiff(c, w);
  if (pd === null) return 'อื่น ๆ';
  return Math.abs(pd) > 15 ? 'เกิน 15%' : 'ต่ำกว่า 15%';
}

function ensureFracDB(){
  if (!roleFracDB) roleFracDB = {};
  if (!roleFracDB.def) roleFracDB.def = {...FRAC_DEF_FALLBACK};
  if (!roleFracDB.companies) roleFracDB.companies = JSON.parse(JSON.stringify(FRAC_CO_FALLBACK));
}
function fracDef(){ return (roleFracDB && roleFracDB.def) ? Object.assign({}, FRAC_DEF_FALLBACK, roleFracDB.def) : FRAC_DEF_FALLBACK; }
function fracCompanies(){ return (roleFracDB && roleFracDB.companies) || FRAC_CO_FALLBACK; }
// สัดส่วนมาตรฐานต่อบทบาท (เป็นเศษส่วน 0-1)
function defFrac(role, hasSupp){
  const d = fracDef();
  if (role==='Prepare') return (hasSupp ? d.prep : d.prepNoSupp)/100;
  if (role==='Support') return d.supp/100;
  if (role==='Closing') return d.close/100;
  return 0;
}
function roleFrac(tax, role, def){
  const c = D.clients.find(x=>x.tax_id===tax);
  if (!c) return def;
  const cos = fracCompanies();
  // รายบริษัทชนะรายกลุ่ม — คีย์ในตารางข้อตกลงเป็นได้ทั้งตัวย่อบริษัทและชื่อกลุ่ม (เช่น BC, Constant)
  const co = cos[c.client_code], gr = cos[c.client_group||''];
  const pick = (o) => (o && o[role] !== undefined && o[role] !== null && o[role] !== '') ? (+o[role])/100 : undefined;
  const v = pick(co) !== undefined ? pick(co) : pick(gr);
  return v !== undefined ? v : def;
}
// รูปแบบเดียวกับไฟล์ Excel/Monday: ตำแหน่ง-ตัวย่อ (ชื่อเล่น) เช่น M-SUH (PUI), J-KSJ (TEE)
function staffName(tok){
  if (tok==='CLIENT') return 'Client';
  if (tok==='PARTNER') return 'Partner';
  if (tok==='TRAINEE') return 'Trainee';
  const s=D.staff.find(x=>x.staff_token===tok);
  if (s){
    const nick = s.token_en || s.nickname || '';
    const ini = LEVEL_INI[s.level];
    const base = ini ? ini+'-'+tok : tok;
    return (nick && nick !== tok) ? base+' ('+nick+')' : base;
  }
  if (tok==='CLIENT') return 'Client';
  if (tok==='PARTNER') return 'Partner';
  if (tok==='TRAINEE') return 'Trainee';
  return tok;
}

const COL_KEYS_DEFAULT = ['code','name','type','status','group','hm','hcy','hy','expM','expC','expY','pdiff','fee','feeHrP','feeHrS','diff','hcls','VAT','MFS','PAY','Partner','Supervisor','Prepare','Prep68','Support','Closing','Close68'];
// ---- ความจุชั่วโมงทำงานต่อคนต่อปี — แก้ได้ที่แถบ "วิธีคิด" เก็บใน app_setting key capacity ใช้ร่วมกันทุกเครื่อง ----
// ผู้ใช้ยืนยัน 30 ส.ค.: ไม่นับวันเสาร์เข้าเป็นความจุ — ห้ามเติมรายการเสาร์กลับ (เพิ่มเองได้ที่แถบวิธีคิดถ้าเปลี่ยนใจ)
const CAP_DEFAULT = { hpd: 8, items: [
  { label:'วันจันทร์–ศุกร์ต่อปี', days: 260 },
  { label:'หัก วันหยุดตามประเพณี', days: -15 },
  { label:'หัก พักร้อน', days: -6 },
]};
let capDB = null;
function getCap(){
  const c = capDB && typeof capDB==='object' ? capDB : CAP_DEFAULT;
  return { hpd: (+c.hpd || 0), items: Array.isArray(c.items) ? c.items : [] };
}
function capDays(){ return getCap().items.reduce((s,it)=> s + (+it.days || 0), 0); }
function capYear(){ const c = getCap(); return Math.round(capDays() * c.hpd * 10) / 10; }
function capPersist(){
  sb.from('app_setting').upsert({ key:'capacity', value: capDB }, { onConflict:'key' })
    .then(({error})=>{ if (error) toast('บันทึกความจุไม่สำเร็จ: ' + error.message); });
}
function capEdit(fn){ const c = getCap(); capDB = { hpd:c.hpd, items:c.items.map(x=>({...x})) }; fn(capDB); capPersist(); renderDash(); }
function capSetHpd(v){ const n = +v; if (isNaN(n) || n<0){ toast('ต้องเป็นตัวเลขชั่วโมงต่อวัน'); return; } capEdit(c=>{ c.hpd = n; }); }
function capSetDays(i, v){ const n = +v; if (v!=='' && isNaN(n)){ toast('ต้องเป็นตัวเลขจำนวนวัน'); return; } capEdit(c=>{ if (c.items[i]) c.items[i].days = v===''?0:n; }); }
function capSetLabel(i, v){ capEdit(c=>{ if (c.items[i]) c.items[i].label = (v||'').trim() || 'รายการใหม่'; }); }
function capAdd(){ capEdit(c=>{ c.items.push({ label:'รายการใหม่', days: 0 }); }); }
function capDel(i){ capEdit(c=>{ c.items.splice(i,1); }); }
function capReset(){ if (!confirm('คืนค่าความจุเป็นค่าเริ่มต้น (จันทร์–ศุกร์ 260 − วันหยุด 15 − พักร้อน 6 = 239 วัน × 8 ชม. = 1,912) ?')) return;
  capDB = null; sb.from('app_setting').delete().match({ key:'capacity' }).then(()=>{}); renderDash(); }

let colOrderDB = null; // ค่าจากตาราง app_setting — ใช้ร่วมกันทุกคนทุกเครื่อง
let hiddenColsDB = null, dashSort = null, colMenuKey = null;
function toggleColMenu(k){
  const el = document.getElementById('colmenu-' + k);
  if (!el) return;
  const wasOpen = el.style.display !== 'none';
  document.querySelectorAll('.colmenu').forEach(d=>d.style.display='none');
  if (!wasOpen) el.style.display = 'block';
}
document.addEventListener('click', e => {
  if (e.target.closest && (e.target.closest('.colmenu') || e.target.closest('.cmb'))) return;
  document.querySelectorAll('.colmenu').forEach(d=>d.style.display='none');
});
function setSort(k, dir){ dashSort = dir ? { k, dir } : null; colMenuKey = null; renderDash(); }
function getHiddenCols(){
  if (Array.isArray(hiddenColsDB)) return [...hiddenColsDB];
  try { const h = JSON.parse(localStorage.getItem('bbt_col_hidden')); if (Array.isArray(h)) return h; } catch(e){}
  return [];
}
function saveHiddenCols(h){
  hiddenColsDB = h;
  try { localStorage.setItem('bbt_col_hidden', JSON.stringify(h)); } catch(e){}
  sb.from('app_setting').upsert({ key:'col_hidden', value:h }, { onConflict:'key' }).then(()=>{});
}
function hideCol(k){ const h = getHiddenCols(); if (!h.includes(k)) h.push(k); saveHiddenCols(h); colMenuKey = null; renderDash(); }
function unhideCol(k){ saveHiddenCols(getHiddenCols().filter(x=>x!==k)); renderDash(); }
function getColOrder(){
  let saved = colOrderDB;
  if (!Array.isArray(saved)){
    try { saved = JSON.parse(localStorage.getItem('bbt_col_order')); } catch(e){}
  }
  if (!Array.isArray(saved)) return [...COL_KEYS_DEFAULT];
  const valid = saved.filter(k=>COL_KEYS_DEFAULT.includes(k));
  // คอลัมน์ใหม่ที่ยังไม่อยู่ในลำดับที่บันทึกไว้ — แทรกตามตำแหน่งมาตรฐาน (ไม่ไปโผล่ท้ายสุด)
  COL_KEYS_DEFAULT.forEach((k,i)=>{
    if (valid.includes(k)) return;
    const prev = COL_KEYS_DEFAULT.slice(0,i).reverse().find(p=>valid.includes(p));
    valid.splice(prev ? valid.indexOf(prev)+1 : 0, 0, k);
  });
  return valid;
}
function saveColOrder(o){
  colOrderDB = o;
  try { localStorage.setItem('bbt_col_order', JSON.stringify(o)); } catch(e){}
  sb.from('app_setting').upsert({ key:'col_order', value:o }, { onConflict:'key' })
    .then(({error})=>{ if (error) toast('บันทึกลำดับขึ้นระบบไม่สำเร็จ (ใช้ได้เฉพาะเครื่องนี้): ' + error.message); });
}
let colDragKey = null;
function colDragStart(e, k){
  colDragKey = k;
  try { e.dataTransfer.setData('text/plain', k); e.dataTransfer.effectAllowed = 'move'; } catch(x){}
  e.currentTarget.style.opacity = '.4';
}
function colDragOver(e){
  e.preventDefault();
  try { e.dataTransfer.dropEffect = 'move'; } catch(x){}
  const th = e.currentTarget;
  if (!th.dataset.hl){ th.dataset.hl = '1'; th.style.background = 'var(--blue-bg)'; th.style.boxShadow = 'inset 3px 0 0 var(--blue)'; }
}
function colDragLeave(e){
  const th = e.currentTarget;
  delete th.dataset.hl; th.style.background = ''; th.style.boxShadow = '';
}
function colDragEnd(e){ e.currentTarget.style.opacity = ''; colDragKey = null; }
function colDrop(e, k){
  e.preventDefault();
  const from = colDragKey || (()=>{ try { return e.dataTransfer.getData('text/plain'); } catch(x){ return null; } })();
  colDragKey = null;
  if (!from || from===k){ renderDash(); return; }
  const o = getColOrder();
  o.splice(o.indexOf(k), 0, o.splice(o.indexOf(from),1)[0]);
  saveColOrder(o);
  renderDash();
}
function colOrderReset(){
  colOrderDB = null;
  try { localStorage.removeItem('bbt_col_order'); } catch(e){}
  sb.from('app_setting').delete().match({ key:'col_order' }).then(()=>{});
  renderDash();
}
function colMove(k, dir){
  const o = getColOrder(); const i = o.indexOf(k); const j = i + dir;
  if (i < 0 || j < 0 || j >= o.length) return;
  [o[i], o[j]] = [o[j], o[i]];
  saveColOrder(o);
  renderDash();
}

// ---- ลากขอบขวาหัวคอลัมน์เพื่อปรับความกว้าง (30 ส.ค.) — จำต่อเครื่องใน localStorage bbt_col_w ----
let colWidthDB = null; // ความกว้างคอลัมน์ที่บันทึกขึ้นระบบ (app_setting key col_width) — ใช้ร่วมกันทุกเครื่อง
function colWAllStore(){
  if (colWidthDB && typeof colWidthDB==='object') return colWidthDB;
  try { return JSON.parse(localStorage.getItem('bbt_col_w')||'{}'); } catch(e){ return {}; }
}
function colW(grp, key, def){ const all = colWAllStore(); return (all[grp] && all[grp][key]) || def; }
async function saveColWidths(all){
  colWidthDB = all;
  try { localStorage.setItem('bbt_col_w', JSON.stringify(all)); } catch(e){}
  const { error } = await sb.from('app_setting').upsert({ key:'col_width', value: all }, { onConflict:'key' });
  if (error) toast('บันทึกความกว้างขึ้นระบบไม่สำเร็จ: ' + error.message);
}
function colWDown(e, grp, key){
  e.preventDefault(); e.stopPropagation();
  const th = e.target.closest('th'); if (!th) return;
  const x0 = e.clientX, w0 = th.getBoundingClientRect().width;
  const mv = ev => { th.style.width = Math.max(40, w0 + (ev.clientX - x0)) + 'px'; };
  const up = () => {
    document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up);
    try { const all = JSON.parse(localStorage.getItem('bbt_col_w')||'{}'); (all[grp] = all[grp]||{})[key] = Math.round(th.getBoundingClientRect().width); localStorage.setItem('bbt_col_w', JSON.stringify(all)); } catch(err){}
  };
  document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
}
// ที่จับสำหรับลากปรับความกว้าง — วางไว้ขอบขวาของ th (th ต้องมี position:relative)
function colWHandle(grp, key){ return `<span onpointerdown="colWDown(event,'${grp}','${key}')" title="ลากเพื่อปรับความกว้างคอลัมน์" style="position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;touch-action:none"></span>`; }
// ---- ปรับความกว้างคอลัมน์ได้ทุกตารางทุกแถบ (30 ส.ค.) — ติดที่จับให้หัวคอลัมน์ที่ลากย้ายได้ (th[data-dragkey]) อัตโนมัติหลัง render ----
function colWAll(g){ const all = colWAllStore(); return all[g] || null; }
async function colWReset(g){
  const all = JSON.parse(JSON.stringify(colWAllStore())); delete all[g];
  await saveColWidths(all);
  toast('คืนความกว้างคอลัมน์อัตโนมัติแล้ว'); renderDash();
}
function colWDown2(e, th){
  e.preventDefault(); e.stopPropagation();
  const tbl = th.closest('table'); const g = th.dataset.draggrp;
  const ths = [...th.closest('tr').querySelectorAll('th[data-dragkey]')];
  // ตรึงความกว้างปัจจุบันของทุกคอลัมน์ก่อน แล้วสลับตารางเป็น fixed — จะได้ลากทั้งกว้างขึ้นและแคบลงได้จริง
  const widths = ths.map(t=>t.getBoundingClientRect().width);
  ths.forEach((t,i)=>t.style.width = widths[i]+'px');
  if (tbl){ tbl.style.tableLayout='fixed'; tbl.style.width='max-content'; }
  const x0 = e.clientX, w0 = th.getBoundingClientRect().width;
  const mv = ev => { th.style.width = Math.max(36, w0 + (ev.clientX - x0)) + 'px'; };
  const up = () => {
    document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up);
    const all = JSON.parse(JSON.stringify(colWAllStore())); const o = all[g] = all[g] || {};
    ths.forEach(t => o[t.dataset.dragkey] = Math.round(t.getBoundingClientRect().width));
    saveColWidths(all);
  };
  document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
}
// จับขอบขวาของหัวคอลัมน์ระดับเอกสาร (31 ส.ค.) — ใช้ระยะห่างจากขอบแทนการชน element
// เพราะหัวคอลัมน์เป็น sticky ที่สร้างชั้นซ้อนของตัวเอง ตัวจับที่ยื่นออกนอกช่องจะถูกช่องถัดไปทับ
const COLW_EDGE = 12; // ระยะจากขอบขวาที่ถือว่าเป็นการจับปรับความกว้าง (พิกเซล)
function colWTargetTh(e){
  const el = e.target && e.target.closest ? e.target.closest('th[data-dragkey][data-draggrp]') : null;
  if (!el) return null;
  const g = el.dataset.draggrp;
  if (g==='tabs' || g==='ptabs') return null;
  return (e.clientX >= el.getBoundingClientRect().right - COLW_EDGE) ? el : null;
}
document.addEventListener('pointerdown', e => {
  if (e.button !== undefined && e.button !== 0) return;
  const th = colWTargetTh(e);
  if (!th) return;
  e.preventDefault(); e.stopPropagation(); // กันไม่ให้ไปเริ่มลากย้ายคอลัมน์
  colWDown2(e, th);
}, true);
document.addEventListener('dblclick', e => {
  const th = colWTargetTh(e);
  if (!th) return;
  e.preventDefault(); e.stopPropagation();
  colWReset(th.dataset.draggrp);
}, true);
// ชี้ใกล้ขอบ → เปลี่ยนเคอร์เซอร์เป็น ↔ และไฮไลต์เส้นให้เห็นว่าจับได้
document.addEventListener('pointermove', e => {
  const el = e.target && e.target.closest ? e.target.closest('th[data-dragkey][data-draggrp]') : null;
  if (!el) return;
  const g = el.dataset.draggrp; if (g==='tabs' || g==='ptabs') return;
  const near = e.clientX >= el.getBoundingClientRect().right - COLW_EDGE;
  el.style.cursor = near ? 'col-resize' : 'grab';
  const h = el.querySelector('.cwh');
  if (h) h.style.background = near ? 'var(--blue)' : 'var(--line)';
}, true);
function attachColResize(){
  const root = document.getElementById('dash'); if (!root) return;
  const grps = {};
  root.querySelectorAll('th[data-dragkey][data-draggrp]').forEach(th=>{
    const g = th.dataset.draggrp; if (g==='tabs'||g==='ptabs') return;
    (grps[g] = grps[g]||[]).push(th);
    if (getComputedStyle(th).position==='static') th.style.position='relative';
    if (!th.querySelector('.cwh')){
      const h = document.createElement('span');
      h.className = 'cwh';
      h.title = 'ลากเพื่อปรับความกว้างคอลัมน์ · ดับเบิลคลิกเพื่อคืนความกว้างอัตโนมัติทั้งตาราง';
      h.style.cssText = 'position:absolute;right:0;top:3px;bottom:3px;width:3px;pointer-events:none;z-index:9;background:var(--line);border-radius:2px';
      th.appendChild(h);
    }
  });
  // ตารางที่เคยปรับไว้ — ใช้ความกว้างที่จำไว้ทันที
  Object.entries(grps).forEach(([g, ths])=>{
    const saved = colWAll(g); if (!saved) return;
    const tbl = ths[0].closest('table');
    if (tbl){ tbl.style.tableLayout='fixed'; tbl.style.width='max-content'; }
    ths.forEach(th=>{ const w = saved[th.dataset.dragkey]; if (w) th.style.width = w+'px'; });
  });
}
// ---- ระบบลากด้วย pointer (30 ส.ค.) — ใช้กับ "ทุกแถบ": แถวแถบบน + หัวคอลัมน์ทุกตาราง รองรับทั้งเมาส์และจอสัมผัส ----
// grp: 'tabs' = แถวแถบ · 'dash' = ตารางลูกค้า/กลุ่มลูกค้า (col_order ร่วมกัน) · 'entry' · 'staff' · 'frac' · 'liq'
let colPtr = null;
window.__tabDragged = false;
function pDrag(grp, k){ return `data-draggrp="${grp}" data-dragkey="${k}" onpointerdown="colPointerDown(event,'${grp}','${k}')"`; }
function colPointerDown(e, grp, key){
  if (e.button !== undefined && e.button !== 0) return;
  colPtr = { grp, key, x: e.clientX, y: e.clientY, moved: false, el: e.currentTarget };
}
// หาหัวคอลัมน์เป้าหมายจากตำแหน่งเมาส์ — ถ้าไม่ได้อยู่บนหัวคอลัมน์พอดี ใช้คอลัมน์ที่ตรงกับตำแหน่งแนวนอนแทน
// (แก้ 31 ส.ค. — เดิมต้องปล่อยเมาส์บนหัวคอลัมน์อื่นเป๊ะ ๆ เหลื่อมนิดเดียวก็เด้งกลับ ผู้ใช้เลยรู้สึกว่าลากไม่ได้)
function colDropTarget(grp, x, y){
  const direct = document.elementFromPoint(x, y);
  const t = direct && direct.closest ? direct.closest(`[data-draggrp="${grp}"]`) : null;
  if (t) return t;
  let best = null, bestDy = Infinity;
  document.querySelectorAll(`[data-draggrp="${grp}"]`).forEach(el => {
    const r = el.getBoundingClientRect();
    if (x >= r.left && x <= r.right){
      const dy = y < r.top ? r.top - y : (y > r.bottom ? y - r.bottom : 0);

function numPass(val, expr){
  if (!expr) return true;
  const n = +val;
  if (val === null || val === undefined || val === '' || isNaN(n)) return false;
  const e = String(expr).replace(/\s/g,''); let m;
  if (m = e.match(/^>(-?[\d.]+)$/))  return n > +m[1];
  if (m = e.match(/^<(-?[\d.]+)$/))  return n < +m[1];
  if (m = e.match(/^(-?[\d.]+)~(-?[\d.]+)$/)) return n >= +m[1] && n <= +m[2];
  if (m = e.match(/^([\d.]+)-([\d.]+)$/)) return n >= +m[1] && n <= +m[2];
  if (m = e.match(/^=(-?[\d.]+)$/))  return n === +m[1];
  if (m = e.match(/^(-?[\d.]+)$/))   return n >= +m[1];
  return true;
}

// อัตราต่อชั่วโมง = ค่าทำบัญชีทั้งปี (×12) ÷ ชม./ปี — คิดสองแบบ: basis 'partner' = ชั่วโมงที่ Partner ระบุ, 'staff' = ชั่วโมงที่น้อง ๆ กรอก
function feePerHour(c, w, basis){
  const f = feeMonthOf(c.tax_id);
  if (f===null) return null;
  let hy;
  if (basis==='staff') hy = hoursYearOf(w);
  else { const eo = calcExpected(c, w||{}); hy = eo ? eo.exp*12 : null; }
  if (!(hy>0)) return null;
  return f*12/hy;
}

function toISODate(v){
  const t = (v||'').trim(); if (!t) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (!m) return t;
  const d = +m[1], mo = +m[2]; let yr = +m[3];
  if (yr > 2400) yr -= 543;
  return `${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

let entryDirty = {}, entryYear = null;
function onEntryInput(tax, field, val){

  if (field==='expected_month_override' || field==='expected_close_override'){

    entryDirty[tax].expected_year_override = expYearCalc(xm, xc);
    const zEl = document.getElementById('expy-'+tax);
    if (zEl) zEl.textContent = entryDirty[tax].expected_year_override===null ? '—' : (+entryDirty[tax].expected_year_override).toLocaleString();
  }
  const wLive = {...w0, ...entryDirty[tax]};
  const st = calcHoursClass(c, wLive);
  const cell = document.getElementById('est-'+tax);
  if (cell){
    const m = {'เกิน 15%':'var(--red)','ต่ำกว่า 15%':'var(--green)'};
    cell.textContent = st; cell.style.color = m[st] || 'var(--mut)';
    cell.style.fontWeight = st==='เกิน 15%' ? '600' : '400';
  }
  // อัปเดต % ผลต่าง/ปี สด ๆ ระหว่างพิมพ์
  const pdCell = document.getElementById('pd-'+tax);
  if (pdCell){
    const pd = calcPctDiff(c, wLive);
    pdCell.textContent = pd===null ? '—' : (pd>0?'+':'') + (Math.round(pd*10)/10).toLocaleString() + '%';
    pdCell.style.color = pd===null ? 'var(--mut)' : (pd<0 ? 'var(--red)' : 'var(--txt)');
  }
  const btn = document.getElementById('entrySaveBtn');
  if (btn) btn.textContent = `บันทึก (${Object.keys(entryDirty).length} บริษัท)`;
}
let entryQ = '';
function entryFilter(v){
  entryQ = (v||'').toLowerCase();
  document.querySelectorAll('.entry-row').forEach(r=>{ r.style.display = r.dataset.q.includes(entryQ) ? '' : 'none'; });

async function saveEntry(){
  const y = year(); const taxes = Object.keys(entryDirty);
  if (!taxes.length){ toast('ยังไม่มีการแก้ไข'); return; }
  for (const tax of taxes){
    const patch = entryDirty[tax];
    const { error } = await sb.from('workload_year').upsert({ work_year: y, tax_id: tax, ...patch }, { onConflict: 'work_year,tax_id' });
    if (error){ toast('บันทึกไม่สำเร็จ: ' + error.message); return; }
    const w = D.works.find(x=>x.tax_id===tax && x.work_year===y);
    if (w) Object.assign(w, patch); else D.works.push({ work_year: y, tax_id: tax, ...patch });
  }
  entryDirty = {}; entryEditTax = null;
  toast(`บันทึกแล้ว ${taxes.length} บริษัท`);
  renderDash();
}

let entryEditTax = null;

function renderDash(){
  // พนักงานถูกจำกัดแถบ — ถ้าแถบปัจจุบันไม่ได้รับอนุญาต เด้งไปแถบแรกที่เห็นได้
  if (!canSeeTab(dashTab)) dashTab = ['client','grp','staff','entry','frac','liq','reg','tax','taxy','audit','help'].find(canSeeTab) || 'client';
  const y = year();
  const works = D.works.filter(w=>w.work_year===y);
  const wByTax = {}; works.forEach(w=>wByTax[w.tax_id]=w);
  const asg = D.assigns.filter(a=>a.work_year===y);
  const asg68 = D.assigns.filter(a=>a.work_year===2568); // ทีมจริงปี ค.ศ. 2025 ไว้เทียบว่าใครย้ายไปใคร
  const cls = c => calcHoursClass(c, wByTax[c.tax_id]);
  const LVL_BASE = ['Partner','Manager','Senior','Junior','Trainee','Admin','Maid'];
  const LEVELS = LVL_BASE.concat([...new Set(D.staff.map(x=>x.level).filter(Boolean))].filter(x=>!LVL_BASE.includes(x) && x!=='-').sort());
  const hiddenCols = getHiddenCols();
  const colOrder = getColOrder().filter(k=>!hiddenCols.includes(k)).filter(k=>canSeeMoney()||!MONEY_COLS.includes(k));
  const COL_LABELS = { code:'ตัวย่อ', name:'ชื่อบริษัท', expM:'ชม./เดือน (Partner)', expC:'ชม.ปิดงบ/ปี (Partner)', expY:'ชั่วโมงรวม/ปี (Partner)', pdiff:'% ผลต่าง', fee:'ค่าทำบัญชี/เดือน', feeHrP:'บ./ชม. (Partner)', feeHrS:'บ./ชม. (จริง)', type:'ประเภท', status:'สถานะ', group:'กลุ่ม', hm:'ชม./เดือน (จริง)', hcy:'ชม.ปิดงบ/ปี (จริง)', hy:'ชั่วโมงรวม/ปี (จริง)', diff:'ความยาก', hcls:'กลุ่มชั่วโมง', VAT:'VAT', MFS:'Monthly FS', PAY:'PAY', Partner:'Partner', Supervisor:'Supervisor', Prepare:'Prepare', Prep68:'Prepare 2025', Support:'Support', Closing:'Closing', Close68:'Closing 2025' };
  // ชั่วโมงที่ใช้คำนวณ = ชั่วโมงที่ Partner ระบุเป็นหลัก (calcUsedHM/HY)
  const hrs = c => calcUsedHM(c, wByTax[c.tax_id]);
  const CL = [
    ['เกิน 15%','red'], ['ต่ำกว่า 15%','green'], ['อื่น ๆ',''],
    ['ปิดปีเท่านั้น',''], ['เหมาตามข้อตกลง',''], ['รอใส่ชั่วโมงการทำงาน','amber'], ['งบเปล่า (Dormant)',''], ['เลิกกิจการ (Closed)',''],
  ];
  const counts = {}; D.clients.forEach(c=>{ const k=cls(c); if(k) counts[k]=(counts[k]||0)+1; });
  const hrsY = c => calcUsedHY(c, wByTax[c.tax_id]);
  const cByTax = {}; D.clients.forEach(c=>cByTax[c.tax_id]=c);
  const totalH = D.clients.reduce((s,c)=>s+hrs(c),0);
  const totalHY = D.clients.reduce((s,c)=>s+hrsY(c),0);

  const hq = (search.value||'').toLowerCase(), hst = statusSel.value;
  const cType = c => c.client_type || 'Account';
  // รายการประเภททั้งหมด (Account/Consult ก่อน แล้วตามด้วยประเภทที่เพิ่มเอง)
  const TYPES = ['Account','Account-Q','Consult'].concat([...new Set(D.clients.map(cType))].filter(t=>!['Account','Account-Q','Consult'].includes(t)).sort()); // Account-Q ต่อจาก Account (3 ก.ย.)
  // ยังต้องยื่น ภ.พ.30 ทุกเดือน = มีงานบริการ VAT ที่ยัง active (ใช้ได้กับ Closed ที่ยังไม่จด ภ.พ.09)
  const hasPP30 = c => D.jobs.some(j=>j.tax_id===c.tax_id && j.active==='Y' && j.service_type==='VAT');
  const STK = ['Operate','Dormant','Closed'];
  const stKey = c => c.status || 'อื่น ๆ';
  const STATUSES = STK.concat([...new Set(D.clients.map(stKey))].filter(x=>!STK.includes(x)).sort());
  // base = ผ่านค้นหา + กลุ่มชั่วโมง แต่ยังไม่กรองประเภท/สถานะ — ใช้เป็นตัวเลขในเมทริกซ์
  const partnerOf = {}; asg.forEach(a=>{ if (a.role==='Partner') partnerOf[a.tax_id]=a.staff_token; });
  // scope0 = ผ่านค้นหา + กลุ่มชั่วโมง (ใช้นับตัวเลือกในตัวกรอง Partner/กลุ่ม)
  const scope0 = inScope(D.clients).filter(c=>{
    if (!cls(c) || (dashFilter && cls(c)!==dashFilter)) return false;
    return !hq || (c.client_code+' '+c.name_th+' '+c.tax_id).toLowerCase().includes(hq);
  });
  const pCount = {}; let pNone = 0;
  scope0.forEach(c=>{ const t=partnerOf[c.tax_id]; if (t) pCount[t]=(pCount[t]||0)+1; else pNone++; });
  const gCount = {};
  scope0.forEach(c=>{ const g=c.client_group||'(ไม่ระบุ)'; gCount[g]=(gCount[g]||0)+1; });
  const gNames = Object.keys(gCount).sort((a,b)=>gCount[b]-gCount[a] || a.localeCompare(b));
  const gAll = [...new Set(D.clients.map(c=>c.client_group||'Others'))].sort();
  // base = scope0 + Partner + กลุ่ม — เมทริกซ์ด้านบนนับจากชุดนี้ (ตัวกรองสองตัวนี้คือ "ดูพอร์ตของใคร")
  const base = scope0.filter(c=>{
    if (dashPartner){ const t = partnerOf[c.tax_id]||''; if (dashPartner==='(none)' ? !!t : t!==dashPartner) return false; }
    if (dashGroup && (c.client_group||'(ไม่ระบุ)')!==dashGroup) return false;
    return true;
  });
  const ST = STATUSES;
  const cell = {};
  const ck = (t,s)=>t+'|'+s;
  TYPES.concat('*').forEach(t=>ST.concat('*').forEach(s=>cell[ck(t,s)]={n:0,pp30:0,hy:0}));
  base.forEach(c=>{
    const t=cType(c), s=stKey(c), p=hasPP30(c)?1:0, h=hrsY(c);
    [ck(t,s), ck(t,'*'), ck('*',s), ck('*','*')].forEach(k=>{ const o=cell[k]; if(!o) return; o.n++; o.pp30+=p; o.hy+=h; });
  });
  const jobOn = (c,type) => D.jobs.some(j=>j.tax_id===c.tax_id && j.service_type===type && j.active==='Y');
  const roleHas = (tax, role, tok) => {
    const list = asg.filter(x=>x.tax_id===tax && x.role===role);
    return tok==='(none)' ? list.length===0 : list.some(x=>x.staff_token===tok);
  };
  let rows = base.filter(c=>{
    if (dashType && cType(c)!==dashType) return false;
    if (hst && c.status!==hst) return false;
    if (dashPP==='yes' && !hasPP30(c)) return false;
    const F = dashColF, w = wByTax[c.tax_id]||{};
    if (F.code && !(c.client_code||'').toLowerCase().includes(F.code.toLowerCase())) return false;
    if (F.name && !(c.name_th+' '+c.tax_id).toLowerCase().includes(F.name.toLowerCase())) return false;
    if (F.expY){ const eo = calcExpected(c, w); if (!numPass(eo ? eo.exp*12 : null, F.expY)) return false; }
    if (F.pdiff && !numPass(calcPctDiff(c, w), F.pdiff)) return false;
    if (F.expM){ const eo = calcExpected(c, w); if (!numPass(eo ? calcUsedHM(c, w) : null, F.expM)) return false; }
    if (F.expC && !numPass(w.expected_close_override, F.expC)) return false;
    if (F.fee && !numPass(feeMonthOf(c.tax_id), F.fee)) return false;
    if (F.feeHrP && !numPass(feePerHour(c, w, 'partner'), F.feeHrP)) return false;
    if (F.feeHrS && !numPass(feePerHour(c, w, 'staff'), F.feeHrS)) return false;
    if (!fMatch(F.type, cType(c))) return false;
    if (!fMatch(F.status, c.status)) return false;
    if (!fMatch(F.group, c.client_group||'(ไม่ระบุ)')) return false;
    if (!numPass(w.hours_month, F.hm)) return false;
    if (!numPass(w.hours_close_year, F.hcy)) return false;
    if (!numPass(hoursYearOf(w), F.hy)) return false;
    if (!fAny(F.diff, d => d==='(none)' ? !w.difficulty : w.difficulty===d)) return false;
    if (!fMatch(F.hcls, cls(c))) return false;
    for (const t of ['VAT','MFS','PAY']) if (!fMatch(F[t], jobOn(c,t)?'Y':'N')) return false;
    for (const r of ['Partner','Supervisor','Prepare','Support','Closing']) if (!fAny(F[r], tok => roleHas(c.tax_id, r, tok))) return false;
    const roleHas68 = (role, tok) => { const list = asg68.filter(x=>x.tax_id===c.tax_id && x.role===role);
      return tok==='(none)' ? list.length===0 : list.some(x=>x.staff_token===tok); };
    if (!fAny(F.Prep68, tok => roleHas68('Prepare', tok))) return false;
    if (!fAny(F.Close68, tok => roleHas68('Closing', tok))) return false;
    return true;
  });
  // เรียงตามคอลัมน์ที่ผู้ใช้เลือกจากเมนู ⋯ (ถ้าไม่เลือก ใช้ค่าเริ่มต้น: มีงาน VAT ก่อน แล้วชั่วโมงมาก→น้อย)
  const sortVal = (c, k) => {
    const w = wByTax[c.tax_id]||{};
    switch(k){
      case 'code': return c.client_code||'';
      case 'name': return c.name_th||'';
      case 'type': return cType(c);
      case 'status': return stKey(c);
      case 'group': return c.client_group||'';
      case 'hm': return w.hours_month===null||w.hours_month===undefined||w.hours_month===''? -1e9 : +w.hours_month;
      case 'hcy': return w.hours_close_year===null||w.hours_close_year===undefined||w.hours_close_year===''? -1e9 : +w.hours_close_year;
      case 'hy': return hoursYearOf(w) ?? -1e9;
      case 'expY': { const eo = calcExpected(c, w); return eo ? eo.exp*12 : -1e9; }
      case 'expM': { const eo = calcExpected(c, w); return eo ? calcUsedHM(c, w) : -1e9; }
      case 'expC': return w.expected_close_override===null||w.expected_close_override===undefined||w.expected_close_override===''? -1e9 : +w.expected_close_override;
      case 'pdiff': { const pd = calcPctDiff(c, w); return pd===null ? -1e9 : pd; }
      case 'fee': { const f = feeMonthOf(c.tax_id); return f===null ? -1e9 : f; }
      case 'feeHrP': { const r = feePerHour(c, w, 'partner'); return r===null ? -1e9 : r; }
      case 'feeHrS': { const r = feePerHour(c, w, 'staff'); return r===null ? -1e9 : r; }
      case 'diff': return ({'ง่าย':1,'ปานกลาง':2,'ยาก':3})[w.difficulty] || 0;
      case 'hcls': return cls(c)||'';
      case 'VAT': case 'MFS': case 'PAY': return jobOn(c, k) ? 1 : 0;
      case 'Prep68': { const a = asg68.find(x=>x.tax_id===c.tax_id && x.role==='Prepare'); return a ? staffName(a.staff_token) : '\uffff'; }
      case 'Close68': { const a = asg68.find(x=>x.tax_id===c.tax_id && x.role==='Closing'); return a ? staffName(a.staff_token) : '\uffff'; }
      default: { const a = asg.find(x=>x.tax_id===c.tax_id && x.role===k); return a ? staffName(a.staff_token) : '\uffff'; }
    }
  };
  const cmpSort = (a,b) => {
    const va = sortVal(a, dashSort.k), vb = sortVal(b, dashSort.k);
    const r = (typeof va==='number' && typeof vb==='number') ? va - vb : String(va).localeCompare(String(vb), 'th');
    return dashSort.dir==='desc' ? -r : r;
  };
  const groups = [];
  TYPES.forEach(t=>ST.forEach(s=>{
    // เรียงกลุ่มเดียวกันให้อยู่ติดกัน (Others ท้ายสุด) แล้วในกลุ่มเรียงชั่วโมงมาก→น้อย
    const gRank2 = c => (c.client_group||'Others')==='Others' ? 1 : 0;
    const list = rows.filter(c=>cType(c)===t && stKey(c)===s)
      .sort(dashSort ? cmpSort : ((a,b)=> gRank2(a)-gRank2(b) || (a.client_group||'').localeCompare(b.client_group||'') || hrsY(b)-hrsY(a)));
    if (list.length) groups.push({ t, s, list });
  }));

  const chip = k => { const m=CL.find(x=>x[0]===k); return `<span class="badge ${m&&m[1]?m[1]:''}">${k}</span>`; };

  // ---- ชั่วโมงต่อพนักงาน ----
  const hasSupport = {}; asg.forEach(a=>{ if(a.role==='Support') hasSupport[a.tax_id]=true; });
  const per = {};
  // สะสมสองฐานคู่กัน: hm/hy = ฐานชั่วโมง Partner (ใช้คำนวณหลัก), hR/hyR = ฐานชั่วโมงการทำงานจริงที่กรอก
  const add = (tok,hm,hy,hmR,hyR,roleKey)=>{
    if (tok==='CLIENT'||tok==='PARTNER'||tok==='TRAINEE') return;
    per[tok] = per[tok] || { h:0, hy:0, hR:0, hyR:0, fee:0, prep:0, sup:0, close:0, pay:0, spv:0, ptn:0 };
    per[tok].h += hm; per[tok].hy += hy; per[tok].hR += hmR; per[tok].hyR += hyR; if (roleKey) per[tok][roleKey]++;
  };
  // ชม./ปีส่วนของ assignment แต่ละแถว — ตรรกะสัดส่วนเดียวกับ addF ด้านล่าง ใช้กระจายค่าทำบัญชีตาม % ชั่วโมง (คำสั่ง 30 ส.ค.)
  // ใช้ฐาน "ต่อปี" ไม่ใช่ต่อเดือน เพราะบริษัทที่ Partner ระบุเป็นงานปิดงบล้วน (เช่น TGN) มี ชม./เดือน = 0 แต่มี ชม.ปิดงบ — ฐานปีปันเงินได้ครบ
  const hyShareOf = a => {
    const w = wByTax[a.tax_id]||{};
    const hy = calcUsedHY(cByTax[a.tax_id], w);
    const sh = (+a.share_pct||100)/100;
    if (a.role==='Prepare') return hy * roleFrac(a.tax_id,'Prepare', defFrac('Prepare', hasSupport[a.tax_id])) * sh;
    if (a.role==='Support') return hy * roleFrac(a.tax_id,'Support', defFrac('Support')) * sh;
    if (a.role==='Closing') return hy * roleFrac(a.tax_id,'Closing', defFrac('Closing')) * sh;
    if (a.role==='Payroll') return 18*sh;
    if (a.role==='Supervisor') return hy * roleFrac(a.tax_id,'Supervisor',0) * sh;
    return 0; // Partner ไม่นับชั่วโมง — ไม่ได้ส่วนแบ่งค่าทำบัญชี
  };
  // กลุ่มเหมาที่ปันรายได้ระดับกลุ่ม (คำสั่ง 30 ส.ค.): ค่าทำบัญชีของกลุ่มมักลงไว้ที่บริษัทเดียว/บางบริษัท
  // แต่ชั่วโมงแบ่งกันหลายคนหลายบริษัท — รวมค่าทำบัญชีทั้งกลุ่มเป็นกองกลาง แล้วกระจายตามชั่วโมงของแต่ละคนทั้งกลุ่ม
  const FEE_POOL_GROUPS = [...new Set([...teamGroups(), 'AFCL'])];
  const poolKeyOf = tax => { const g = (cByTax[tax]||{}).client_group; return FEE_POOL_GROUPS.includes(g) ? 'G:'+g : tax; };
  const totHmByTax = {}, feeByPool = {};
  asg.forEach(a=>{ const k = poolKeyOf(a.tax_id); totHmByTax[k] = (totHmByTax[k]||0) + hyShareOf(a); });
  D.clients.forEach(c=>{ const f = feeMonthOf(c.tax_id)||0; if (f>0){ const k = poolKeyOf(c.tax_id); feeByPool[k] = (feeByPool[k]||0) + f; } });
  asg.forEach(a=>{
    const w = wByTax[a.tax_id]||{};
    const hm = calcUsedHM(cByTax[a.tax_id], w);
    const hYr = calcUsedHY(cByTax[a.tax_id], w);
    const hmR = +(w.hours_month||0), hyR = hoursYearOf(w) || 0;
    const sh = (+a.share_pct||100)/100;
    const addF = (f, key) => add(a.staff_token, hm*f*sh, hYr*f*sh, hmR*f*sh, hyR*f*sh, key);
    if (a.role==='Prepare') addF(roleFrac(a.tax_id,'Prepare', defFrac('Prepare', hasSupport[a.tax_id])), 'prep');
    else if (a.role==='Support') addF(roleFrac(a.tax_id,'Support', defFrac('Support')), 'sup');
    else if (a.role==='Closing') addF(roleFrac(a.tax_id,'Closing', defFrac('Closing')), 'close');
    else if (a.role==='Payroll') add(a.staff_token, 1.5*sh, 18*sh, 1.5*sh, 18*sh, 'pay');
    else if (a.role==='Supervisor') addF(roleFrac(a.tax_id,'Supervisor',0), 'spv');
    else if (a.role==='Partner')    add(a.staff_token, 0, 0, 0, 0, 'ptn');
    // ค่าทำบัญชีส่วนของคนนี้ = ค่าทำบัญชีของกอง (บริษัทเดี่ยว หรือรวมทั้งกลุ่มเหมา) × (ชม.ส่วนของคนนี้ ÷ ชม.รวมทุกคนของกอง) — ส่วนของ Client/Partner/Trainee ไม่แจกให้ใคร
    const pk = poolKeyOf(a.tax_id);
    const feeM = feeByPool[pk]||0, totHm = totHmByTax[pk]||0;
    if (feeM>0 && totHm>0 && per[a.staff_token]) per[a.staff_token].fee += feeM * hyShareOf(a) / totHm;
  });
  const ROLE_ABBR = { Prepare:'Prep', Support:'Supp', Closing:'Close', Payroll:'Pay', Supervisor:'Spv', Partner:'Ptn' };
  const staffDetail = tok => {
    const byTax = {};
    asg.filter(a=>a.staff_token===tok && (a.role!=='Supervisor' || roleFrac(a.tax_id,'Supervisor',0)>0)).forEach(a=>{
      const w = wByTax[a.tax_id]||{}; const sh = (+a.share_pct||100)/100;
      const hyC = calcUsedHY(cByTax[a.tax_id], w);

      const hy = flat !== null ? flat : hyC * f1 * sh;
      const hyR = flat !== null ? flat : hyCR * f1 * sh;
      const o = byTax[a.tax_id] = byTax[a.tax_id] || { hy:0, hyR:0, fee:0, hm:0, roles:[] };
      o.hy += hy; o.hyR += hyR;
      // เก็บส่วนแบ่งค่าทำบัญชีรายบริษัท + ตัวเลขที่ใช้ในสูตร — ไว้พิสูจน์ยอดคอลัมน์ค่าทำบัญชี (ตรรกะเดียวกับตอนสะสม per[].fee)
      const pk = poolKeyOf(a.tax_id), fP = feeByPool[pk]||0, tH = totHmByTax[pk]||0;

      o.pool = pk.startsWith('G:') ? pk.slice(2) : null; o.fP = fP; o.tH = tH;
      o.roles.push(ROLE_ABBR[a.role] + (sh<1? ` ${Math.round(sh*100)}%`:''));

    const items = Object.entries(byTax).map(([tax,o])=>{

    const bySt = st => items.filter(x=>x.status===st).sort((a,b)=> rank(a)-rank(b) || b.hy-a.hy);
    const secs = [

    // ตารางแบบย่อ (แก้ 30 ส.ค. ค่ำ — ผู้ใช้ขอข้อมูลสรุปเดิม + ชม.Partner/ชม.จริง/ผลต่าง/ค่าทำบัญชี, ลากขอบหัวคอลัมน์ปรับความกว้างได้)

  };
  const compBy = {};

  const staffToks = [...new Set([

    // เรียงตามตำแหน่ง (Partner→Manager→Senior→Junior→Admin→แม่บ้าน) แล้วตามอายุงาน (เข้าก่อนอยู่บน) — คนลาออกไปท้ายสุด

  // ความจุชั่วโมงทำงานต่อคนต่อปี (ข้อมูลผู้ใช้ 30 ส.ค. 2569): ทำงาน 8:30-17:30 = 8 ชม./วัน (หักพักเที่ยง 1 ชม.)
