}
async function odWalk(dir, prefix, out, depth){
  if (depth > 8 || out.length > 20000) return;
  for await (const [name, h] of dir.entries()){
    if (name.startsWith('.') || name.startsWith('~$')) continue;
    const rel = prefix ? prefix + '/' + name : name;
    if (h.kind === 'directory') await odWalk(h, rel, out, depth + 1);
    else out.push({ name, rel, h });
  }
}
async function odScan(scope){
  if (!odCanScan()){ toast('ปุ่มนี้ใช้ได้เฉพาะบัญชีแอดมิน · Manager · แอดมินจำกัด'); return; }
  if (odBusy) return;
  const sc = (scope === 'y') ? 'y' : 'm';          // เผื่อโค้ดเก่าที่เรียก odScan() เปล่า ๆ
  const scLb = odScope(sc).lb;
  if (!odSupported()){
    alert('เบราว์เซอร์นี้เปิดโฟลเดอร์ในเครื่องไม่ได้\n\nวิธีใช้: เปิดเว็บนี้ด้วย Google Chrome หรือ Microsoft Edge (ใช้ได้ทั้ง Windows และ Mac)\nSafari กับ Firefox ยังไม่รองรับความสามารถนี้');
    return;
  }
  let dir = await odDir(sc, false);
  if (dir && !confirm('บอร์ด' + scLb + ' — ใช้โฟลเดอร์ที่จำไว้: "' + dir.name + '"\n\nกด OK เพื่อตรวจโฟลเดอร์นี้ · กด Cancel เพื่อเลือกโฟลเดอร์ใหม่')) dir = null;
  if (!dir){
    alert('เลือกโฟลเดอร์ OneDrive ของงาน' + scLb + '\n(' + odScope(sc).hint + ')\n\nแต่ละบอร์ดจำโฟลเดอร์ของตัวเองแยกกัน จะไม่ไปทับของอีกบอร์ด');
    dir = await odDir(sc, true, true);
  }
  if (!dir) return;   // ผู้ใช้กดยกเลิก
  odBusy = true; toast('กำลังอ่านรายชื่อไฟล์...');
  const files = [];
  try { await odWalk(dir, '', files, 0); }
  catch(e){ odBusy = false; alert('อ่านโฟลเดอร์ไม่สำเร็จ: ' + e.message); return; }

  const byCode = {}; D.clients.forEach(c=>{ if (c.client_code) byCode[String(c.client_code).toUpperCase().trim()] = c; });
  const mPlan = [], yPlan = [], unknown = [], already = [], offScope = [];
  const seen = new Set();
  for (const f of files){
    if (!/\.(pdf|jpg|jpeg|png|xlsx|xls|zip)$/i.test(f.name)) continue;
    const std = parseStdName(f.name);
    let code = std ? std.code : null, beY = std ? std.beY : null, mo = std ? std.m : null;
    let fk = std ? (fileFormGuess(std.form) || {}).k : null;
    if (!fk) fk = (fileFormGuess(f.name) || {}).k;
    if (!code){   // ชื่อไม่ตรงรูปแบบสำนักงาน — ลองหาตัวย่อจากชื่อโฟลเดอร์/ชื่อไฟล์
      const toks = (f.rel.replace(/\//g,'_')).split('_').map(x=>x.trim().toUpperCase());
      for (let i = toks.length - 1; i >= 0; i--) if (byCode[toks[i]]){ code = toks[i]; break; }
    }
    if (!beY || !mo){ const g = fileYMGuess(f.rel); if (g){ if (!beY && g.y) beY = g.y + 543; if (!mo && g.m) mo = g.m; } }
    const c = code ? byCode[code] : null;
    if (!c || !fk){ unknown.push(f.rel); continue; }
    const ref = { path:'onedrive:' + f.rel, name:f.name };
    const isYear = ['PND50','PND51','SBCH3','FS','NEWS','PND1K'].includes(fk);
    // ปุ่มของแต่ละบอร์ดลงข้อมูลเฉพาะแบบภาษีของบอร์ดตัวเอง (4 ก.ย.) — กันเอกสารรายปีหลุดลงบอร์ดรายเดือนและกลับกัน
    if (isYear !== (sc === 'y')){ offScope.push(f.rel); continue; }
    if (isYear){
      // บทเรียน 3 ก.ย.: ไฟล์งบ/ภ.ง.ด.50 ของปีเก่าเคยถูกยัดลงปีปัจจุบันเพราะชื่อไฟล์ไม่มีปี
      // กติกาใหม่: แบบรายปีอื่นที่ไม่ใช่ ภ.ง.ด.51 ต้อง (1) เป็น PDF และ (2) มีปีระบุชัดในชื่อไฟล์ ไม่งั้นข้าม
      if (fk !== 'PND51'){
        if (!/\.pdf$/i.test(f.name)){ unknown.push(f.rel); continue; }
        if (!beY){
          const ym = String(f.name).match(/(?:^|[^\d])(20\d{2}|25\d{2})(?:[^\d]|$)/);
          if (ym){ const yv = +ym[1]; beY = yv > 2400 ? yv : yv + 543; }
        }
        if (!beY){ unknown.push(f.rel); continue; }
        if (fk==='FS' && !/\.pdf$/i.test(f.name)){ unknown.push(f.rel); continue; }
      }
      const fy = beY || taxYFY();
      const key = 'y|' + c.tax_id + '|' + fy + '|' + fk; if (seen.has(key)) continue; seen.add(key);
      const cur = taxYRow(c.tax_id, fy, fk);
      if (cur && (cur.status === 'ยื่นแล้ว' || cur.status === 'ไม่ต้องยื่น' || (cur.files||[]).length)){ already.push(key); continue; }
      yPlan.push({ c, fy, fk, ref });
    } else {
      if (!beY || !mo) { unknown.push(f.rel); continue; }
      const per = (beY - 543) + '-' + String(mo).padStart(2,'0');
      const key = 'm|' + c.tax_id + '|' + per + '|' + fk; if (seen.has(key)) continue; seen.add(key);
      const cur = taxRow(c.tax_id, per, fk);
      if (cur && (cur.status === 'ยื่นแล้ว' || cur.status === 'ไม่ต้องยื่น' || (cur.files||[]).length)){ already.push(key); continue; }
      mPlan.push({ c, per, fk, ref, h: f.h });
    }
  }
  odBusy = false;
  const n = mPlan.length + yPlan.length;
  const msg = 'บอร์ด' + scLb + ' — โฟลเดอร์ "' + dir.name + '"\nอ่านไฟล์ทั้งหมด ' + files.length.toLocaleString() + ' ไฟล์\n\n'
    + '• จะตั้งเป็น "ยื่นแล้ว" ใหม่ ' + n.toLocaleString() + ' ช่อง\n'
    + '• มีข้อมูลอยู่แล้ว ไม่แตะ ' + already.length.toLocaleString() + ' ช่อง\n'
    + '• เป็นเอกสารของอีกบอร์ด ข้ามไป ' + offScope.length.toLocaleString() + ' ไฟล์\n'
    + '• จับคู่บริษัท/แบบภาษีไม่ได้ ' + unknown.length.toLocaleString() + ' ไฟล์ (ข้ามไป)\n\n'
    + 'ระบบจะไม่ทับช่องที่น้อง ๆ กรอกไว้แล้ว และไม่ได้อัปโหลดตัวไฟล์ เก็บแค่ที่อยู่ไว้อ้างอิง\n\nยืนยันบันทึกลงบอร์ดเลยไหม?';
  if (!n){ alert(msg.replace('ยืนยันบันทึกลงบอร์ดเลยไหม?','ไม่มีอะไรต้องอัปเดต')); if (unknown.length) console.log('ไฟล์ที่จับคู่ไม่ได้:', unknown); return; }
  if (!confirm(msg)){ console.log('ไฟล์ที่จับคู่ไม่ได้:', unknown); return; }

  // กติกาผู้ใช้ 3 ก.ย. (บทเรียนเคส BRD): แถบ "รอตรวจสอบ" บนหน้าแบบเป็นลายน้ำรูปภาพ อ่านเป็นตัวหนังสือไม่ได้
  // จึงใช้เกณฑ์ใบเสร็จแทน — แบบของสรรพากรที่ยื่นจริง ไฟล์จะมีหน้า "ใบเสร็จรับเงิน" รวมอยู่ด้วย
  // ไม่มีหน้าใบเสร็จ (ทั้งที่ไฟล์อ่านตัวหนังสือได้) = ฉบับร่าง → ลง "ทำแล้วรอยื่น" · SSO/กองทุนฯ ยกเว้น (คนละหน่วยงาน)
  toast('กำลังเปิดดู ' + mPlan.length + ' ไฟล์ เพื่อหาหน้าใบเสร็จรับเงิน...');
  const RD_M = ['PP30','PP36','PND1','PND3','PND53','PND54'];
  let nDraft = 0;
  for (const x of mPlan){
    if (!x.h || !/\.pdf$/i.test(x.ref.name) || !RD_M.includes(x.fk)) continue;
    try {
      const t3 = await pdfText(await x.h.getFile(), 3);
      const flat3 = (t3 || '').replace(/\s+/g,'');
      if (flat3.length < 200) continue;   // ไฟล์สแกน อ่านไม่ออก — ตัดสินไม่ได้ คงเป็นยื่นแล้ว
      if (flat3.includes('รอตรวจสอบ') || !(flat3.includes('ใบเสร็จรับเงิน') && flat3.includes('เลขที่ใบเสร็จ'))){ x.draft = true; nDraft++; }
    } catch(e){}
  }
  toast('กำลังบันทึก ' + n + ' ช่อง...');
  const note = 'ตรวจจากไฟล์ใน OneDrive ' + isoToBe(todayIso());
  let ok = 0, err = 0;
  for (let i = 0; i < mPlan.length; i += 200){
    const rows = mPlan.slice(i, i+200).map(x=>({ tax_id:x.c.tax_id, period:x.per, form:x.fk,
      status: x.draft ? 'ทำแล้วรอยื่น' : 'ยื่นแล้ว', files:[x.ref],
      note: x.draft ? note + ' — ไฟล์ไม่มีหน้าใบเสร็จรับเงิน จึงยังไม่นับว่ายื่น' : note }));
    const { error } = await sb.from('tax_month').upsert(rows, { onConflict:'tax_id,period,form' });
    if (error){ err += rows.length; console.error(error); } else ok += rows.length;
  }
  for (let i = 0; i < yPlan.length; i += 200){
    const rows = yPlan.slice(i, i+200).map(x=>({ tax_id:x.c.tax_id, fy_be:x.fy, form:x.fk, status:'ยื่นแล้ว', files:[x.ref], note }));
    const { error } = await sb.from('tax_year').upsert(rows, { onConflict:'tax_id,fy_be,form' });
    if (error){ err += rows.length; console.error(error); } else ok += rows.length;
  }
  D.tax = await fetchAll('tax_month','id');
  D.taxY = await fetchAll('tax_year','id');
  renderDash();
  alert('อัปเดตเสร็จแล้ว\n\nบันทึกสำเร็จ ' + ok.toLocaleString() + ' ช่อง' + (nDraft? '\nในจำนวนนี้ ' + nDraft + ' ช่องไม่มีหน้าใบเสร็จรับเงิน — ลงเป็น ทำแล้วรอยื่น (ยังไม่นับว่ายื่น)' : '') + (err? '\nไม่สำเร็จ ' + err + ' ช่อง (ดูรายละเอียดใน Console)' : '')
    + (unknown.length? '\n\nมี ' + unknown.length + ' ไฟล์ที่จับคู่บริษัท/แบบภาษีไม่ได้ — พิมพ์รายชื่อไว้ใน Console แล้ว' : ''));
  if (unknown.length) console.log('ไฟล์ที่จับคู่ไม่ได้:', unknown);
}

function beMonthLabel(ym){
  if (!ym) return '';
  const [y, m] = String(ym).split('-').map(Number);

// สีคงที่ต่อคน คำนวณจากตัวย่อ จะได้สีเดิมทุกครั้งทุกเครื่อง
const LEVEL_COLOR = { Partner:'#0a5cc4', Manager:'#1f7a4d', Senior:'#1f4e9c', Junior:'#b8860b', Trainee:'#7a5cb8', Admin:'#8e8e93', Maid:'#8a6d3b' };
function staffHue(tok){ let h=0; const t=String(tok||''); for (let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))%360; return h; }
// สีประจำตัวพนักงาน — ตั้งเองได้ที่แถบพนักงาน (app_setting key staff_color) ไม่ตั้ง = คำนวณจากตัวย่อ (คนเดิมได้สีเดิมเสมอ)

function staffColors(){ return (staffColorDB && typeof staffColorDB==='object') ? staffColorDB : {}; }
function hexToHsl(hex){
  const m = /^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i.exec(String(hex||''));
  if (!m) return null;
  let r=parseInt(m[1],16)/255, g=parseInt(m[2],16)/255, b=parseInt(m[3],16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0, sat=0; const l=(mx+mn)/2;
  if (mx!==mn){ const d=mx-mn; sat = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx===r ? (g-b)/d + (g<b?6:0) : mx===g ? (b-r)/d + 2 : (r-g)/d + 4; h*=60; }
  return { h: Math.round(h), s: Math.round(sat*100) };
}
// คืนโทนสีของคนนั้น (ใช้ทั้งป้ายชื่อและจุดสี) — hue/sat เดียวกันทุกที่
function staffTone(tok){
  const cs = hexToHsl(staffColors()[tok]);
  return cs ? { h: cs.h, s: Math.max(45, cs.s) } : { h: staffHue(tok), s: 68 };
}
function staffColorHex(tok){
  const c = staffColors()[tok];
  if (c) return c;
  const t = staffTone(tok);
  return hslHex(t.h, t.s, 45);
}
function hslHex(h,s,l){
  s/=100; l/=100;
  const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));
  return '#'+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// วันสิ้นรอบบัญชีของบริษัท (fiscal_year_end เก็บเป็น "วว/ดด") ในปี พ.ศ. ที่ให้มา
function fyEndDate(c, fyBe){
  const m = String(c.fiscal_year_end||'31/12').match(/^(\d{1,2})\/(\d{1,2})$/);
  const d = m? +m[1] : 31, mo = m? +m[2] : 12;
  return new Date(fyBe - 543, mo - 1, d);
}
function taxYDue(c, fy, formK){
  const end = fyEndDate(c, fy);
  const add = (dt, days) => { const x = new Date(dt); x.setDate(x.getDate()+days); return x; };
  const addM = (dt, n) => { const x = new Date(dt); x.setMonth(x.getMonth()+n); return x; };
  if (formK==='PND50') return add(end, 150);              // 150 วันหลังสิ้นรอบ
  if (formK==='PND51') return addM(addM(end, -6), 2);     // 2 เดือนหลังครึ่งรอบ
  if (formK==='NEWS') return add(addM(end, 4), -7); // ลงประกาศ นสพ. เชิญประชุมใหญ่ ล่วงหน้าอย่างน้อย 7 วันก่อนประชุม
  if (formK==='FS' || formK==='SBCH3') return addM(end, 5); // ประชุมใหญ่ ≤4 เดือน + ยื่น ≤1 เดือน
  if (formK==='PND1K') return new Date(end.getFullYear()+1, 1, 28); // สิ้น ก.พ. ปีถัดไป
  return addM(end, 5);
}

  const jobs = D.jobs.filter(j=>j.tax_id===tax && j.service_type===stype && j.active==='Y');

async function taxOpenFile(path, name){
  // ไฟล์อ้างอิงใน OneDrive: เปิดตัวไฟล์จริงจากโฟลเดอร์ที่แอดมินเลือกไว้ (จำไว้ให้แล้ว)
  // ถ้าหาไม่เจอ/เบราว์เซอร์ไม่รองรับ ค่อยถอยไปเปิดหน้าค้นหาของ OneDrive
  if (String(path).startsWith('onedrive:')){
    const loc = String(path).slice(9);
    const fn = name || loc.split('/').pop();
    const w = window.open('', '_blank');            // เปิดแท็บไว้ก่อนตอนกด กันโดนบล็อกป๊อปอัป
    if (odSupported()){
      // ไฟล์อาจอยู่โฟลเดอร์รายเดือนหรือรายปีก็ได้ — odResolveAny ลองให้ทั้งสอง
      try {
        const fh = await odResolveAny(loc);
        if (fh){
          const file = await fh.getFile();
          const url = URL.createObjectURL(file);
          if (w) w.location.href = url; else window.open(url, '_blank');
          setTimeout(()=>URL.revokeObjectURL(url), 120000);
          return;
        }
      } catch(e){}
      toast('ไม่พบไฟล์ในโฟลเดอร์ที่เลือกไว้ — เปิดค้นหาใน OneDrive ให้แทน');
    }
    try { await navigator.clipboard.writeText(loc); } catch(e){}
    const surl = 'https://onedrive.live.com/?q=' + encodeURIComponent(fn);
    if (w) w.location.href = surl; else window.open(surl, '_blank');
    return;
  }
  const { data, error } = await sb.storage.from('liqdocs').createSignedUrl(path, 3600);
  if (error){ toast('เปิดไฟล์ไม่ได้: ' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

  const files = [...(r.files||[])]; const f = files[i]; if (!f) return;
  if (!confirm(String(f.path).startsWith('onedrive:') ? 'เอาการอ้างอิงไฟล์ ' + f.name + ' ออกจากช่องนี้? (ตัวไฟล์ใน OneDrive ไม่ถูกลบ)' : 'ลบไฟล์ ' + f.name + ' ?')) return;

function regReimburseText(id){
  const r = regRow(id); if (!r) return '';
  const c = r.tax_id ? D.clients.find(x=>x.tax_id===r.tax_id) : null;
  const v = regVisits(r), gf = +r.gov_fee||0;
  const trips = v.reduce((a,x)=>a+(+x.cost||0),0);
  const L = [];
  L.push('[BBT เบิกเงิน · งานจดทะเบียน]');
  L.push('บริษัท: ' + (c ? c.client_code + ' ' + (c.name_th||'') : (r.client_name||'—')));
  L.push('เรื่อง: ' + (r.job_type||'—') + (r.agency? ' (' + r.agency + ')' : ''));
  L.push('ผู้เบิก: ' + (r.assignee ? staffName(r.assignee) : '—'));
  if (gf) L.push('ค่าธรรมเนียมราชการ: ' + gf.toLocaleString() + ' บาท');
  if (v.length){
    L.push('ค่าใช้จ่ายไปดำเนินการ ' + v.length + ' ครั้ง:');
    v.forEach(x=>L.push('  · ' + (x.date? isoToBe(x.date):'—') + ' ' + (x.action||'') + (x.cost? ' ' + (+x.cost).toLocaleString() + ' บ.' : '')));
  }
  L.push('รวมเบิก: ' + (gf + trips).toLocaleString() + ' บาท');
  L.push('อ้างอิงเลขที่งาน: REG-' + r.id);
  return L.join('\n');
}

// (คอลัมน์ผู้รับผิดชอบในแถบชำระบัญชี = liquidation.assignee เลือกจาก dropdown — เพิ่ม 30 ส.ค. ดึก)
const dbdStatusCache = {}; // สถานะ DBD ที่เช็คแล้วในเซสชันนี้ (tax → ข้อความ) — กันยิงซ้ำทุกครั้งที่ render
function dbdStatusColor(st){ return /เสร็จการชำระบัญชี/.test(st) ? 'var(--green)' : /เลิก|ร้าง/.test(st) ? 'var(--amber)' : /ไม่สำเร็จ|ไม่พบ/.test(st) ? 'var(--red)' : 'var(--txt)'; }
async function liqCheckDBD(tax, quiet){
  const el = document.getElementById('liq-dbd-' + tax);
  if (el){ el.textContent = 'กำลังเช็ค...'; el.style.color = 'var(--mut)'; el.style.fontWeight = '400'; }
  try {
    const r = await fetch('https://openapi.dbd.go.th/api/v1/juristic_person/' + tax);
    const j = await r.json();
    const p = j && j.data && j.data[0] && j.data[0]['cd:OrganizationJuristicPerson'];
    const st = p ? (p['cd:OrganizationJuristicStatus']||'ไม่ทราบสถานะ') : 'ไม่พบข้อมูล';
    dbdStatusCache[tax] = st;
    if (el){ el.textContent = st; el.style.fontWeight = '600'; el.style.color = dbdStatusColor(st); }
    // DBD แจ้งเสร็จการชำระบัญชี → บันทึกวันเสร็จ + เปลี่ยนสถานะบริษัทเป็น Settlement ให้เองเลย (30 ส.ค. — คอลัมน์เสร็จชำระบัญชีถูกเอาออก ใช้ DBD สดเป็นตัวตัดสิน)
    if (/เสร็จการชำระบัญชี/.test(st) && !(liqRow(tax)?.done_date)){
      if (await liqSave(tax, { done_date: dateToBe(new Date()) })){
        await liqSetClientStatus(tax, 'Settlement');
        toast('DBD แจ้งเสร็จการชำระบัญชี — บันทึกวันเสร็จและเปลี่ยนสถานะบริษัทเป็น Settlement ให้แล้ว');
        renderDash();
      }
    }
  } catch(e){ if (el){ el.textContent = 'เช็คไม่สำเร็จ'; el.style.color = 'var(--red)'; } }
}
// เปิดแถบชำระบัญชีแล้วเช็คสถานะกับ DBD ให้เองทุกบริษัทที่ยังไม่เสร็จ (ทีละรายห่างกัน 250ms กันยิงรัว)
let liqAutoBusy = false;
async function liqAutoCheck(){
  if (liqAutoBusy) return;
  liqAutoBusy = true;
  try {
    const taxes = D.clients.filter(c=>(c.status==='Closed' || liqRow(c.tax_id)) && !(liqRow(c.tax_id)?.done_date) && !dbdStatusCache[c.tax_id]).map(c=>c.tax_id);
    for (const tax of taxes){
      if (dashTab !== 'liq') break; // ผู้ใช้เปลี่ยนแถบไปแล้ว หยุด
      await liqCheckDBD(tax, true);
      await new Promise(res=>setTimeout(res, 250));
    }
    // รายที่ DBD บอกเสร็จ ระบบบันทึกวันเสร็จ+เปลี่ยนสถานะเป็น Settlement ให้เองใน liqCheckDBD แล้ว — ไม่ต้องเตือนซ้ำ
  } finally { liqAutoBusy = false; }
}

async function saveNewClient(){
  const g = id => document.getElementById('nc-'+id)?.value ?? '';
  const tax = g('tax_id').replace(/\D/g,'');
  const missing = [];
  if (tax.length !== 13) missing.push('Tax ID ต้องเป็นตัวเลข 13 หลัก');
  if (!g('client_code').trim()) missing.push('ตัวย่อ');
  if (!g('name_core').trim()) missing.push('ชื่อกิจการ');
  if (!g('nature_id')) missing.push('กลุ่มธุรกิจ');
  if (!g('record_mode')) missing.push('โหมดบันทึกบัญชี');
  if (!g('vat_registered')) missing.push('จด VAT');
  if (!g('fiscal_year_end').trim()) missing.push('วันสิ้นรอบบัญชี');
  if (missing.length){ alert('กรอกไม่ครบ:\n- ' + missing.join('\n- ')); return; }
  if (D.clients.some(c=>c.tax_id===tax)){ alert('มีบริษัท Tax ID นี้อยู่แล้ว: ' + tax); return; }
  if (D.clients.some(c=>String(c.client_code||'').toUpperCase()===g('client_code').trim().toUpperCase())){ alert('ตัวย่อนี้ถูกใช้แล้ว: ' + g('client_code').trim().toUpperCase()); return; }
  const row = {
    tax_id: tax, client_code: g('client_code').trim().toUpperCase(), name_th: composeName(g('etype'), g('name_core')),
    dbd_type: g('dbd_type').trim() || null, nature_id: g('nature_id'),
    client_group: g('client_group').trim() || 'Others', client_type: g('client_type') || 'Account', status: g('status'),
    record_mode: g('record_mode'), vat_registered: g('vat_registered'),
    vat_reg_date_be: g('vat_reg_date_be').trim() || null,
    registered_capital: g('registered_capital')==='' ? null : +g('registered_capital'),
    income_tax_scheme: g('income_tax_scheme') || null,
    fiscal_year_end: g('fiscal_year_end').trim(),
    software: g('software').trim() || null, note: g('note').trim() || null,
  };
  const { error } = await sb.from('client').insert(row);
  if (error){ toast('บันทึกไม่สำเร็จ: ' + error.message); return; }
  const { data } = await sb.from('client').select('*').eq('tax_id', tax).single();
  D.clients.push(data || row);
  D.clients.sort((a,b)=>(a.client_code||'').localeCompare(b.client_code||''));
  toast('เพิ่มบริษัทแล้ว — อย่าลืมใส่ทีมผู้รับผิดชอบ บริการ และชั่วโมงการทำงาน');
  renderList(); renderDetail(tax);
}

function showSave(){ document.getElementById('saveBar').style.display='block'; }

let detailRoles = {}, dirtyRoles = new Set();
const isResigned = s => (s||{}).status==='ลาออก';
// คนที่ลาออกแล้วไม่ขึ้นในช่องเลือกผู้รับผิดชอบ แต่ถ้ายังถูกมอบหมายงานค้างอยู่ก็ยังแสดงชื่อไว้
function optListFor(tok, base){
  let ps = base.filter(s=>!isResigned(s));
  if (tok && !ps.some(s=>s.staff_token===tok)){ const x=D.staff.find(s=>s.staff_token===tok); if (x) ps=ps.concat(x); }
  return ps;
}
function staffOptsHTML(tok){
  const ps = optListFor(tok, D.staff);
  return ['<option value="">—</option>', ...ps.map(s=>`<option value="${s.staff_token}" ${s.staff_token===tok?'selected':''}>${staffName(s.staff_token)}${isResigned(s)?' (ลาออกแล้ว)':''}</option>`), '<option value="__add__">+ เพิ่มพนักงานใหม่…</option>'].join('');
}
function gotoAddStaff(){ dashTab='staff'; staffFormOpen=true; renderDash(); toast('กรอกข้อมูลพนักงานใหม่ แล้วค่อยกลับไปมอบหมายงาน'); }
// แบบย่อ: โชว์เฉพาะตัวย่อ (ใช้กับคอลัมน์ Supervisor ให้แคบ เหมือน Excel)
function staffOptsShortHTML(tok){
  const ps = optListFor(tok, D.staff);
  return ['<option value="">—</option>', ...ps.map(s=>`<option value="${s.staff_token}" ${s.staff_token===tok?'selected':''}>${s.staff_token}${isResigned(s)?' (ลาออก)':''}</option>`), '<option value="__add__">+ เพิ่มพนักงานใหม่…</option>'].join('');
}
// ช่อง Partner เลือกได้เฉพาะคนที่ระดับเป็น Partner (AJ, SC, TP)
function partnerOptsHTML(tok){
  const ps = optListFor(tok, D.staff.filter(s=>s.level==='Partner'));
  return ['<option value="">—</option>', ...ps.map(s=>`<option value="${s.staff_token}" ${s.staff_token===tok?'selected':''}>${staffName(s.staff_token)}${isResigned(s)?' (ลาออกแล้ว)':''}</option>`)].join('');
}
function roleBlockInner(role){
  const rows = detailRoles[role] || [];
  const sum = rows.reduce((s,r)=>s+(+r.pct||0), 0);
  return rows.map((r,i)=>`<div style="display:flex;gap:6px;margin-bottom:6px">
    <select onchange="roleSet('${role}',${i},'tok',this.value)" style="flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff">${staffOptsHTML(r.tok)}</select>
    <input type="number" min="0" max="100" step="5" value="${r.pct}" onchange="roleSet('${role}',${i},'pct',this.value)" style="width:62px;padding:8px;border:1px solid var(--line);border-radius:12px" title="เปอร์เซ็นต์">
    <button onclick="roleDel('${role}',${i})" style="border:1px solid var(--line);background:none;border-radius:12px;padding:0 10px;color:var(--mut);cursor:pointer" title="ลบ">✕</button>
  </div>`).join('')
  + `<div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
    <button onclick="roleAdd('${role}')" style="border:1px dashed var(--line);background:none;border-radius:12px;padding:5px 12px;color:var(--mut);font-size:13px;cursor:pointer">+ เพิ่มคน</button>
    ${rows.length>1? `<span style="font-size:12px;font-weight:600;color:${sum===100?'var(--green)':'var(--red)'}">รวม ${sum}%${sum!==100?' ≠ 100':''}</span>`:''}
  </div>`
  + roleHoursLine(role, rows);
}
function roleHoursLine(role, rows){
  if (!['Prepare','Support','Closing','Payroll','Supervisor'].includes(role)) return '';
  if (role==='Supervisor' && !(roleFrac(selTax,'Supervisor',0)>0)) return '';
  const w = D.works.find(x=>x.tax_id===selTax && x.work_year===year());
  const hy = calcUsedHY(D.clients.find(x=>x.tax_id===selTax), w||{}); // ชั่วโมง Partner เป็นหลัก
  const hasSupp = (detailRoles['Support']||[]).some(r=>r.tok);
  const parts = rows.filter(r=>r.tok).map(r=>{
    const sh = (+r.pct||100)/100;
    let h = 0;
    if (role==='Prepare') h = hy*roleFrac(selTax,'Prepare', defFrac('Prepare', hasSupp))*sh;
    else if (role==='Support') h = hy*roleFrac(selTax,'Support', defFrac('Support'))*sh;
    else if (role==='Closing') h = hy*roleFrac(selTax,'Closing', defFrac('Closing'))*sh;
    else if (role==='Payroll') h = 18*sh;
    else if (role==='Supervisor') h = hy*roleFrac(selTax,'Supervisor',0)*sh;
    return `${staffName(r.tok)} ≈ <b>${Math.round(h)}</b>`;
  });
  if (!parts.length || (hy===0 && role!=='Payroll')) return '';
  return `<div style="font-size:12px;color:var(--mut);margin-top:5px">ชม./ปีตามส่วนแบ่ง: ${parts.join(' · ')}</div>`;
}
function roleTouch(role){
  dirtyRoles.add(role); showSave();
  const el = document.getElementById('role-'+role);
  if (el) el.innerHTML = roleBlockInner(role);
  if (role==='Support'){
    const p = document.getElementById('role-Prepare');
    if (p) p.innerHTML = roleBlockInner('Prepare');
  }
}
function roleSet(role,i,f,v){ detailRoles[role][i][f] = f==='pct' ? +v : v; roleTouch(role); }
function roleAdd(role){ (detailRoles[role] = detailRoles[role]||[]).push({ tok:'', pct: detailRoles[role].length ? 0 : 100 }); roleTouch(role); }
function roleDel(role,i){ detailRoles[role].splice(i,1); roleTouch(role); }

async function saveChanges(){
  const y=year();
  const badSum = [...dirtyRoles].filter(role=>{
    const rows = (detailRoles[role]||[]).filter(r=>r.tok);
    const s = rows.reduce((t,r)=>t+(+r.pct||0), 0);
    return rows.length > 1 && s !== 100;
  });
  if (badSum.length && !confirm(`บทบาท ${badSum.join(', ')} รวม % ไม่เท่ากับ 100\nบันทึกต่อหรือไม่?`)) return;
  for (const role of dirtyRoles){
    const rows = (detailRoles[role]||[]).filter(r=>r.tok);
    let { error } = await sb.from('assignment').delete().match({ tax_id:selTax, work_year:y, role });
    if (error){ toast('บันทึกไม่สำเร็จ: '+error.message); return; }
    if (rows.length){
      ({ error } = await sb.from('assignment').insert(rows.map(r=>({ tax_id:selTax, work_year:y, role, staff_token:r.tok, share_pct:+r.pct||100, source_note:'แก้ผ่านเว็บ' }))));
      if (error){ toast('บันทึกไม่สำเร็จ: '+error.message); return; }
    }
  }
  for (const [k,v] of Object.entries(dirty)){
    if (k.startsWith('role:')) continue;
    const patch={}; patch[k]= v===''? null : +v;
    const { error } = await sb.from('workload_year').update(patch).match({ tax_id:selTax, work_year:y });
    if (error) { toast('บันทึกไม่สำเร็จ: '+error.message); return; }
  }
  const [a,w]=await Promise.all([ fetchAll('assignment','id'), fetchAll('workload_year','id') ]);
  D.assigns=a; D.works=w;
  toast('บันทึกแล้ว'); renderDetail(selTax);
}

// Duplicate ขึ้นปีใหม่ — เอาเฉพาะโครงสร้าง ไม่เอาข้อมูลการทำงานของปีเดิม (31 ส.ค.)
// เอามา: ทีมผู้รับผิดชอบทุกบทบาท+% · ลักษณะบริษัท (ปริมาณเอกสาร, HP/ลีส/เงินกู้, ความยาก) · ชั่วโมงที่ Partner ระบุ (แผน)
// ไม่เอามา: ชั่วโมงการทำงานจริงที่กรอกระหว่างปี · กลุ่มชั่วโมง · คะแนนคำนวณเดิม
async function newYear(){
  const from = year(), to = from + 1;
  if (!confirm('Duplicate ขึ้นปี ' + to + ' จากโครงสร้างปี ' + from + '?\n\n' +
    'เอามา: ทีมผู้รับผิดชอบ (ทุกบทบาท + %) · ลักษณะบริษัท (ปริมาณเอกสาร ความยาก HP/ลีส/เงินกู้) · ชั่วโมงที่ Partner ระบุ\n' +
    'ไม่เอามา: ชั่วโมงการทำงานจริงที่กรอกไว้ · กลุ่มชั่วโมง (ปีใหม่เริ่มกรอกใหม่ทั้งหมด)')) return;
  const { error } = await sb.rpc('copy_year_structure', { from_year:from, to_year:to });
  if (error){ toast('สร้างไม่สำเร็จ: ' + error.message); return; }
  // เปิดปีใหม่ให้เลือกได้บนหัวเว็บ
  const list = [...new Set([...(Array.isArray(yearListDB)&&yearListDB.length? yearListDB : [2569]), to])].sort();
  const r2 = await sb.from('app_setting').upsert({ key:'year_list', value:list }, { onConflict:'key' });
  if (r2.error) toast('สร้างปีแล้ว แต่เปิดให้เลือกปีไม่สำเร็จ: ' + r2.error.message);
  yearListDB = list;
  toast('Duplicate ขึ้นปี ' + to + ' แล้ว (เฉพาะโครงสร้าง) — เลือกปีได้ที่หัวเว็บ');
  boot();
}

// ลบข้อมูลทั้งปี — ไว้แก้กรณีกด Duplicate ผิดปี (1 ก.ย. ตามคำขอผู้ใช้)
// ลบเฉพาะ assignment (ทีมแบ่งงาน) + workload_year (ชั่วโมง/ลักษณะงาน) ของปีนั้น
// ไม่แตะข้อมูลลูกค้า · งานภาษีรายเดือน/รายปี · งานจดทะเบียน · ชำระบัญชี (พวกนั้นไม่ได้ผูกกับปีงาน)
async function delYear(){
  if (!isAdmin()){ toast('เฉพาะแอดมินเท่านั้น'); return; }
  const y = year();
  const list = (Array.isArray(yearListDB) && yearListDB.length) ? yearListDB.slice() : [DEFAULT_YEAR];
  if (list.length <= 1){ toast('เหลือปีเดียวแล้ว ลบไม่ได้ — ถ้าจะเริ่มใหม่ให้ Duplicate ปีใหม่ก่อน'); return; }
  toast('กำลังนับข้อมูลของปี ' + y + '...');
  const [a, w, wh] = await Promise.all([
    sb.from('assignment').select('id', { count:'exact', head:true }).eq('work_year', y),
    sb.from('workload_year').select('tax_id', { count:'exact', head:true }).eq('work_year', y),
    sb.from('workload_year').select('tax_id', { count:'exact', head:true }).eq('work_year', y)
      .or('hours_month.gt.0,hours_close_year.gt.0'),
  ]);
  if (a.error || w.error){ toast('อ่านข้อมูลไม่สำเร็จ: ' + ((a.error||w.error).message)); return; }
  const nA = a.count || 0, nW = w.count || 0, nH = (wh && wh.count) || 0;
  const msg = 'ลบข้อมูลปี ' + y + ' ทั้งหมด?\n\n'
    + 'จะถูกลบถาวร:\n'
    + '  · ทีมแบ่งงาน (assignment) ' + nA + ' รายการ\n'
    + '  · ชั่วโมง/ลักษณะงานรายบริษัท (workload_year) ' + nW + ' รายการ'
    + (nH ? '\n\n⚠️ ในนั้นมี ' + nH + ' บริษัทที่กรอกชั่วโมงการทำงานจริงไว้แล้ว — ลบแล้วข้อมูลชั่วโมงหายถาวร' : '')
    + '\n\nไม่ถูกลบ: ข้อมูลลูกค้า · งานภาษีรายเดือน/รายปี · งานจดทะเบียน · ชำระบัญชี'
    + '\n\nกู้คืนไม่ได้ — ถ้าจะเอาโครงสร้างกลับ ต้อง Duplicate จากปีอื่นใหม่';
  if (!confirm(msg)) return;
  const typed = prompt('ยืนยันอีกครั้ง — พิมพ์เลขปี ' + y + ' แล้วกดตกลง');
  if (String(typed || '').trim() !== String(y)){ toast('ยกเลิกการลบ — เลขปีไม่ตรง'); return; }
  toast('กำลังลบข้อมูลปี ' + y + '...');
  const dA = await sb.from('assignment').delete().eq('work_year', y);
  if (dA.error){ toast('ลบทีมแบ่งงานไม่สำเร็จ: ' + dA.error.message); return; }
  const dW = await sb.from('workload_year').delete().eq('work_year', y);
  if (dW.error){ toast('ลบทีมแบ่งงานแล้ว แต่ลบชั่วโมงไม่สำเร็จ: ' + dW.error.message); return; }
  const left = list.filter(x=>x!==y);
  const r2 = await sb.from('app_setting').upsert({ key:'year_list', value:left }, { onConflict:'key' });
  if (r2.error) toast('ลบข้อมูลแล้ว แต่เอาปีออกจากช่องเลือกไม่สำเร็จ: ' + r2.error.message);
  yearListDB = left;
  toast('ลบข้อมูลปี ' + y + ' แล้ว (' + nA + ' ทีม · ' + nW + ' ชั่วโมง) — สลับไปปี ' + left[left.length-1]);
  boot();
}

  STAFF:       { table:'staff', conflict:'staff_token',

const cName = tax => (D.clients.find(c=>c.tax_id===tax)||{}).name_th||'';
const cCode = tax => (D.clients.find(c=>c.tax_id===tax)||{}).client_code||'';

function buildWB(withData){
  const wb = XLSX.utils.book_new();
  const guide = [
    ['วิธีใช้ไฟล์นำเข้า BBT Client Master'],
    ['1. ห้ามเปลี่ยนชื่อชีตและชื่อหัวคอลัมน์ (แถวแรกของแต่ละชีต)'],
    ['2. การนำเข้าเป็นแบบ เพิ่ม/อัปเดต เท่านั้น ไม่ลบข้อมูลเดิม — แถวที่ key ตรงกับของเดิมจะถูกอัปเดต แถวใหม่จะถูกเพิ่ม'],
    ['3. key ของแต่ละชีต: CLIENT=tax_id | ASSIGNMENT=ปี+tax_id+บทบาท (แทนที่ทีมเดิมของบทบาทนั้นทั้งชุด) | WORKLOAD=ปี+tax_id | SERVICE_JOB=tax_id+service_type | FINANCIAL=tax_id+ปี+งวด | STAFF=staff_token'],
    ['4. tax_id ต้องเป็นเลขทะเบียน 13 หลัก | role ใช้: Prepare, Support, Closing, Supervisor, Partner, Payroll | status ของบริษัทใช้: Operate, Dormant, Closed | status ของพนักงานใช้: Probation, ผ่าน, ลาออก'],
    ['5. ชีตไหนไม่ต้องการนำเข้า ลบทั้งชีตออกได้ | แถวตัวอย่างในแม่แบบ ให้ลบทิ้งก่อนใส่ข้อมูลจริง'],
    ['6. คอลัมน์ client_code_ref และ name_ref ในชีตลูก มีไว้ให้อ่านง่ายเท่านั้น ระบบไม่นำเข้า'],
    ['7. คอลัมน์ hours_class ในชีต WORKLOAD เป็นค่าที่ระบบคำนวณสดตอนส่งออก (ตรงกับที่เห็นบนเว็บเสมอ) แก้ในไฟล์แล้วนำเข้ากลับจะไม่มีผล — ถ้าจะเปลี่ยนกลุ่ม ให้แก้ที่ hours_month หรือข้อมูลปริมาณงาน'],
    ['8. hours_year และ expected_year_override เป็นคอลัมน์คำนวณ (= ชม./เดือน × 12 + ชม.ปิดงบ) — ระบบคิดใหม่ตอนนำเข้าเสมอ ค่าที่พิมพ์ในไฟล์สองคอลัมน์นี้จะถูกทับ ให้แก้ที่คอลัมน์เดือน/ปิดงบแทน'],
    ['8. client_type ใช้ได้ 2 ค่า: Account (งานทำบัญชี) หรือ Consult (งานที่ปรึกษา)'],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(guide), 'วิธีใช้');
  for (const [name, def] of Object.entries(SHEETS)){
    let rows = [];
    if (withData){
      if (name==='CLIENT') rows = D.clients.map(c=>Object.fromEntries(def.cols.map(k=>[k,c[k]])));
      else if (name==='STAFF') rows = D.staff.map(s=>Object.fromEntries(def.cols.map(k=>[k,s[k]])));
      else {
        const src = name==='ASSIGNMENT'? D.assigns : name==='WORKLOAD'? D.works : name==='SERVICE_JOB'? D.jobs : [];
        rows = src.map(r=>{ const o=Object.fromEntries(def.cols.map(k=>[k,r[k]]));
          // hours_class คำนวณสดตอนส่งออก ไม่ใช้ค่าที่ค้างอยู่ใน DB (ไม่มีอะไรอัปเดตคอลัมน์นั้นให้)
          if (name==='WORKLOAD') o.hours_class = calcHoursClass(D.clients.find(c=>c.tax_id===r.tax_id), r) || '';
          o.client_code_ref=cCode(r.tax_id); o.name_ref=cName(r.tax_id); return o; });
      }
    } else {
      const ex = { CLIENT:{tax_id:'0105500000001',client_code:'ABC',name_th:'บริษัท ตัวอย่าง จำกัด',status:'Operate',fiscal_year_end:'31/12'},
        ASSIGNMENT:{work_year:2569,tax_id:'0105500000001',role:'Prepare',staff_token:'SUH',share_pct:100},
        WORKLOAD:{work_year:2569,tax_id:'0105500000001',hours_month:8,hours_year:112},
        SERVICE_JOB:{tax_id:'0105500000001',service_type:'ACC',service_name:'ทำบัญชีรายเดือน',frequency:'รายเดือน',active:'Y'},
        FINANCIAL:{tax_id:'0105500000001',fiscal_year_be:2568,period:'FULL',revenue:1000000,expenses:900000},
        STAFF:{staff_token:'NEW',nickname:'ชื่อเล่น',level:'Junior',status:'ผ่าน'} }[name];
      rows = [Object.fromEntries(def.cols.map(k=>[k, ex[k]??null]))];
    }
    const ws = XLSX.utils.json_to_sheet(rows, { header: withData && !['CLIENT','STAFF'].includes(name) ? [...def.cols,'client_code_ref','name_ref'] : def.cols });
    XLSX.utils.book_append_sheet(wb, ws, name);
  }
  return wb;
}
function doExport(){ XLSX.writeFile(buildWB(true), `BBT-Client-Master-${new Date().toISOString().slice(0,10)}.xlsx`); }
function doTemplate(){ XLSX.writeFile(buildWB(false), 'BBT-import-template.xlsx'); }

function normTax(v){ const d=String(v??'').replace(/\D/g,''); return d? d.padStart(13,'0') : ''; }

async function doImport(file){
  if (!file) return;
  let wb;
  try { wb = XLSX.read(await file.arrayBuffer()); } catch(e){ toast('อ่านไฟล์ไม่ได้: ต้องเป็น .xlsx'); return; }
  const plan = {}; const errs = [];
  for (const [name, def] of Object.entries(SHEETS)){
    const ws = wb.Sheets[name]; if (!ws) continue;
    const raw = XLSX.utils.sheet_to_json(ws, { defval:null });
    const rows = [];
    raw.forEach((r,i)=>{
      const o = {};
      def.cols.forEach(k=>{ if (r[k]!==undefined && r[k]!==null && r[k]!=='') o[k]=r[k]; });
      if (name==='WORKLOAD'){
        delete o.hours_class; // เป็นคอลัมน์คำนวณ ระบบไม่รับค่าจากไฟล์
        // ชม./ปี และ ชม. Partner/ปี เป็นคอลัมน์คำนวณ (= เดือน×12 + ปิดงบ) — คิดใหม่จากค่าที่นำเข้า+ของเดิม ไม่รับจากไฟล์ตรง ๆ
        const ex = D.works.find(x=>x.tax_id===normTax(o.tax_id||'') && x.work_year===+(o.work_year||0)) || {};
        const mg = f => (o[f]!==undefined) ? o[f] : (ex[f] ?? null);
        if (o.hours_month!==undefined || o.hours_close_year!==undefined || o.hours_year!==undefined){
          const hm = mg('hours_month'), hcy = mg('hours_close_year');
          o.hours_year = (hm===null||hm==='') && (hcy===null||hcy==='') ? null : Math.round(((+hm||0)*12 + (+hcy||0))*10)/10;
        }
        if (o.expected_month_override!==undefined || o.expected_close_override!==undefined || o.expected_year_override!==undefined){
          const xm = mg('expected_month_override'), xc = mg('expected_close_override');
          o.expected_year_override = (xm===null||xm==='') ? null : Math.round(((+xm)*12 + (+xc||0))*10)/10;
        }
      }
      if (o.tax_id!==undefined){ o.tax_id=normTax(o.tax_id); if (o.tax_id.length!==13){ errs.push(`${name} แถว ${i+2}: tax_id ไม่ครบ 13 หลัก`); return; } }
      if (name!=='CLIENT' && name!=='STAFF' && o.tax_id && !D.clients.some(c=>c.tax_id===o.tax_id)) { errs.push(`${name} แถว ${i+2}: ไม่พบ tax_id ${o.tax_id} ใน CLIENT`); return; }
      if (o.work_year) o.work_year=+o.work_year;
      if (o.share_pct===undefined && name==='ASSIGNMENT') o.share_pct=100;
      if (Object.keys(o).length) rows.push(o);
    });
    if (rows.length) plan[name] = rows;
  }
  if (errs.length){ alert('พบข้อผิดพลาด นำเข้าไม่ได้:\n' + errs.slice(0,15).join('\n') + (errs.length>15? `\n...และอีก ${errs.length-15} รายการ`:'')); return; }
  if (!Object.keys(plan).length){ toast('ไม่พบชีตที่นำเข้าได้ในไฟล์'); return; }
  const summary = Object.entries(plan).map(([n,r])=>`${n}: ${r.length} แถว`).join('\n');
  if (!confirm('จะนำเข้า (เพิ่ม/อัปเดต ไม่ลบของเดิม):\n' + summary + '\n\nดำเนินการต่อ?')) return;

  try {
    for (const [name, rows] of Object.entries(plan)){
      const def = SHEETS[name];
      if (def.special==='assignment'){
        const groups = {};
        rows.forEach(r=>{ const k=`${r.work_year}|${r.tax_id}|${r.role}`; (groups[k]=groups[k]||[]).push(r); });
        for (const [k, g] of Object.entries(groups)){
          const [y, tax, role] = k.split('|');
          let { error } = await sb.from('assignment').delete().match({ work_year:+y, tax_id:tax, role });
          if (error) throw new Error(name+': '+error.message);
          ({ error } = await sb.from('assignment').insert(g));
          if (error) throw new Error(name+': '+error.message);
        }
      } else {
        for (let i=0; i<rows.length; i+=200){
          const { error } = await sb.from(def.table).upsert(rows.slice(i,i+200), { onConflict: def.conflict });
          if (error) throw new Error(name+': '+error.message);
        }
      }
    }
  } catch(e){ alert('นำเข้าล้มเหลวกลางทาง: ' + e.message + '\nข้อมูลบางส่วนอาจถูกบันทึกแล้ว ตรวจสอบก่อนนำเข้าซ้ำ'); }
  toast('นำเข้าเสร็จ กำลังโหลดข้อมูลใหม่...');
  boot();
}
