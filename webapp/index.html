          .reduce((sum,x)=> sum + (role==='Payroll' ? 18 : hyv * roleFrac(c.tax_id, role, def)) * ((+x.share_pct||100)/100), 0);
        const gRank = c => (c.client_group||'Others')==='Others' ? 1 : 0; // Others ไปท้ายรายการ
        [...D.clients].sort((a,b)=> gRank(a)-gRank(b) || (a.client_group||'').localeCompare(b.client_group||'') || (a.client_code||'').localeCompare(b.client_code||'')).forEach(c=>{
          const w = {...(wByTax[c.tax_id]||{}), ...(entryDirty[c.tax_id]||{})};
          const st = calcHoursClass(c, w) || 'รอใส่ชั่วโมงการทำงาน';
          if (EF.code && !(c.client_code||'').toLowerCase().includes(EF.code.toLowerCase())) return;
          if (EF.name && !c.name_th.toLowerCase().includes(EF.name.toLowerCase())) return;
          if (!fMatch(EF.group, c.client_group||'(ไม่ระบุ)')) return;
          const eo = calcExpected(c, w);
          if (!numPass(w.hours_month, EF.hm) || !numPass(w.hours_close_year, EF.hcy) || !numPass(w.hours_year, EF.hy)) return;
          if (EF.exp && !numPass(eo ? eo.exp*12 : null, EF.exp)) return;
          if (EF.expM && !numPass(eo ? calcUsedHM(c, w) : null, EF.expM)) return;
          if (EF.expC && !numPass(w.expected_close_override, EF.expC)) return;
          if (EF.dif && !numPass(calcPctDiff(c, w), EF.dif)) return;
          if (!fAny(EF.Prepare, tok => eRoleHas(c.tax_id,'Prepare',tok))) return;
          if (!fAny(EF.Closing, tok => eRoleHas(c.tax_id,'Closing',tok))) return;
          if (!fAny(EF.Manager, tok => eRoleHas(c.tax_id,'Supervisor',tok))) return;
          if (!fAny(EF.Payroll, tok => eRoleHas(c.tax_id,'Payroll',tok))) return;
          if (!fMatch(EF.st, st)) return;
          // เอาเฉพาะบริษัทที่คนนั้นมีชั่วโมงจริง — บทบาท Partner/Supervisor เฉย ๆ (0 ชม.) ไม่นับ
          if (entryStaff && !asg.some(x=>x.tax_id===c.tax_id && x.staff_token===entryStaff && (
            ['Prepare','Support','Closing','Payroll'].includes(x.role) ||
            (x.role==='Supervisor' && roleFrac(c.tax_id,'Supervisor',0) > 0)
          ))) return;
          const hyv = hoursYearOf(w) || 0;
          const hyCalc = calcUsedHY(c, w); // ชั่วโมงที่ใช้คำนวณ = ของ Partner เป็นหลัก
          tot.n++; tot.hm += +(w.hours_month||0); tot.hcy += +(w.hours_close_year||0); tot.hy += hyv; tot.exp += eo ? eo.exp*12 : 0; tot.expM += eo ? calcUsedHM(c, w) : 0; tot.expC += +(w.expected_close_override||0);
          tot.prep += roleSum(c, hyCalc, 'Prepare', defFrac('Prepare', hasSupport[c.tax_id]));
          tot.close += roleSum(c, hyCalc, 'Closing', defFrac('Closing'));
          tot.mgr += roleSum(c, hyCalc, 'Supervisor', 0);
          tot.pay += roleSum(c, hyCalc, 'Payroll', 0);
          (groups[st] = groups[st] || []).push({c, w, st});
        });
        const fmt = v => (Math.round(v*10)/10).toLocaleString();
        const my = entryStaff ? (per[entryStaff] || { hy:0 }) : null;
        const dTot = tot.exp - tot.hy; // ติดลบ = ชั่วโมงจริงรวมเกินที่ Partner กำหนด
        const pTot = tot.exp>0 ? dTot/tot.exp*100 : null;
        const pTotM = tot.expM>0 ? (tot.expM-tot.hm)/tot.expM*100 : null;
        const pctTd = (p, tip) => `<td style="color:${p===null?'var(--mut)':p<0?'var(--red)':'var(--txt)'}" title="${tip}">${p===null?'—':(p>0?'+':'')+(Math.round(p*10)/10)+'%'}</td>`;
        const tCells = {
          code: `<td style="padding:8px 4px;position:sticky;left:0;background:var(--blue-bg);z-index:2">รวม ${tot.n}</td>`,
          name: `<td style="padding:8px 4px;position:sticky;left:66px;background:var(--blue-bg);z-index:2;box-shadow:2px 0 0 var(--line);font-size:12px">${entryStaff?`เฉพาะส่วนของ ${staffName(entryStaff)}`:'บริษัท (ตามตัวกรอง)'}</td>`,
          group: '<td></td>',
          expM: `<td>${fmt(tot.expM)}</td>`, expC: `<td>${fmt(tot.expC)}</td>`, exp: `<td>${fmt(tot.exp)}</td>`,
          hm: `<td>${fmt(tot.hm)}</td>`, hcy: `<td>${fmt(tot.hcy)}</td>`, hy: `<td style="color:var(--mut)">${fmt(tot.hy)}</td>`,
          dif: pctTd(pTot, `ชม./ปีจริงรวม ${fmt(tot.hy)} เทียบ ชม. Partner/ปีรวม ${fmt(tot.exp)} (ต่าง ${dTot>0?'+':''}${fmt(dTot)} ชม.)`),
          Prepare: `<td style="font-size:13px">${fmt(tot.prep)}</td>`, Closing: `<td style="font-size:13px">${fmt(tot.close)}</td>`,
          Manager: `<td style="font-size:13px">${fmt(tot.mgr)}</td>`, Payroll: `<td style="font-size:13px">${fmt(tot.pay)}</td>`,
          st: `<td style="font-size:12px;font-weight:400;color:var(--mut)">${entryStaff?`<b style="color:var(--blue)">รวมทุกบทบาท ${Math.round((my&&my.hy)||0).toLocaleString()} ชม./ปี</b><br>ตรงกับแถบพนักงาน (รวม Support/Payroll)`:'ชม./ปี ตามตัวกรอง'}</td>`,
          act: '<td></td>',
        };
        const totalRow = `<tr style="background:var(--blue-bg);font-weight:600">${eOrder.map(k=>tCells[k]||'<td></td>').join('')}</tr>`;
        const ORDER_ALL = ORDER.concat(Object.keys(groups).filter(k=>!ORDER.includes(k)).sort());
        return bandRow + filterRow + totalRow + ORDER_ALL.filter(st=>groups[st]).map(st=>{
          const col = COL[st] || 'var(--mut)';
          const head = `<tr class="entry-row" data-q=""><td colspan="${eOrder.length}" style="padding:12px 4px 6px;font-size:13px;font-weight:600;color:${col}">● ${st} · ${groups[st].length} บริษัท</td></tr>`;
          const rows = groups[st].map(({c, w})=>{
            const editing = entryEditTax === c.tax_id;
            const inp = f => {
              if (editing) return `<td><input type="number" step="0.5" value="${w[f]??''}" oninput="onEntryInput('${c.tax_id}','${f}',this.value)" style="width:80px;padding:7px;border:1px solid var(--line);border-radius:12px"></td>`;
              const lb = f==='hours_month' ? 'ชม./เดือน (จริง)' : 'ชม.ปิดงบ/ปี (จริง)';
              const has = w[f]!==null && w[f]!==undefined && w[f]!=='';
              return `<td onclick="setActualHours('${c.tax_id}','${f}')" style="font-size:13px;cursor:pointer;text-decoration:underline dotted;${has?'':'color:var(--mut)'}" title="${lb} — คลิกเพื่อกรอก/แก้ (หรือกดปุ่มแก้ไขเพื่อแก้ทั้งแถว)">${has? `<b>${w[f]}</b>` : '—'}</td>`;
            };
            const act = editing
              ? `<td style="white-space:nowrap"><button onclick="entrySaveRow('${c.tax_id}')" style="background:var(--blue);color:#fff;border:none;border-radius:12px;padding:7px 16px;cursor:pointer">บันทึก</button> <button onclick="entryCancel('${c.tax_id}')" title="ยกเลิก" style="border:1px solid var(--line);background:none;border-radius:12px;padding:7px 10px;color:var(--mut);cursor:pointer">✕</button></td>`
              : `<td><button onclick="entryEdit('${c.tax_id}')" style="border:1px solid var(--line);background:none;border-radius:12px;padding:6px 14px;color:var(--mut);cursor:pointer">แก้ไข</button></td>`;
            // ชั่วโมงรวมต่อตำแหน่ง คิดจากชั่วโมงที่ Partner ระบุ × สัดส่วนบทบาท (รวม override TGN/AFCL)
            const hyv = calcUsedHY(c, w);
            const roleH = (role, def) => {
              const list = asg.filter(x=>x.tax_id===c.tax_id && x.role===role);
              if (!list.length) return '—';
              return list.map(x=>{
                const sh = (+x.share_pct||100)/100;
                const h = role==='Payroll' ? 18*sh : hyv * roleFrac(c.tax_id, role, def) * sh;
                return `${staffName(x.staff_token)}${h>0?` · <b>${Math.round(h)}</b>`:''}`;
              }).join('<br>');
            };
            const eo2 = calcExpected(c, w);
            const r1e = v => Math.round(v*10)/10;
            const expY2 = eo2 ? Math.round(eo2.exp*12) : null;
            const eoF = calcExpected(c, {...w, expected_year_override: null}); // ค่าตามสูตร ไว้เทียบ/เป็น placeholder
            const hyv2 = hoursYearOf(w);
            const d2 = (expY2===null || hyv2===null) ? null : hyv2 - expY2;
            // ชม. Partner/ปี = คอลัมน์คำนวณ (ล็อก) — คิดจาก ชม. Partner/เดือน × 12 + ชม.ปิดงบ (Partner)
            const expCell = (() => {
              if (!eo2) return `<td style="color:var(--mut)">—</td>`;
              if (eo2.manual) return `<td style="font-size:13px" title="คำนวณอัตโนมัติ = ชม. Partner/เดือน × 12 + ชม.ปิดงบ (Partner) — ล็อก แก้ที่ช่องเดือน/ปิดงบ | ตามสูตรคำนวณได้ ${eoF?Math.round(eoF.exp*12).toLocaleString():'—'}"><b id="expy-${c.tax_id}">${expY2.toLocaleString()}</b>${editing?'<div style="font-size:10px;color:var(--mut)">อัตโนมัติ</div>':''}</td>`;
              return `<td style="font-size:13px;color:var(--mut)" title="ยังไม่มีค่าที่ Partner ระบุ — ใช้สูตรคำนวณไปก่อน (เกณฑ์/เดือน ${r1e(eo2.exp)} × 12: ฐาน 2.5 + เอกสาร ${r1e(eo2.parts.vol)} + ซับซ้อน ${r1e(eo2.parts.cplx)} + ยาก ${r1e(eo2.parts.diff)} + งานเดือน ${r1e(eo2.parts.monthly)}) | ใส่ ชม. Partner/เดือน แล้วระบบจะคำนวณให้"><span id="expy-${c.tax_id}">${expY2.toLocaleString()}</span> (สูตร)</td>`;
            })();
            // ชม. Partner/เดือน — Partner ระบุเองได้ (expected_month_override) ไม่ระบุ = ปี÷12
            const expMv = (w.expected_month_override!==null && w.expected_month_override!==undefined && w.expected_month_override!=='') ? +w.expected_month_override : null;
            const expMCell = (() => {
              if (editing) return `<td><input type="number" step="0.5" value="${w.expected_month_override??''}" placeholder="${eo2?`ปี÷12 ${r1e(eo2.exp)}`:'ระบุได้'}" title="ชม. Partner/เดือน — เว้นว่าง = ใช้ ชม. Partner/ปี ÷ 12" oninput="onEntryInput('${c.tax_id}','expected_month_override',this.value)" style="width:70px;padding:7px;border:1px solid var(--line);border-radius:12px"></td>`;
              if (expMv!==null) return `<td onclick="setExpMOverride('${c.tax_id}')" style="font-size:13px;cursor:pointer;text-decoration:underline dotted" title="ชม./เดือนที่ Partner ระบุ — คลิกเพื่อแก้ (เว้นว่าง = กลับไปใช้ ปี÷12)"><b>${(+expMv).toLocaleString()}</b></td>`;
              if (!eo2) return `<td onclick="setExpMOverride('${c.tax_id}')" style="font-size:13px;color:var(--mut);cursor:pointer;text-decoration:underline dotted" title="ยังไม่ระบุ — กลุ่มนี้ไม่มีสูตรคำนวณ (เหมา/Dormant/Closed) แต่ Partner กำหนดชั่วโมงเองได้ | คลิกเพื่อกำหนด">—</td>`;
              return `<td onclick="setExpMOverride('${c.tax_id}')" style="font-size:13px;color:var(--mut);cursor:pointer;text-decoration:underline dotted" title="ยังไม่ระบุ ชม./เดือน — ใช้ ชม. Partner/ปี ÷ 12 | คลิกเพื่อกำหนดเอง">${r1e(eo2.exp).toLocaleString()} (÷12)</td>`;
            })();
            // ชม.ปิดงบ/ปี ที่ Partner ระบุ (คอลัมน์ Y ไฟล์ Allocation)
            const expCv = (w.expected_close_override!==null && w.expected_close_override!==undefined && w.expected_close_override!=='') ? +w.expected_close_override : null;
            const expCCell = (() => {
              if (editing) return `<td><input type="number" step="0.5" value="${w.expected_close_override??''}" placeholder="—" title="ชม.ปิดงบ/ปี ที่ Partner ระบุ" oninput="onEntryInput('${c.tax_id}','expected_close_override',this.value)" style="width:70px;padding:7px;border:1px solid var(--line);border-radius:12px"></td>`;
              if (expCv!==null) return `<td onclick="setExpCOverride('${c.tax_id}')" style="font-size:13px;cursor:pointer;text-decoration:underline dotted" title="ชม.ปิดงบ/ปี ที่ Partner ระบุ — คลิกเพื่อแก้"><b>${(+expCv).toLocaleString()}</b></td>`;
              return `<td onclick="setExpCOverride('${c.tax_id}')" style="font-size:13px;color:var(--mut);cursor:pointer;text-decoration:underline dotted" title="ยังไม่ระบุ — คลิกเพื่อกำหนด">—</td>`;
            })();
            const pd2 = calcPctDiff(c, w);
            const difCell = pd2===null ? `<td id="pd-${c.tax_id}" style="color:var(--mut)">—</td>`
              : `<td id="pd-${c.tax_id}" style="font-size:13px;font-weight:600;color:${pd2<0?'var(--red)':'var(--txt)'}" title="ชม.จริง ${hyv2} − ชม.Partner ${expY2} = ${d2>0?'+':''}${Math.round(d2)} ชม./ปี">${pd2>0?'+':''}${(Math.round(pd2*10)/10).toLocaleString()}%</td>`;
            const rCells = {
              code: `<td style="padding:8px 4px;position:sticky;left:0;background:#fff;z-index:2;min-width:58px"><b>${c.client_code}</b></td>`,
              name: `<td style="padding:8px 4px;font-size:13px;color:var(--txt);position:sticky;left:66px;background:#fff;z-index:2;min-width:150px;box-shadow:2px 0 0 var(--line)">${c.name_th.slice(0,30)}</td>`,
              group: `<td style="font-size:13px;color:var(--txt)">${c.client_group||'—'}</td>`,
              expM: lockCell('expM', expMCell), expC: lockCell('expC', expCCell), exp: expCell,
              hm: lockCell('hm', inp('hours_month')), hcy: lockCell('hcy', inp('hours_close_year')),
              // ชม./ปี (จริง) = คอลัมน์คำนวณ (ล็อก) — คิดจาก ชม./เดือน × 12 + ชม.ปิดงบ
              hy: `<td title="คำนวณอัตโนมัติ = ชม./เดือน × 12 + ชม.ปิดงบ — ล็อก แก้ที่ช่องเดือน/ปิดงบ"><b id="hyc-${c.tax_id}">${hoursYearOf(w)??'—'}</b>${editing?'<div style="font-size:10px;color:var(--mut)">อัตโนมัติ</div>':''}</td>`,
              dif: difCell,
              Prepare: `<td style="font-size:13px">${roleH('Prepare', defFrac('Prepare', hasSupport[c.tax_id]))}</td>`,
              Closing: `<td style="font-size:13px">${roleH('Closing', defFrac('Closing'))}</td>`,
              Manager: `<td style="font-size:13px">${roleH('Supervisor', 0)}</td>`,
              Payroll: `<td style="font-size:13px">${roleH('Payroll', 0)}</td>`,
              st: `<td id="est-${c.tax_id}" style="font-size:13px;color:${COL[st]||'var(--mut)'};${st==='เกิน 15%'?'font-weight:600':''}">${st}</td>`,
              act,
            };
            return `<tr class="entry-row" data-q="${(c.client_code+' '+c.name_th+' '+(c.client_group||'')).toLowerCase()}" style="border-top:1px solid var(--line);${editing?'background:var(--blue-bg)':''}">${eOrder.map(k=>rCells[k]||'<td></td>').join('')}</tr>`;
          }).join('');
          return head + rows;
        }).join('');
      })()}
    </table>
  </div>`;
  // แถบแบ่งชั่วโมงตามข้อตกลง — แก้ % ได้ (บันทึกลง app_setting ใช้ร่วมกันทุกเครื่อง)
  const fracCard = dashTab!=='frac' ? '' : (() => {
    const d = fracDef();
    const cos = fracCompanies(); // BC/Constant ไม่อยู่ตารางนี้ — ข้อตกลงเป็นการแบ่งทีมรายบริษัท ดูส่วนล่าง
    const inp = (id, val, fn) => `<input type="number" step="0.5" min="0" max="100" value="${val??''}" onchange="${fn}" style="width:70px;padding:7px;border:1px solid var(--line);border-radius:12px;text-align:right">`;
    const fOrder = getOrder('frac').filter(k=>!getHiddenFor('frac').includes(k));
    const coRows = Object.keys(cos).sort().map(code=>{
      const o = cos[code] || {};
      const c0 = D.clients.find(x=>x.client_code===code);
      const nGroup = D.clients.filter(x=>(x.client_group||'')===code).length;
      const sub = c0 ? c0.name_th.slice(0,28)
        : nGroup ? `กลุ่ม · ${nGroup} บริษัท`
        : '<span style="color:var(--red)">ไม่พบตัวย่อ/กลุ่มนี้</span>';
      const sum = ['Prepare','Support','Closing','Supervisor'].reduce((s,r)=>s+(+o[r]||0),0);
      const fCellsRow = {
        co: `<td style="padding:8px 4px"><b>${code}</b><div style="font-size:11px;color:var(--mut)">${sub}</div></td>`,
        Prepare: `<td>${inp('fr-'+code+'-Prepare', o.Prepare, `fracSetCo('${code}','Prepare',this.value)`)}</td>`,
        Support: `<td>${inp('fr-'+code+'-Support', o.Support, `fracSetCo('${code}','Support',this.value)`)}</td>`,
        Closing: `<td>${inp('fr-'+code+'-Closing', o.Closing, `fracSetCo('${code}','Closing',this.value)`)}</td>`,
        Supervisor: `<td>${inp('fr-'+code+'-Supervisor', o.Supervisor, `fracSetCo('${code}','Supervisor',this.value)`)}</td>`,
        sum: `<td style="font-size:13px;font-weight:600;color:${sum===100?'var(--green)':'var(--amber)'}">${Math.round(sum*10)/10}%${sum!==100?' ≠ 100':''}</td>`,
        del: `<td><button onclick="fracDelCo('${code}')" style="border:1px solid var(--line);background:none;border-radius:12px;padding:6px 10px;color:var(--mut);cursor:pointer" title="เอาออก — กลับไปใช้ % มาตรฐาน">✕</button></td>`,
      };
      return `<tr style="border-top:1px solid var(--line)">${fOrder.map(k=>fCellsRow[k]||'<td></td>').join('')}</tr>`;
    }).join('');
    return `
  <div class="card">
    <h3>การแบ่งชั่วโมงตามข้อตกลง — แก้ตัวเลข % แล้วกดบันทึก มีผลกับชั่วโมงพนักงานทั้งระบบทันที</h3>
    <div style="font-size:12px;color:var(--mut);margin-bottom:12px">% คิดจากชั่วโมงของบริษัท (ชั่วโมง Partner เป็นหลัก) · Payroll คงที่ 1.5 ชม./เดือน = 18 ชม./ปี · Supervisor ปกติไม่นับชั่วโมง (0%)</div>
    <div style="background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-weight:600;margin-bottom:10px">% มาตรฐาน (ใช้กับทุกบริษัทที่ไม่มีข้อตกลงพิเศษ)</div>
      <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:14px">
        <span>Prepare (มี Support) ${inp('fd-prep', d.prep, "fracSetDef('prep',this.value)")} %</span>
        <span>Prepare (ไม่มี Support) ${inp('fd-prepNoSupp', d.prepNoSupp, "fracSetDef('prepNoSupp',this.value)")} %</span>
        <span>Support ${inp('fd-supp', d.supp, "fracSetDef('supp',this.value)")} %</span>
        <span>Closing ${inp('fd-close', d.close, "fracSetDef('close',this.value)")} %</span>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:8px">
      <div style="font-weight:600">บริษัท/กลุ่มที่มีข้อตกลงพิเศษ (% ต่อบทบาท — ช่องว่าง = ใช้ % มาตรฐานของบทบาทนั้น, รายบริษัทชนะรายกลุ่ม)</div>
      <button class="ghost" style="border-radius:999px" onclick="fracAddCo()">+ เพิ่มบริษัท/กลุ่ม</button>
    </div>

  const taxCard = dashTab!=='tax' ? '' : (() => {

    if (taxView === 'y12'){

      const M_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
      const pers = Array.from({length:12},(_,m)=>`${Y}-${String(m+1).padStart(2,'0')}`);
      const needAt = (tax, p2) => { const [a,b] = periodRange(p2);
        const stype = f.k==='PP30' ? 'VAT' : (f.k==='PND3'||f.k==='PND53') ? 'WHT' : (f.k==='PND1'||f.k==='SSO') ? 'PAY' : null;
        return stype ? svcActiveIn(tax, stype, a, b) : false; };
      const rows12 = inScope(D.clients).filter(c=> pers.some(p2=>needAt(c.tax_id,p2)) ||

        .filter(c=>{ const r=taxRow(c.tax_id,p2,f.k); return !(r && r.status==='ไม่ต้องยื่น'); }).length;
      const mini = (c, p2) => {

          <div class="o" onclick="taxPickStAt('${p2}','${c.tax_id}','${f.k}','')"><span class="dot" style="background:#fff;border:1.5px dashed #bbb"></span>ล้างสถานะ</div>

    <div style="max-width:calc(100vw - 96px);display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
      <span style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;display:inline-flex;gap:2px">
        <button class="ghost" onclick="setTaxView('m')" style="border:none;border-radius:12px;padding:7px 14px">รายเดือน</button>
        <button onclick="setTaxView('y12')" style="border:none;border-radius:12px;padding:7px 14px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer">ทั้งปี</button>
      </span>
      <button class="ghost" onclick="taxSetPeriod('${Y-1}-01')" style="border-radius:12px;padding:8px 12px">← ปี ${Y-1+543}</button>
      <b style="font-size:14px">ปี ${Y+543}</b>
      <button class="ghost" onclick="taxSetPeriod('${Y+1}-01')" style="border-radius:12px;padding:8px 12px">ปี ${Y+1+543} →</button>
      <span style="border-left:1px solid var(--line);height:24px;margin:0 4px"></span>
      ${TAX_FORMS.map(x=>`<button class="ghost" onclick="setTax12Form('${x.k}')" style="border-radius:999px;padding:7px 14px;font-size:13px;${tax12Form===x.k?'background:var(--blue-bg);border-color:var(--brand);color:var(--green);font-weight:700;font-weight:600':''}">${x.lb}</button>`).join('')}

      <tr style="color:var(--mut);text-align:left">
        <th style="${th12};text-align:left;left:0;z-index:9">ตัวย่อ</th>

      </tr>
      ${rows12.map(c=>`<tr class="tax-row" style="border-top:1px solid var(--line)">
        <td style="padding:6px;position:sticky;left:0;background:#fff;z-index:2"><b style="color:var(--blue);cursor:pointer" onclick="openClient('${c.tax_id}')">${c.client_code}</b></td>
        <td style="padding:6px;font-size:12px;white-space:nowrap;box-shadow:2px 0 0 var(--line)">${(c.name_th||'').slice(0,26)}</td>

    }
    const asg = D.assigns.filter(a=>a.work_year===ayM);   // ทีมของปีตามงวด ไม่ใช่ปีบนหัวเว็บ
    const rowsAll = inScope(D.clients).filter(c=>c.status==='Operate' || (D.tax||[]).some(t=>t.tax_id===c.tax_id && t.period===per));
    const [pStart, pEnd] = periodRange(per);
    const svc = (tax, st) => svcActiveIn(tax, st, pStart, pEnd);
    // แบบที่ต้องยื่นตามบริการที่บริษัทมี — ภ.พ.36/ภ.ง.ด.54/กองทุนฯ เป็นงานเฉพาะกิจ (กรอกเองเมื่อมี)
    const need = (tax, f) => f==='PP30' ? svc(tax,'VAT') : (f==='PND3'||f==='PND53') ? svc(tax,'WHT')
      : (f==='PND1'||f==='SSO') ? svc(tax,'PAY') : false;
    const baseM = rowsAll.filter(c=>TAX_FORMS.some(f=>need(c.tax_id,f.k)) || (D.tax||[]).some(t=>t.tax_id===c.tax_id && t.period===per));
    const rowsF = baseM.filter(c=>taxRowPass('m', c, TAX_FORMS, (tx,fk)=>taxRow(tx, per, fk), ayM))
      .sort((a,b)=>(a.client_code||'').localeCompare(b.client_code||''));
    // ---- รวมแถบงานค้าง/งานเสร็จเข้ามาเป็นมุมมองของบอร์ดนี้ (3 ก.ย.) ----
    const todayK = new Date(); todayK.setHours(0,0,0,0);
    const KIND_M = { late:['เลยกำหนด','var(--red)'], todo:['ยังไม่ยื่น','var(--amber)'],
                     nofile:['ยื่นแล้วยังไม่แนบไฟล์','var(--amber)'], flag:['ไฟล์ติดธงให้ตรวจซ้ำ','var(--red)'],
                     done:['ยื่นแล้ว','var(--green)'] };
    const PEND_M = ['late','todo','nofile','flag'];
    const VK = todoView==='done' ? ['done'] : todoView==='all' ? PEND_M.concat(['done']) : PEND_M;
    const kindOf = (c, f) => {
      const r = taxRow(c.tax_id, per, f.k) || null;
      const st = (r && r.status) || '';
      if (!(need(c.tax_id, f.k) || (r && (st || r.filed_date)))) return null;   // ไม่มีรายการต้องยื่น

      const files = (r && Array.isArray(r.files)) ? r.files : [];
      if (st === 'ยื่นแล้ว') return !files.length ? 'nofile' : files.some(x=>x&&x.warn) ? 'flag' : 'done';
      return taxDue(per, f.k) < todayK ? 'late' : 'todo';
    };
    const prepOf = tax => { const l = asg.filter(a=>a.tax_id===tax && a.role==='Prepare')
      .sort((p2,q)=>(+q.share_pct||100)-(+p2.share_pct||100)); return l.length ? l[0].staff_token : '(none)'; };

    const cellsOf = new Map();

    </div>
    <div style="max-width:calc(100vw - 96px);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
      <span style="font-size:12px;color:var(--mut)">ดูเฉพาะ</span>

      ${rowsShow.length? taxGroupRows(rowsShow, c=>c, rowHtmlY, yOrder.length) : `<tr><td colspan="${yOrder.length}" style="padding:20px 4px;color:var(--mut)">${taxYQuick? 'ไม่มีบริษัทที่ค้างในเงื่อนไขนี้ — กด "ทุกบริษัท" เพื่อดูทั้งหมด' : 'ไม่มีบริษัท'}</td></tr>`}

  })();
  // แถบสรุปงานภาษีรายเดือน "รายคน" (31 ส.ค. รอบสอง — ผู้ใช้บอกกดลูกศรลงแล้วดูยาก)
  // เปลี่ยนเป็นตาราง คน × ประเภทภาษี · ทุกตัวเลขกดเข้าไปดูรายชื่อบริษัทได้ · กดบริษัทแล้วกระโดดไปบอร์ดภาษี
  const taxSumCard = dashTab!=='taxsum' ? '' : (() => {

      const st = (r && r.status) || '';
      if (!(need(c.tax_id, f.k) || (r && (st || r.filed_date)))) return;
      const tok = ownerOf(c.tax_id);
      const b = bag[tok] = bag[tok] || { tok, cos:new Set(), tot:blank(), byForm:{} };
      b.byForm[f.k] = b.byForm[f.k] || blank();
      b.cos.add(c.client_code);
      const files = (r && Array.isArray(r.files)) ? r.files : [];
      const skip = st==='ไม่ต้องยื่น';
      const filed = st==='ยื่นแล้ว';
      const due = taxDue(per, f.k);
      const it = { tok, c, f, st, due, files,
        skip, filed,
        late: !skip && !filed && due < today,
        nofile: !skip && filed && !files.length,
        flag: files.filter(x=>x && x.warn).length };

    let rows = Object.values(bag).sort((a,b)=> (b.tot.late-a.tot.late) || (b.tot.todo-a.tot.todo)

    if (taxSumOnlyOpen) rows = rows.filter(r=>r.tot.todo || r.tot.nofile || r.tot.flag);

    const metMatch = (it, k) => k==='need' ? !it.skip : k==='done' ? (!it.skip && it.filed)

    const drill = taxSumDrill;

        ${(o.nofile||o.flag)? `<div style="font-size:11px;margin-top:1px">${o.nofile?`📎${cellBtn(o.nofile,'nofile',tok,f.k,'var(--amber)')} `:''}${o.flag?`⚠️${cellBtn(o.flag,'flag',tok,f.k,'var(--red)')}`:''}</div>`:''}</td>`;
    };
    // ---- แผงรายชื่อบริษัท (เปิดเมื่อกดตัวเลข) ----
    const drillPanel = (() => {
      if (!drill) return '';
      let list = ALL.filter(it=>metMatch(it, drill.met));

      list.sort((a,b)=> a.due-b.due || (a.c.client_code||'').localeCompare(b.c.client_code||'') || a.f.lb.localeCompare(b.f.lb));

    const ROLES = [['Prepare','คนทำ (Prepare)'],['Support','คนช่วย (Support)'],['Closing','คนปิดงบ (Closing)'],['Partner','Partner'],['Supervisor','Supervisor']];

        return { title: 'งานค้างของ ' + (sumDrill.k==='(none)' ? '(ยังไม่มีคนทำ)' : staffName(sumDrill.k)) + ' · งวด ' + taxPeriodLabel(curPer), sub: out.length + ' บริษัท', rows: out, go: 'm' };

      `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;max-height:420px;overflow:auto">

          <div onclick="${drill.go==='y' ? `sumGoY('${r.c.client_code}')` : `taxSumGo('${r.c.client_code}')`}" title="กดเพื่อเปิดบอร์ดและกรองเฉพาะบริษัทนี้"
            style="border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer;transition:border-color .12s" onmouseover="this.style.borderColor='var(--brand)'" onmouseout="this.style.borderColor='var(--line)'">
            <div style="font-size:13px"><b style="color:var(--blue)">${r.c.client_code}</b> <span style="color:var(--txt)">${(r.c.name_th||'').slice(0,26)}</span></div>
            <div style="font-size:11.5px;margin-top:3px;display:flex;gap:4px;flex-wrap:wrap">${r.fs.map(x=>`<span style="background:${x.late?'var(--red-bg)':'var(--bg)'};color:${x.late?'var(--red)':'var(--mut)'};border-radius:999px;padding:1px 8px;${x.late?'font-weight:700':''}">${x.lb}</span>`).join('')}</div>
            ${r.who ? `<div style="font-size:11px;color:var(--mut);margin-top:3px">คนทำ: ${r.who==='(none)'?'(ยังไม่มี)':staffName(r.who)}</div>` : ''}
          </div>`).join('')}
      </div>`}
    </div>`;
    const capW = 'max-width:calc(100vw - 96px);';
    return `
  <div class="card">
    <div style="position:sticky;left:0;z-index:7;width:max-content;max-width:calc(100vw - 26px);margin-left:-18px;padding-left:18px">

          <span style="width:34px;flex:none;font-size:12px;color:${m.per===curPer?'var(--green)':'var(--mut)'}">${m.lb}</span>

          <span style="width:130px;flex:none;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t==='(none)'?'(ยังไม่มีคนทำ)':staffName(t)}</span>
          <div style="flex:1"><div style="height:8px;border-radius:999px;background:var(--bg);overflow:hidden"><div style="height:100%;width:${Math.round(n*100/maxW)}%;background:var(--red)"></div></div></div>
          <b style="width:30px;text-align:right;font-size:12px;color:var(--red)">${n}</b></div>`).join('')
          : '<div style="font-size:12.5px;color:var(--green);font-weight:600">ไม่มีงานค้างในงวดนี้</div>',

      ${box('ภาษีรายปี · รอบบัญชีปี ' + fy,

          <span style="width:96px;text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--mut)"><b style="color:var(--green)">${f.done}</b>/${f.need}${(f.need-f.done)?` <b style="color:var(--red)">ค้าง ${f.need-f.done}</b>`:''}</span>
        </div>`).join(''), 'เขียว = เสร็จแล้ว · แดง = ยังไม่เสร็จ')}

          <div style="display:flex;align-items:center;gap:8px"><span style="flex:1">งานจดทะเบียนที่ยังไม่เสร็จ</span><b style="color:${nReg?'var(--red)':'var(--green)'}">${nReg}</b> <span style="color:var(--mut);font-size:11.5px">เรื่อง</span></div>

          <div style="display:flex;align-items:center;gap:8px"><span style="flex:1">งานตรวจสอบบัญชีปี ${y2}</span><b style="color:${auY.length?'var(--green)':'var(--mut)'}">${auY.length}</b> <span style="color:var(--mut);font-size:11.5px">งาน</span></div>
          <div style="display:flex;align-items:center;gap:8px"><span style="flex:1">บริษัทที่รับทำเงินเดือน</span><b>${payCo.length}</b> <span style="color:var(--mut);font-size:11.5px">บริษัท · พนักงานรวม ${payHead.toLocaleString()} คน</span></div>

        </div>`)}

    </div>

  })();
  // แถบทำเงินเดือน (3 ก.ย.) — บริษัทที่รับทำเงินเดือนให้ · คนรับผิดชอบ · จำนวนพนักงานที่อ่านจาก ภ.ง.ด.1 · ค่าบริการที่เรียกเก็บ
  const payCard = dashTab!=='payroll' ? '' : (() => {
    const y2 = year();
    const asg = D.assigns.filter(a=>a.work_year===y2);
    const payJob = tax => (D.jobs||[]).find(j=>j.tax_id===tax && j.service_type==='PAY');
    // แสดงเฉพาะบริษัทที่ระบุ "คนรับผิดชอบงานเงินเดือน" (บทบาท Payroll) ของปีนั้นไว้แล้วเท่านั้น
    const whoOf = tax => [...new Set(asg.filter(a=>a.tax_id===tax && a.role==='Payroll').map(a=>a.staff_token))];
    const gKey = c => (c.client_group || '\uffff(ไม่ระบุกลุ่ม)');   // ไม่ระบุกลุ่มไปอยู่ท้ายสุด
    const rows = inScope(D.clients)
      .filter(c=>whoOf(c.tax_id).length > 0)
      .sort((a,b)=> gKey(a).localeCompare(gKey(b),'th') || (a.client_code||'').localeCompare(b.client_code||''));
    const money = canSeeMoney();
    const nCo = rows.length;
    // ยอดรวมของบริษัทหนึ่ง = จำนวนกรรมการ + จำนวนพนักงาน (สูตรบวก) ถ้ายังไม่กรอกทั้งคู่ ใช้ตัวเลขที่อ่านจาก ภ.ง.ด.1
    const headOf = c => (c.payroll_directors!=null || c.payroll_employees!=null)
      ? (+c.payroll_directors||0) + (+c.payroll_employees||0)
      : (c.payroll_headcount!=null ? +c.payroll_headcount : null);
    const nHead = rows.reduce((s2,c)=>s2 + (headOf(c)||0), 0);
    const nNoHead = rows.filter(c=>headOf(c)==null).length;
    const nDir = rows.reduce((s2,c)=>s2 + (+c.payroll_directors||0), 0);
    const nEmp = rows.reduce((s2,c)=>s2 + (+c.payroll_employees||0), 0);
    const feeOf = c => { const j = payJob(c.tax_id); return j && j.fee_month!=null ? +j.fee_month : null; };
    const nFee = rows.reduce((s2,c)=>s2 + (feeOf(c)||0), 0);
    const nNoFee = rows.filter(c=>feeOf(c)==null).length;
    const pOrder = getOrder('payroll').filter(k=>money || k!=='fee' && k!=='perhead');
    const th = 'padding:9px 11px;position:sticky;top:0;background:var(--bg);white-space:nowrap;z-index:6;font-size:12px;color:var(--mut)';
    const td = 'padding:8px 11px;border-top:1px solid var(--line);white-space:nowrap';
    const inp = 'padding:5px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13px;text-align:right;width:92px';
    const LBP = k => ({co:'ตัวย่อ', name:'ชื่อบริษัท', grp:'กลุ่มลูกค้า', who:'คนรับผิดชอบ', dir:'จำนวนกรรมการ', emp:'จำนวนพนักงาน',
      head:'พนักงานทั้งหมด', fee:'ค่าบริการ/เดือน', perhead:'ต่อคน/เดือน', svc:'สถานะบริการ'})[k] || k;
    const stat = (lb, v, col, sub) => `<div style="border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:#fff;min-width:132px">
      <div style="font-size:12px;color:var(--mut)">${lb}</div>
      <div style="font-size:23px;font-weight:800;color:${col};font-variant-numeric:tabular-nums;letter-spacing:-.5px">${v}</div>
      ${sub?`<div style="font-size:11px;color:var(--mut);margin-top:1px">${sub}</div>`:''}</div>`;
    const rowP = c => {
      const j = payJob(c.tax_id);
      const on = j && j.active==='Y';
      const head = headOf(c);
      const both = (c.payroll_directors!=null || c.payroll_employees!=null);
      const fee = feeOf(c);
      const per = head && fee ? Math.round(fee/head) : null;
      const cells = {
        co: `<td style="${td};position:sticky;left:0;background:#fff;z-index:2"><b style="color:var(--blue);cursor:pointer" onclick="openClient('${c.tax_id}')">${c.client_code}</b></td>`,
        name: `<td style="${td};font-size:12.5px;cursor:pointer" onclick="openClient('${c.tax_id}')">${(c.name_th||'').slice(0,34)}</td>`,
        grp: `<td style="${td};font-size:12.5px">${c.client_group ? c.client_group : '<span style="color:var(--mut)">—</span>'}</td>`,
        who: `<td style="${td};min-width:126px">${whoOf(c.tax_id).map(t=>staffChip(t)).join('')}</td>`,

      };

    ${!canEditTab('payroll') ? '' : `<div style="${capW}display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)">

    <div style="${capW}display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      ${stat('บริษัทที่รับทำ', nCo, 'var(--txt)')}
      ${stat('กรรมการรวม', nDir.toLocaleString(), 'var(--txt)')}
      ${stat('พนักงานรวม', nEmp.toLocaleString(), 'var(--txt)')}
      ${stat('รวมทั้งหมดทุกบริษัท', nHead.toLocaleString(), 'var(--green)', nNoHead? 'ยังไม่มีตัวเลข ' + nNoHead + ' บริษัท' : 'ครบทุกบริษัท')}
      ${money? stat('ค่าบริการรวม/เดือน', nFee.toLocaleString(), 'var(--green)', nNoFee? 'ยังไม่ได้กรอก ' + nNoFee + ' บริษัท' : 'ครบทุกบริษัท') : ''}
      ${money && nHead? stat('เฉลี่ยต่อคน/เดือน', Math.round(nFee/nHead).toLocaleString(), 'var(--txt)', 'คิดจากบริษัทที่กรอกค่าบริการแล้ว') : ''}
    </div>
    </div>
    <div><table style="border-collapse:collapse;font-size:13px;background:#fff;width:max-content;min-width:100%">
      <tr style="text-align:left">${pOrder.map(k=>`<th style="${th}${k==='head'||k==='fee'||k==='perhead'?';text-align:right':''}">${LBP(k)}</th>`).join('')}</tr>
      ${rows.length? rows.map(rowP).join('') : `<tr><td colspan="${pOrder.length}" style="padding:20px 4px;color:var(--mut)">ยังไม่มีบริษัทที่ระบุคนรับผิดชอบงานเงินเดือนของปี ${y2}</td></tr>`}

  })();
  // หน้าแรก — เมนูหมวดงาน พร้อมตัวเลขสรุปของแต่ละหมวด (31 ส.ค.)
  const homeCard = homeCat ? '' : (() => {
    const y2 = year();
    const nStaff = D.staff.filter(x=>!isResigned(x) && !['CLIENT','PARTNER','TRAINEE'].includes(x.staff_token)).length;
    const nOperate = D.clients.filter(c=>c.status==='Operate').length;
    const nLiq = D.clients.filter(c=>(c.status==='Closed' || liqRow(c.tax_id)) && !(liqRow(c.tax_id)||{}).done_date).length;
    const nReg = (D.regs||[]).filter(r=>!r.done_date).length;
    const nWait = D.clients.filter(c=>calcHoursClass(c, D.works.find(w=>w.work_year===y2 && w.tax_id===c.tax_id)) === 'รอใส่ชั่วโมงการทำงาน').length;
    // ภาษี: นับรายการที่ต้องยื่นงวดปัจจุบันแต่ยังไม่ "ยื่นแล้ว"
    const per = taxPeriod(); let nTax = 0;
    const svc2 = (tx,st)=>D.jobs.some(j=>j.tax_id===tx && j.service_type===st && j.active==='Y');
    D.clients.filter(c=>c.status==='Operate').forEach(c=>{
      [['PP30','VAT'],['PND3','WHT'],['PND53','WHT'],['PND1','PAY'],['SSO','PAY']].forEach(([f,sv])=>{
        if (!svc2(c.tax_id, sv)) return;
        const r = taxRow(c.tax_id, per, f);

      });
    });
    const regTxt = [nReg? `จดทะเบียน ${nReg} เรื่อง`:'', nLiq? `ชำระบัญชี ${nLiq} ราย`:''].filter(Boolean).join(' · ') || 'ไม่มีค้าง';
    const badge = { jobs:`${nStaff} คน`, tax:`ค้าง ${nTax} รายการ`, hours:nWait?`รอใส่ชั่วโมง ${nWait}`:'ครบแล้ว', data:`ทั้งหมด ${D.clients.length} บริษัท · เปิดดำเนินการ ${nOperate}`, reg:regTxt, setup:'', close:'' };
    const cats = HOME_CATS.filter(c=>c.admin? isAdmin() : true).filter(c=>c.soon || c.tabs.some(canSeeTab));

    const card = c => {

        <div style="font-weight:700;font-size:14.5px;margin:9px 0 4px;letter-spacing:-.2px;color:${on?'var(--txt)':'var(--mut)'}">${LANG==='en'? c.en : c.lb}${c.soon?' <span style="font-size:11px;font-weight:400;background:var(--amber-bg);color:var(--amber);border-radius:999px;padding:2px 8px;margin-left:4px">ยังไม่ได้สร้าง</span>':''}</div>
        <div style="font-size:12px;color:var(--mut);line-height:1.55;min-height:36px">${c.desc}</div>
        ${badge[c.k]? `<div style="margin-top:9px;display:inline-block;font-size:11.5px;font-weight:700;background:var(--blue-bg);color:var(--green);border-radius:999px;padding:2px 10px">${badge[c.k]}</div>`:''}
      </div>`;
    };
    return `
  <div class="card">
    <h3 style="margin-bottom:4px">${T('เลือกเรื่องที่จะทำ','Choose your work')}</h3>
    <div style="font-size:12px;color:var(--mut);margin-bottom:14px">สวัสดีค่ะ ${(userName || '').toUpperCase()} · ปีงาน ${y2} — กดหมวดที่ต้องการ แล้วแถบด้านบนจะแสดงเฉพาะแถบของหมวดนั้น กด "← หน้าแรก" เพื่อกลับมาเลือกใหม่</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px">${cats.map(card).join('')}</div>
  </div>`;
  })();
  document.getElementById('dash').innerHTML = `
    <div style="position:sticky;left:0;z-index:9;width:max-content;max-width:calc(100vw - 56px);padding-left:20px">
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      ${homeCat? `<span class="tabpills"><button class="ghost" onclick="goHome()" style="border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer">← ${T('หน้าแรก','Home')}</button><span style="border-left:1px solid var(--line);height:24px;margin:0 4px"></span></span>`:''}
      ${(()=>{ if (!homeCat) return '';
        const TL = {}; Object.keys(TAB_LB_DEF).forEach(k=>TL[k] = tabLb(k));
        const inCat = (HOME_CATS.find(x=>x.k===homeCat)||{tabs:[]}).tabs;
        return '<span class="tabpills">' + getOrder('tabs').filter(t=>inCat.includes(t) && canSeeTab(t)).map(t=> t==='client'
          ? `<button class="ghost" data-draggrp="tabs" data-dragkey="client" onpointerdown="colPointerDown(event,'tabs','client')" style="border-radius:999px;padding:9px 20px;cursor:pointer;touch-action:none;${dashTab==='client'&&!dashPartner?'background:var(--blue-bg);border-color:var(--brand);color:var(--green);font-weight:700':''}" onclick="if(!window.__tabDragged)setDashTab('client')" title="ลากค้างเพื่อสลับลำดับแถบ · คลิกเพื่อเปิด">${T('ลูกค้า','Clients')}</button>`
          : tabBtn(t, TL[t])).join('') + '</span>'; })()}

      ${(()=>{ const pOrder = getOrder('ptabs');
        return (homeCat==='data'&&canSeeTab('client')?D.staff.filter(x=>x.level==='Partner'&&!isResigned(x)):[])
        .sort((a,b)=>{ const ia=pOrder.indexOf(a.staff_token), ib=pOrder.indexOf(b.staff_token);
          return (ia<0?99:ia)-(ib<0?99:ib) || String(a.staff_token).localeCompare(String(b.staff_token)); })
        .map(x=>`<button class="ghost" ${pDrag('ptabs', x.staff_token)} style="border-radius:999px;padding:9px 20px;font-weight:600;cursor:pointer;touch-action:none;${dashTab==='client'&&dashPartner===x.staff_token?'background:var(--blue-bg);border-color:var(--brand);color:var(--green);font-weight:700':''}" onclick="if(!window.__tabDragged)setPartnerTab('${x.staff_token}')" title="ดูเฉพาะพอร์ตของ ${x.staff_token} · ลากค้างเพื่อสลับลำดับ">งาน ${x.staff_token}</button>`).join(''); })()}

  if (['client','grp'].includes(dashTab) && dashQ) dashSearch(dashQ); // คงผลค้นหาไว้หลัง re-render (แถบกลุ่มลูกค้าใช้ช่องเดียวกัน)

// โหมดดูอย่างเดียว (1 ก.ย.) — ใช้กับแถบที่แอดมินติ๊ก "เห็น" แต่ไม่ติ๊ก "แก้ได้"
// ปิดที่หน้าจอเท่านั้นตามที่ผู้ใช้เลือก (ฐานข้อมูลยังเปิดให้บัญชีที่ล็อกอินอ่าน/เขียนได้ทางเทคนิค)
function applyViewOnly(){
  const root = document.getElementById('dash');
  if (!root || !homeCat || isAdmin()) return;
  // ป้ายบอกขอบเขต — ขึ้นทุกแถบที่ไล่รายบริษัท
  if (ownOnly() && ['client','grp','tax','taxy','taxsum','todo','entry'].includes(dashTab)){
    const c0 = root.querySelector('.card');
    if (c0 && !c0.querySelector('.scope-note')){
      const n = document.createElement('div');
      n.className = 'scope-note';
      n.style.cssText = 'margin-bottom:10px;padding:8px 14px;border:1px solid var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:12px;font-size:13px;font-weight:600;max-width:calc(100vw - 96px)';
      n.textContent = '👤 แสดงเฉพาะบริษัทที่คุณรับผิดชอบในปี ' + year() + ' (' + myClientIds().size + ' บริษัท) — ถ้าต้องดูของทีมอื่น แจ้งแอดมิน';
      c0.insertBefore(n, c0.firstChild);
    }
  }
  if (VIEW_ONLY_TABS.includes(dashTab) || canEditTab(dashTab)) return;
  const card = root.querySelector('.card');
  if (card && !card.querySelector('.vo-note')){
    const b = document.createElement('div');
    b.className = 'vo-note';
    b.style.cssText = 'margin-bottom:10px;padding:8px 14px;border:1px solid var(--amber);background:var(--amber-bg);color:var(--amber);border-radius:12px;font-size:13px;font-weight:600;max-width:calc(100vw - 96px)';
    b.textContent = '🔒 โหมดดูอย่างเดียว — บัญชีของคุณเปิดแถบนี้ได้ แต่แก้ข้อมูลไม่ได้ (ถ้าต้องแก้ ให้แจ้งแอดมิน)';
    card.insertBefore(b, card.firstChild);
  }
  // ช่องกรอก/ดรอปดาวน์ที่ใช้แก้ข้อมูล อยู่ในตารางทั้งหมด (ช่องค้นหา/ตัวกรอง/ปุ่มเดือน อยู่นอกตาราง)
  root.querySelectorAll('table input, table select, table textarea').forEach(el=>{
    el.disabled = true; el.style.background = 'var(--bg)'; el.style.cursor = 'not-allowed';
  });
  // ปุ่ม/ไอคอนในตารางที่กดแล้วเปลี่ยนข้อมูล — เปิดไฟล์/เปิดหน้าบริษัท/เมนูคอลัมน์ ยังกดได้
  const KEEP = /(OpenFile|openClient|taxSumGo|toggleColMenu|colMenu|Drill|hideCol|unhideCol|setSort)/;
  const MUT  = /(Attach|Upload|Del|Set|Save|Add|Swap|Remove|Lock|newYear|delYear|Dup)/;
  root.querySelectorAll('table [onclick]').forEach(el=>{
    const h = el.getAttribute('onclick') || '';
    if (KEEP.test(h)) return;
    if (MUT.test(h)){ el.style.pointerEvents = 'none'; el.style.opacity = '.5'; }
  });
  // ปิดการลากไฟล์มาวางในทุกช่อง
  root.querySelectorAll('table [ondrop]').forEach(td=>{ td.removeAttribute('ondrop'); td.removeAttribute('ondragover'); td.removeAttribute('ondragleave'); });
}

function renderList(){
  return; // เลิกใช้แถบรายชื่อบริษัทด้านซ้ายแล้ว (31 ส.ค. — เหลือเมนูงานอย่างเดียว)
  const q=(search.value||'').toLowerCase(), st=statusSel.value;
  const el=document.getElementById('list');
  const list = D.clients.filter(c=>{
    if (st && c.status!==st) return false;
    return !q || (c.client_code+' '+c.name_th+' '+c.tax_id).toLowerCase().includes(q);
  });
  // จัดเรียงให้กลุ่มเดียวกันอยู่ติดกัน (กลุ่มมีชื่อก่อน Others ท้ายสุด) — แก้กลุ่มแล้วแถวย้ายเองตอนวาดใหม่
  const gRank = c => (c.client_group||'Others')==='Others' ? 1 : 0;
  list.sort((a,b)=> gRank(a)-gRank(b) || (a.client_group||'').localeCompare(b.client_group||'') || (a.client_code||'').localeCompare(b.client_code||''));
  let lastG = null, html = '';
  list.forEach(c=>{
    const g = c.client_group || 'Others';
    if (g !== lastG){
      lastG = g;
      const n = list.filter(x=>(x.client_group||'Others')===g).length;
      html += `<div style="position:sticky;top:0;z-index:1;padding:6px 16px;background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:600;border-bottom:1px solid var(--line)">${g} · ${n}</div>`;
    }
    html += `<div class="item ${c.tax_id===selTax?'sel':''}" onclick="selectClient('${c.tax_id}')">
      <div class="c">${c.client_code} <span class="tag">${c.status==='Operate'?'':'· '+c.status}</span></div>
      <div class="n">${c.name_th}</div></div>`;
  });
  el.innerHTML = html;
}

const ENTITY_TYPES = [
  ['CO','บริษัทจำกัด'], ['PCL','บริษัทมหาชน'], ['HSJ','ห้างหุ้นส่วนจำกัด'],
  ['JV','กิจการร่วมค้า'], ['FND','มูลนิธิ'], ['ASSN','สมาคม'], ['OTHER','อื่น ๆ (พิมพ์ชื่อเต็มเอง)'],
];
function composeName(t, core){
  core = (core||'').trim();
  if (t==='CO') return `บริษัท ${core} จำกัด`;
  if (t==='PCL') return `บริษัท ${core} จำกัด (มหาชน)`;
  if (t==='HSJ') return `ห้างหุ้นส่วนจำกัด ${core}`;
  if (t==='JV') return `กิจการร่วมค้า ${core}`;
  if (t==='FND') return `มูลนิธิ ${core}`;
  if (t==='ASSN') return `สมาคม ${core}`;
  return core;
}
function parseName(full){
  full = (full||'').trim(); let m;
  if ((m = full.match(/^บริษัท\s+(.+?)\s+จำกัด\s*\(มหาชน\)$/))) return {t:'PCL', core:m[1]};
  if ((m = full.match(/^บริษัท\s*(.+?)\s*จำกัด$/))) return {t:'CO', core:m[1]};
  if ((m = full.match(/^ห้างหุ้นส่วนจำกัด\s*(.+)$/))) return {t:'HSJ', core:m[1]};
  if ((m = full.match(/^กิจการร่วมค้า\s*(.+)$/))) return {t:'JV', core:m[1]};
  if ((m = full.match(/^มูลนิธิ\s*(.+)$/))) return {t:'FND', core:m[1]};
  if ((m = full.match(/^สมาคม\s*(.+)$/))) return {t:'ASSN', core:m[1]};
  return {t:'OTHER', core:full};
}

// แนะนำตัวย่อบริษัท 3 ตัวพิมพ์ใหญ่จากชื่อ (อังกฤษก่อน ไทย fallback) — ไม่ชนกับตัวย่อที่มีอยู่ ผู้ใช้แก้ทับได้เสมอ
function suggestClientCode(nameEN, nameTH){
  const taken = new Set(D.clients.map(c=>String(c.client_code||'').toUpperCase()));
  const clean = String(nameEN||'').toUpperCase().replace(/\b(COMPANY|CO|LIMITED|LTD|PUBLIC|PCL|PARTNERSHIP|JOINT|VENTURE|THE)\b\.?/g,' ').replace(/[^A-Z ]+/g,' ').trim();
  let words = clean.split(/\s+/).filter(Boolean);
  if (!words.length && nameTH){
    const M = {'ก':'K','ข':'K','ค':'K','ฆ':'K','ง':'N','จ':'J','ฉ':'C','ช':'C','ซ':'S','ฌ':'C','ญ':'Y','ฎ':'D','ฏ':'T','ฐ':'T','ฑ':'T','ฒ':'T','ณ':'N','ด':'D','ต':'T','ถ':'T','ท':'T','ธ':'T','น':'N','บ':'B','ป':'P','ผ':'P','ฝ':'F','พ':'P','ฟ':'F','ภ':'P','ม':'M','ย':'Y','ร':'R','ล':'L','ว':'W','ศ':'S','ษ':'S','ส':'S','ห':'H','ฬ':'L','อ':'O','ฮ':'H'};
    const core = (typeof parseName==='function' ? (parseName(nameTH).core || nameTH) : nameTH);
    const letters = Array.from(core).map(ch=>M[ch]||'').join('');
    if (letters) words = [letters];
  }
  if (!words.length) return '';
  const cands = [];
  if (words.length>=3) cands.push(words[0][0]+words[1][0]+words[2][0]);
  if (words.length>=2){ cands.push(words[0][0]+words[1].slice(0,2)); cands.push(words[0].slice(0,2)+words[1][0]); }
  cands.push(words[0].slice(0,3));
  if (words.length>=2) cands.push(words[0][0]+words[1][0]+(words[1][1]||'X'));
  for (let cand of cands){ cand = String(cand||'').replace(/[^A-Z]/g,''); if (cand.length===3 && !taken.has(cand)) return cand; }
  const base = String((cands[0]||words[0]||'XX')).replace(/[^A-Z]/g,'').padEnd(2,'X').slice(0,2);
  for (let d=1; d<=9; d++){ if (!taken.has(base+d)) return base+d; }
  return '';
}
function suggestCodeFromForm(){
  const th = composeName(document.getElementById('nc-etype')?.value, document.getElementById('nc-name_core')?.value);
  const sg = suggestClientCode(window.__ncNameEN||'', th);

// ดึงข้อมูลนิติบุคคลจาก DBD Open API ด้วยเลข 13 หลัก — เติมชื่อ/ประเภทนิติบุคคล/ประเภทธุรกิจ/ทุน/สถานะให้อัตโนมัติ
// (ข้อมูลฝั่งสรรพากร เช่น VAT/รอบบัญชี/อัตราภาษี ยังกรอกเองตามเดิม)
async function fetchDBD(){
  const el = document.getElementById('nc-tax_id');
  const tax = (el?.value||'').replace(/\D/g,'');
  if (tax.length !== 13){ toast('ใส่เลขทะเบียน 13 หลักก่อน แล้วค่อยกดดึงข้อมูล'); return; }
  const btn = document.getElementById('nc-dbd-btn');
  if (btn){ btn.disabled = true; btn.textContent = 'กำลังดึง...'; }
  try {
    const r = await fetch('https://openapi.dbd.go.th/api/v1/juristic_person/' + tax);
    const j = await r.json();
    const p = j && j.data && j.data[0] && j.data[0]['cd:OrganizationJuristicPerson'];
    if (!p){ toast('ไม่พบข้อมูลเลขนี้ในระบบ DBD — ตรวจเลขอีกครั้ง'); return; }
    const set = (id, v) => { const e = document.getElementById('nc-'+id); if (e && v!==null && v!==undefined && v!=='') e.value = v; };
    const pn = parseName((p['cd:OrganizationJuristicNameTH']||'').trim());
    set('etype', pn.t); set('name_core', pn.core); namePreview('nc');
    window.__ncNameEN = (p['cd:OrganizationJuristicNameEN']||'').trim();
    const codeEl = document.getElementById('nc-client_code');
    if (codeEl && !codeEl.value.trim()){
      const sg = suggestClientCode(window.__ncNameEN, p['cd:OrganizationJuristicNameTH']||'');
      if (sg) codeEl.value = sg;
    }
    const obj = p['cd:OrganizationJuristicObjective'];
    const o1 = obj && (Array.isArray(obj['td:JuristicObjective']) ? obj['td:JuristicObjective'][0] : obj['td:JuristicObjective']);
    if (o1) set('dbd_type', (o1['td:JuristicObjectiveTextTH']||'').trim());
    if (p['cd:OrganizationJuristicRegisterCapital']) set('registered_capital', Math.round(+p['cd:OrganizationJuristicRegisterCapital']));
    const st = p['cd:OrganizationJuristicStatus']||'';
    if (/เลิก|ร้าง|เสร็จการชำระบัญชี/.test(st)) set('status','Closed');
    const reg = p['cd:OrganizationJuristicRegisterDate']||'';
    const regTxt = reg.length===8 ? `${reg.slice(6,8)}/${reg.slice(4,6)}/${+reg.slice(0,4)+543}` : '—';
    let addr = '';
    try { const a = p['cd:OrganizationJuristicAddress']['cr:AddressType'];
      addr = [a['cd:Address'], a['cd:CitySubDivision']&&('แขวง/ตำบล'+a['cd:CitySubDivision']['cr:CitySubDivisionTextTH']), a['cd:City']&&a['cd:City']['cr:CityTextTH'], a['cd:CountrySubDivision']&&a['cd:CountrySubDivision']['cr:CountrySubDivisionTextTH']].filter(Boolean).join(' ');
    } catch(e){}
    const info = document.getElementById('nc-dbd-info');
    if (info) info.innerHTML = `<span style="color:var(--green);font-weight:600">✓ ดึงจาก DBD แล้ว:</span> ${p['cd:OrganizationJuristicNameTH']||''} · สถานะ DBD: <b>${st}</b> · จดทะเบียน ${regTxt} (พ.ศ.)${addr? ` · ${addr}`:''}<br><span style="color:var(--mut)">เติมให้แล้ว: ชื่อ/ประเภทนิติบุคคล, ประเภทธุรกิจ, ทุนจดทะเบียน — ส่วนของสรรพากร (จด VAT, วันจด VAT, รอบบัญชี, อัตราภาษี) กรอกเองต่อได้เลย</span>`;
    toast('ดึงข้อมูลจาก DBD สำเร็จ');
  } catch(e){ toast('ดึงข้อมูล DBD ไม่สำเร็จ: ' + e.message); }
  finally { if (btn){ btn.disabled = false; btn.textContent = 'ดึงข้อมูล DBD'; } }
}

// ---- แถบชำระบัญชี: ติดตามบริษัทจดเลิกจนเสร็จการชำระบัญชี (ยื่น ลช.3 ทุก 3 เดือน) ----
function liqRow(tax){ return (D.liq||[]).find(x=>x.tax_id===tax); }
function beToDate(s){
  const m = (s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  let y = +m[3]; if (y > 2400) y -= 543;
  const d = new Date(y, +m[2]-1, +m[1]); return isNaN(d) ? null : d;
}
function dateToBe(d){ return d ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()+543}` : '—'; }
function isoToBe(iso){ const d = iso ? new Date(iso+'T00:00:00') : null; return (d && !isNaN(d)) ? dateToBe(d) : '—'; }
// ช่องกรอกวันที่มาตรฐานของทั้งระบบ (4 ก.ย.) — โชว์/พิมพ์เป็น วว/ดด/ปปปป (พ.ศ.) เสมอ
// เลิกใช้ <input type="date"> ตรง ๆ เพราะรูปแบบที่แสดงขึ้นกับภาษาของเครื่อง (เครื่อง en-US จะเป็น ดด/วว/ปปปป ค.ศ.)
// เก็บค่าในฐานข้อมูลเป็น ISO เหมือนเดิม — แปลงตอนแสดง/ตอนบันทึกเท่านั้น
const beDateCB = {};                       // id → ฟังก์ชันรับค่า ISO (id ต้องคงที่ ไม่งั้น map บวม)
function beDateBox(id, iso, cb, opt){
  beDateCB[id] = cb; const o = opt || {};
  const txt = iso ? isoToBe(iso) : '';
  const w = o.width || '104px';
  return `<span style="white-space:nowrap;display:inline-flex;align-items:center;gap:2px;position:relative">`
    + `<input id="bed-${id}" value="${txt==='—'?'':txt}" placeholder="วว/ดด/ปปปป" onchange="beDateType('${id}',this.value)"`
    + ` title="${o.title || 'พิมพ์เป็น วว/ดด/ปปปป (พ.ศ.) หรือกดปุ่มปฏิทิน'}" style="width:${w};${o.style||''}">`

    + `<input type="date" id="bedp-${id}" value="${iso||''}" style="position:absolute;left:0;bottom:0;width:0;height:0;opacity:0;border:0;padding:0">`
    + `</span>`;
}
function beDateType(id, v){
  const t = (v||'').trim();
  if (t && !beToDate(t)){ toast('รูปแบบวันที่ต้องเป็น วว/ดด/ปปปป (พ.ศ.) เช่น 04/09/2569'); return; }
  const cb = beDateCB[id]; if (cb) cb(t ? toISODate(t) : null);
}
function beDatePick(id){
  const p = document.getElementById('bedp-' + id); if (!p) return;
  p.onchange = () => { if (p.value) beDateType(id, isoToBe(p.value)); };
  if (p.showPicker) p.showPicker(); else p.click();
}
async function liqSave(tax, patch){
  const { error } = await sb.from('liquidation').upsert({ tax_id: tax, ...patch }, { onConflict:'tax_id' });
  if (error){ toast('บันทึกไม่สำเร็จ: ' + error.message); return false; }
  const r = liqRow(tax); if (r) Object.assign(r, patch); else (D.liq = D.liq||[]).push({ tax_id:tax, lor3_dates:[], ...patch });
  return true;
}
async function liqSet(tax, field, val){
  if (field==='dissolve_date' && (val||'').trim() && !beToDate(val)){ toast('รูปแบบวันที่ต้องเป็น วว/ดด/ปปปป (พ.ศ.)'); renderDash(); return; }
  if (await liqSave(tax, { [field]: (val||'').trim() || null })){ toast('บันทึกแล้ว'); renderDash(); }
}
// ประวัติการยื่น ลช.3 — รองรับทั้งรูปแบบเก่า (สตริงวันที่) และใหม่ (มีไฟล์แนบ): {date:'YYYY-MM-DD', files:[{path,name}]}
function liqEntries(tax){
  const raw = (liqRow(tax)?.lor3_dates) || [];
  return raw.map(e => typeof e === 'string' ? { date: e, files: [] } : { date: e.date, files: Array.isArray(e.files) ? e.files : [] })
    .sort((a,b)=> String(a.date).localeCompare(String(b.date)));
}
function todayIso(){ const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; }
let liqOpenTax = null; // แถวที่กางแผงประวัติอยู่
function liqTogglePanel(tax){ liqOpenTax = (liqOpenTax===tax) ? null : tax; renderDash(); }
async function liqFile3(tax){
  const iso = todayIso();

  if (cur.some(e=>e.date===iso)){ toast('วันนี้บันทึกไปแล้ว — แนบไฟล์เพิ่มได้ในแผงประวัติ'); liqOpenTax = tax; renderDash(); return; }
  if (!confirm('บันทึกว่ายื่น ลช.3 วันนี้ (' + isoToBe(iso) + ') ?')) return;
  if (await liqSave(tax, { lor3_dates: cur.concat({ date: iso, files: [] }) })){
    toast('บันทึกยื่น ลช.3 แล้ว — แนบไฟล์เอกสารได้เลย (📎)'); liqOpenTax = tax; renderDash();

async function liqDelEntry(tax, i){
  const cur = liqEntries(tax);
  const e = cur[i]; if (!e) return;
  if (!confirm('ลบการยื่นวันที่ ' + isoToBe(e.date) + (e.files.length? ` (ไฟล์แนบ ${e.files.length} ไฟล์จะถูกลบด้วย)`:'') + ' ?')) return;
  for (const f of e.files){ try { await sb.storage.from('liqdocs').remove([f.path]); } catch(x){} }

let liqUpTax = null, liqUpIdx = null;
function liqAttach(tax, i){
  liqUpTax = tax; liqUpIdx = i;
  const inp = document.getElementById('liqFileInp');
  if (inp){ inp.value = ''; inp.click(); }
}
async function liqUploadPicked(inp){
  const tax = liqUpTax, i = liqUpIdx;
  if (!tax || !inp.files || !inp.files.length) return;
  const cur = liqEntries(tax);
  if (!cur[i]){ toast('ไม่พบรายการ'); return; }
  toast('กำลังอัปโหลด...');
  for (const f of Array.from(inp.files)){
    const safe = f.name.replace(/[^\w\.\-ก-๙]+/g, '_').slice(-80);
    const path = tax + '/' + cur[i].date + '_' + Date.now() + '_' + safe;
    const { error } = await sb.storage.from('liqdocs').upload(path, f);
    if (error){ toast('อัปโหลดไม่สำเร็จ: ' + error.message); return; }
    cur[i].files.push({ path, name: f.name });
  }
  if (await liqSave(tax, { lor3_dates: cur })){ toast('แนบไฟล์แล้ว'); renderDash(); }
}
async function liqOpenFile(path){
  const { data, error } = await sb.storage.from('liqdocs').createSignedUrl(path, 3600);
  if (error || !data?.signedUrl){ toast('เปิดไฟล์ไม่สำเร็จ: ' + (error?.message||'')); return; }
  window.open(data.signedUrl, '_blank');
}
async function liqDelFile(tax, i, j){
  const cur = liqEntries(tax);
  const f = cur[i] && cur[i].files[j]; if (!f) return;
  if (!confirm('ลบไฟล์ ' + f.name + ' ?')) return;
  try { await sb.storage.from('liqdocs').remove([f.path]); } catch(x){}
  cur[i].files.splice(j,1);

async function liqSetClientStatus(tax, st){
  const { error } = await sb.from('client').update({ status: st }).eq('tax_id', tax);
  if (error){ toast('เปลี่ยนสถานะบริษัทไม่สำเร็จ: ' + error.message); return; }
  const c = D.clients.find(x=>x.tax_id===tax); if (c) c.status = st;

async function liqDone(tax){
  const v = prompt('วันเสร็จการชำระบัญชี (พ.ศ. วว/ดด/ปปปป) — เว้นว่าง = วันนี้', '');

  const d = v.trim()==='' ? dateToBe(new Date()) : v.trim();
  if (!beToDate(d)){ toast('รูปแบบวันที่ไม่ถูกต้อง'); return; }

    await liqSetClientStatus(tax, 'Settlement');

function taxFormLabel(k){
  const a = TAX_FORMS.find(f=>f.k===k) || TAXY_FORMS.find(f=>f.k===k) || FILE_FORM_PAT.find(f=>f.k===k);
  return a ? a.lb : k;
}
function fileFormGuess(name){ for (const p of FILE_FORM_PAT) if (p.re.test(name)) return p; return null; }
// เดางวดจากชื่อไฟล์ — คืน {y:ค.ศ.|null, m:1-12} ถ้าเจอ
function fileYMGuess(name){
  const s = name.replace(/\d{13}/g, ' ').replace(/[\s_]+/g, ' ');   // ตัดเลขผู้เสียภาษี 13 หลักทิ้งก่อน กันอ่านปีผิด
  const norm = (y, m) => ({ y: y > 2400 ? y - 543 : y, m });
  let m = s.match(/(20\d{2}|25\d{2})[-. \/]?(0[1-9]|1[0-2])(?!\d)/);
  if (m) return norm(+m[1], +m[2]);
  m = s.match(/(^|[^\d])(0[1-9]|1[0-2])[-. \/](20\d{2}|25\d{2})([^\d]|$)/);
  if (m) return norm(+m[3], +m[2]);
  const TH = [['ม.ค','มกรา'],['ก.พ','กุมภา'],['มี.ค','มีนา'],['เม.ย','เมษา'],['พ.ค','พฤษภา'],['มิ.ย','มิถุนา'],
              ['ก.ค','กรกฎา'],['ส.ค','สิงหา'],['ก.ย','กันยา'],['ต.ค','ตุลา'],['พ.ย','พฤศจิกา'],['ธ.ค','ธันวา']];
  for (let i = 0; i < 12; i++) if (TH[i].some(w=>s.includes(w))){
    const yy = s.match(/(20\d{2}|25\d{2})/);
    return yy ? norm(+yy[1], i+1) : { y:null, m:i+1 };
  }
  return null;
}
function fileYearsGuess(name){
  return [...new Set((name.replace(/\d{13}/g,' ').match(/(20\d{2}|25\d{2})/g)||[]).map(Number))];
}
// ไฟล์ชื่อเดียวกันเคยแนบไว้ช่องไหนแล้วบ้าง (กันวางซ้ำตอนลากทีละหลายไฟล์)
function taxFileSeenAt(name, kind, tax, key, form){
  const n = (name||'').toLowerCase(), hit = [];
  (D.tax||[]).forEach(r=>(r.files||[]).forEach(f=>{
    if ((f.name||'').toLowerCase()!==n) return;
    if (kind==='m' && r.tax_id===tax && r.period===key && r.form===form) return;
    const c = D.clients.find(x=>x.tax_id===r.tax_id);
    hit.push(`${c?c.client_code:r.tax_id} · ${taxFormLabel(r.form)} · งวด ${taxPeriodLabel(r.period)}`);
  }));
  (D.taxY||[]).forEach(r=>(r.files||[]).forEach(f=>{
    if ((f.name||'').toLowerCase()!==n) return;
    if (kind==='y' && r.tax_id===tax && r.fy_be===key && r.form===form) return;
    const c = D.clients.find(x=>x.tax_id===r.tax_id);
    hit.push(`${c?c.client_code:r.tax_id} · ${taxFormLabel(r.form)} · รอบปี ${r.fy_be}`);
  }));
  return [...new Set(hit)];
}
const FILE_OK_EXT = ['pdf','jpg','jpeg','png','heic','webp','tif','tiff','xls','xlsx','csv','doc','docx','zip','rar','7z'];
// ตรวจไฟล์ 1 ไฟล์กับช่องที่วาง — คืนรายการข้อสังเกต (ว่าง = ไม่พบอะไรผิด)
// รูปแบบชื่อไฟล์มาตรฐานของสำนักงาน (อัปเดต 3 ก.ย. — แบบภาษีใช้ตัวย่ออังกฤษ): YYYYMM_แบบภาษี_ตัวย่อบริษัท เช่น 202608_PP.30_ACT · 202608_PND.1_ACT
// รับทั้ง ค.ศ. (2026) และ พ.ศ. (2569) · บอร์ดรายปีรับ YYYY 4 หลักด้วย
// ตัวย่อภาษาอังกฤษของแบบภาษี ใช้ตั้งชื่อไฟล์ใน OneDrive (ผู้ใช้ยืนยัน 3 ก.ย.: ภ.พ.30 = PP.30 · ภ.ง.ด.1 = PND.1)
const FORM_EN_NAME = { PP30:'PP.30', PP36:'PP.36', PND1:'PND.1', PND3:'PND.3', PND53:'PND.53', PND54:'PND.54',
  SSO:'SSO', WEL:'WEL', PND50:'PND.50', PND51:'PND.51', PND1K:'PND.1K', SBCH3:'SBCH.3', FS:'FS', NEWS:'NEWS' };
function taxStdName(kind, tax, form){
  const c = D.clients.find(x=>x.tax_id===tax);
  const per = kind==='y' ? String(taxYFY()) : taxPeriod().replace('-','');
  return `${per}_${FORM_EN_NAME[form] || taxFormLabel(form)}_${c?c.client_code:''}`;
}
function parseStdName(name){
  const base = String(name||'').replace(/\.[^.]+$/,'').trim();
  const m = base.match(/^(\d{6}|\d{4}(?:[-.]\d{2})?)[_\-\s]+(.+?)[_\-\s]+([A-Za-z0-9.\-]{2,12})$/);
  if (!m) return null;
  const d = m[1].replace(/[-.]/g,''), y = +d.slice(0,4), mo = d.length>=6 ? +d.slice(4,6) : null;
  if (mo !== null && (mo < 1 || mo > 12)) return null;
  if (!((y>=2000 && y<=2199) || (y>=2500 && y<=2699))) return null;
  return { y: y>2400 ? y-543 : y, beY: y>2400 ? y : y+543, m: mo, form: m[2].trim(), code: m[3].toUpperCase() };
}
// ตรวจไฟล์ 1 ไฟล์กับช่องที่วาง
//  w = พบหลักฐานว่าผิดช่อง → ถามยืนยันก่อนแนบ
//  n = แค่ชื่อไฟล์ไม่ตรงรูปแบบสำนักงาน → ไม่ขวาง แต่บอกให้รู้ + ติดธงไว้
function taxCheckFile(kind, tax, form, f){
  const w = [], n = [], name = f.name || '';
  const c = D.clients.find(x=>x.tax_id===tax);
  const my = ((c && c.client_code) || '').toUpperCase();
  const key = kind==='y' ? taxYFY() : taxPeriod();

  if (!f.size) w.push('ไฟล์ว่าง (0 ไบต์) — น่าจะดาวน์โหลดมาไม่ครบ');
  const ext = (name.split('.').pop()||'').toLowerCase();
  if (name.indexOf('.') < 0 || !FILE_OK_EXT.includes(ext)) w.push(`นามสกุลไฟล์ .${ext||'(ไม่มี)'} ไม่ใช่ชนิดที่ใช้เก็บหลักฐานตามปกติ`);

  const std = parseStdName(name);

  // ---- ชื่อแบบ ----
  const g = fileFormGuess(std ? std.form : name);
  if (g && g.k !== form) w.push(`ชื่อไฟล์ระบุแบบ <b>${g.lb}</b> แต่กำลังวางในช่อง <b>${taxFormLabel(form)}</b>`);

  // ---- บริษัท ----
  const ids = name.match(/\d{13}/g) || [];
  if (ids.length && !ids.includes(tax)){
    const other = D.clients.find(x=>ids.includes(x.tax_id));
    w.push(other ? `เลขผู้เสียภาษีในชื่อไฟล์เป็นของ <b>${other.client_code} ${other.name_th||''}</b>`
                 : `เลขผู้เสียภาษีในชื่อไฟล์ (${ids[0]}) ไม่ตรงกับบริษัทนี้`);
  } else if (std && my && std.code !== my){
    const other = D.clients.find(x=>(x.client_code||'').toUpperCase()===std.code);
    w.push(`ชื่อไฟล์ระบุตัวย่อ <b>${std.code}</b>${other?` (${other.name_th||''})`:''} แต่กำลังวางในแถวของ <b>${my} ${c.name_th||''}</b>`);
  } else if (!std && c){
    const toks = name.toUpperCase().split(/[^A-Z0-9]+/).filter(x=>x.length>=3);
    if (!toks.includes(my)){
      const other = D.clients.find(x=>{ const cd=(x.client_code||'').toUpperCase(); return cd.length>=3 && cd!==my && toks.includes(cd); });
      if (other) w.push(`ชื่อไฟล์มีตัวย่อ <b>${other.client_code}</b> ซึ่งเป็นของบริษัทอื่น (${other.name_th||''})`);
    }
  }

  // ---- งวด ----
  if (kind==='m'){
    const [pY, pM] = key.split('-').map(Number);
    if (std){
      // ชื่อไฟล์บอกงวดตรง ๆ ตามรูปแบบสำนักงาน → เทียบแบบเป๊ะ ไม่ต้องผ่อนให้เดือนถัดไป
      if (std.m !== null && (std.y !== pY || std.m !== pM))
        w.push(`ชื่อไฟล์ระบุงวด <b>${taxPeriodLabel(std.y+'-'+String(std.m).padStart(2,'0'))}</b> แต่กำลังวางในงวด <b>${taxPeriodLabel(key)}</b>`);
    } else {
      const nx = new Date(pY, pM); // ชื่อไฟล์นอกรูปแบบมักติดวันที่ยื่น = เดือนถัดจากงวด จึงยอมรับด้วย
      const ok = [[pY,pM], [nx.getFullYear(), nx.getMonth()+1]];
      const gy = fileYMGuess(name);
      if (gy && !ok.some(([y,m]) => m===gy.m && (gy.y===null || y===gy.y)))
        w.push(`ชื่อไฟล์ระบุงวด <b>${taxPeriodLabel((gy.y||pY)+'-'+String(gy.m).padStart(2,'0'))}</b> แต่กำลังวางในงวด <b>${taxPeriodLabel(key)}</b>`);
    }
  } else {
    if (std){
      if (std.beY !== key) w.push(`ชื่อไฟล์ระบุปี <b>${std.beY}</b> แต่กำลังวางในรอบบัญชีปี <b>${key}</b>`);
    } else {
      const ys = fileYearsGuess(name);
      const ok = [key, key+1, key-543, key-542];
      if (ys.length && !ys.some(y=>ok.includes(y)))
        w.push(`ชื่อไฟล์ระบุปี <b>${ys.join(', ')}</b> แต่กำลังวางในรอบบัญชีปี <b>${key}</b>`);
    }
  }

  // ---- ไฟล์ซ้ำ ----
  const seen = taxFileSeenAt(name, kind, tax, key, form);
  if (seen.length) w.push(`ไฟล์ชื่อนี้แนบไว้แล้วที่ ${seen.slice(0,3).join(' / ')}`);

  // ---- ไม่ตรงรูปแบบชื่อไฟล์ของสำนักงาน (ไม่ขวางการแนบ) ----
  return { w, n };
}
// ---- ชั้นที่ 2: อ่านเนื้อในไฟล์ PDF จริง (31 ส.ค. — ผู้ใช้ยืนยันว่าไฟล์เป็น PDF จากสรรพากร) ----
// โหลด pdf.js ตอนใช้ครั้งแรกเท่านั้น ถ้าโหลดไม่ได้ (เน็ตหลุด) ให้ข้ามไปใช้ผลตรวจจากชื่อไฟล์อย่างเดียว
const PDFJS_VER = '3.11.174', PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/' + PDFJS_VER + '/';
let pdfLibP = null;
function loadPdfLib(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfLibP) return pdfLibP;
  pdfLibP = new Promise(res=>{
    const el = document.createElement('script');
    el.src = PDFJS_BASE + 'pdf.min.js';
    el.onload = ()=>{ try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js'; } catch(e){}
                      res(window.pdfjsLib || null); };
    el.onerror = ()=>res(null);
    document.head.appendChild(el);
  });
  return pdfLibP;
}
async function pdfText(file, maxPages){
  try {
    const lib = await loadPdfLib(); if (!lib) return null;
    const doc = await lib.getDocument({ data: await file.arrayBuffer(),
      cMapUrl: PDFJS_BASE + 'cmaps/', cMapPacked: true }).promise;
    let out = '';
    const n = Math.min(doc.numPages, maxPages || 2);
    for (let i = 1; i <= n; i++){
      const tc = await (await doc.getPage(i)).getTextContent();
      out += tc.items.map(x=>x.str).join(' ') + '\n';
    }
    return out;
  } catch(e){ return null; }
}
const MONTH_TH_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
// ตรวจจากเนื้อในไฟล์ — เตือนเฉพาะหลักฐานที่มั่นใจ (เลขผู้เสียภาษี · ชื่อแบบ · เดือน/ปีภาษี)
async function taxCheckPdf(kind, tax, form, f){
  const w = [], n = [];
  const isPdf = /pdf/i.test(f.type||'') || /\.pdf$/i.test(f.name||'');
  if (!isPdf) return { w, n };
  const txt = await pdfText(f);
  if (txt === null || !txt.trim()){
    n.push('อ่านข้อความในไฟล์ PDF ไม่ได้ (น่าจะเป็นไฟล์สแกน) — ตรวจได้เฉพาะจากชื่อไฟล์');
    return { w, n };
  }
  const flat = txt.replace(/\s+/g, '');            // ตัดช่องว่างทิ้ง ให้คำไทยที่ถูกตัดคำมาต่อกันได้
  // เกณฑ์ 3 ก.ย.: แบบสรรพากรที่ยื่นจริง ไฟล์ต้องมีหน้า "ใบเสร็จรับเงิน" (ลายน้ำรอตรวจสอบเป็นรูป อ่านไม่ได้)
  if (kind === 'm' && ['PP30','PP36','PND1','PND3','PND53','PND54'].includes(form)){
    if (flat.includes('รอตรวจสอบ'))
      w.push('ไฟล์มีคำ <b>"รอตรวจสอบ"</b> — เป็นฉบับร่างที่ยังไม่ได้ยื่นจริง');
    else if (!(flat.includes('ใบเสร็จรับเงิน') && flat.includes('เลขที่ใบเสร็จ')))
      w.push('ไฟล์นี้<b>ไม่มีหน้าใบเสร็จรับเงิน</b> — ถ้ายังไม่ได้ยื่นจริง อย่าตั้งสถานะ ยื่นแล้ว (ถ้ายื่นแล้วควรรวมใบเสร็จเข้าไฟล์ด้วย)');
  }
  const digits = txt.replace(/\D/g, '');           // รวมเลขทั้งหมด — รองรับเลขผู้เสียภาษีที่พิมพ์คั่นขีด/เว้นวรรค

  // เลขผู้เสียภาษี: ยืนยันว่าเจอของบริษัทนี้ไหม — เตือนเฉพาะตอนเจอ "ของบริษัทอื่น" แทน (มั่นใจสูง)
  if (!digits.includes(tax)){
    const other = D.clients.find(x=>x.tax_id && x.tax_id.length===13 && x.tax_id!==tax && digits.includes(x.tax_id));
    if (other) w.push(`ในไฟล์ระบุเลขผู้เสียภาษีของ <b>${other.client_code} ${other.name_th||''}</b> ไม่ใช่บริษัทนี้`);
    else n.push('ในไฟล์ไม่พบเลขผู้เสียภาษีของบริษัทนี้ — ช่วยเปิดดูอีกครั้ง');
  }

  // ชื่อแบบที่พิมพ์อยู่ในเอกสาร
  const g = fileFormGuess(flat);
  if (g && g.k !== form) w.push(`เนื้อในไฟล์เป็นแบบ <b>${g.lb}</b> แต่กำลังวางในช่อง <b>${taxFormLabel(form)}</b>`);

  // เดือน/ปีภาษี ที่พิมพ์อยู่ในแบบ
  if (kind === 'm'){
    const [pY, pM] = taxPeriod().split('-').map(Number);
    const mi = MONTH_TH_FULL.findIndex(w2=>flat.includes('เดือนภาษี' + w2));
    if (mi >= 0 && mi + 1 !== pM)
      w.push(`ในไฟล์ระบุเดือนภาษี <b>${MONTH_TH_FULL[mi]}</b> แต่กำลังวางในงวด <b>${taxPeriodLabel(taxPeriod())}</b>`);
    const yy = flat.match(/ปีภาษี(25\d{2})/);
    if (yy && +yy[1] - 543 !== pY)
      w.push(`ในไฟล์ระบุปีภาษี <b>${yy[1]}</b> แต่กำลังวางในงวด <b>${taxPeriodLabel(taxPeriod())}</b>`);
  } else {
    const yy = flat.match(/(?:ปีภาษี|รอบระยะเวลาบัญชี)(25\d{2})/);
    if (yy && +yy[1] !== taxYFY())
      w.push(`ในไฟล์ระบุปี <b>${yy[1]}</b> แต่กำลังวางในรอบบัญชีปี <b>${taxYFY()}</b>`);
  }
  return { w, n };
}
// สรุปผลตรวจทั้งชุด แล้วถามยืนยันก่อนอัปโหลด (ถามเฉพาะกรณีเจอหลักฐานว่าผิดช่อง)
async function taxConfirmFiles(kind, tax, form, files){
  if (files.some(f=>/pdf/i.test(f.type||'') || /\.pdf$/i.test(f.name||''))) toast('กำลังตรวจไฟล์...');
  const res = [];
  for (const f of files){
    const a = taxCheckFile(kind, tax, form, f);
    const b = await taxCheckPdf(kind, tax, form, f);
    res.push({ f, w:[...a.w, ...b.w], n:[...a.n, ...b.n] });
  }
  const bad = res.filter(x=>x.w.length);
  if (!bad.length) return res;
  const c = D.clients.find(x=>x.tax_id===tax);
  const where = `${c?c.client_code+' '+(c.name_th||''):tax} · ${taxFormLabel(form)} · ${kind==='y'?'รอบบัญชีปี '+taxYFY():'งวด '+taxPeriodLabel(taxPeriod())}`;
  const strip = t => t.replace(/<\/?b>/g,'"');
  const msg = 'ตรวจไฟล์แล้วพบว่าอาจวางผิดช่อง\n\nช่องที่วาง: ' + where
    + '\nชื่อไฟล์ที่ถูกต้องควรเป็น: ' + taxStdName(kind, tax, form) + '\n\n'
    + bad.map(x=>'• ' + x.f.name + '\n' + x.w.map(t=>'   – ' + strip(t)).join('\n')).join('\n\n')
    + '\n\nกด "ตกลง" ถ้าตรวจแล้วถูกต้อง จะแนบต่อ (ระบบจะติด ⚠️ ไว้ให้ตรวจซ้ำภายหลัง)\nกด "ยกเลิก" ถ้าวางผิดช่อง';
  return confirm(msg) ? res : null;
}
async function taxUploadFiles(kind, tax, form, fileList){
  const files = Array.from(fileList||[]);
  if (!files.length) return;
  const isY = kind==='y';
  const key = isY ? taxYFY() : taxPeriod();
  const rowNow = isY ? taxYRow(tax, key, form) : taxRow(tax, key, form);
  const cur = (rowNow && Array.isArray(rowNow.files)) ? [...rowNow.files] : [];
  const checked = await taxConfirmFiles(kind, tax, form, files);
  if (!checked){ toast('ยกเลิกการแนบไฟล์แล้ว — ไม่มีอะไรถูกบันทึก'); return; }
  toast('กำลังอัปโหลด ' + files.length + ' ไฟล์...');
  for (const { f, w, n } of checked){
    const safe = f.name.replace(/[^\w\.\-ก-๙]+/g, '_').slice(-80);
    const path = (isY?'taxyear/':'tax/') + tax + '/' + key + '_' + form + '_' + Date.now() + '_' + safe;
    const { error } = await sb.storage.from('liqdocs').upload(path, f);
    if (error){ toast('อัปโหลดไม่สำเร็จ: ' + error.message); return; }
    const rec = { path, name: f.name, size: f.size };
    const notes = [...w, ...n].map(t=>t.replace(/<\/?b>/g,''));
    if (notes.length) rec.warn = notes.join(' · ');   // ติดธงไว้ให้ตรวจซ้ำ
    cur.push(rec);
  }
  // ตั้งสถานะ/วันที่ให้อัตโนมัติ — ลดงานพนักงานไม่ต้องมาเลือกเอง
  const patch = { files: cur };
  const st = rowNow && rowNow.status;
  if (!st || st==='รอเอกสาร' || st==='กำลังทำ' || st==='ทำแล้วรอยื่น') patch.status = 'ยื่นแล้ว';
  if (!(rowNow && rowNow.filed_date)) patch.filed_date = todayIso();
  const ok = isY ? await taxYSave(tax, form, patch) : await taxSave(tax, form, patch);
  if (ok){
    const nw = checked.filter(x=>x.w.length).length;
    const nn = checked.filter(x=>!x.w.length && x.n.length).length;
    toast('แนบไฟล์แล้ว — ตั้งเป็น "ยื่นแล้ว" วันที่ ' + dateToBe(new Date()) + ' ให้อัตโนมัติ'
      + (nw?` · ⚠️ ${nw} ไฟล์ติดธงไว้ให้ตรวจซ้ำ`:'')
      + (nn?` · ${nn} ไฟล์ตรวจเนื้อในไม่ได้`:''));
    renderDash();
  }
}
// ทำให้ช่องในตารางรับการลากไฟล์มาวาง
function taxDropAttrs(kind, tax, form){
  const c = `taxDrop(event,'${kind}','${tax}','${form}')`;
  return `ondragover="taxDragOver(event,this)" ondragleave="taxDragLeave(event,this)" ondrop="${c}"`;
}
function taxDragOver(e, el){
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types||[]).includes('Files')) return;
  e.preventDefault(); e.stopPropagation();
  el.style.outline = '2px dashed var(--blue)'; el.style.background = 'var(--blue-bg)';
}
function taxDragLeave(e, el){ el.style.outline = ''; el.style.background = ''; }
function taxDrop(e, kind, tax, form){
  e.preventDefault(); e.stopPropagation();
  const el = e.currentTarget; el.style.outline = ''; el.style.background = '';
  const f = e.dataTransfer && e.dataTransfer.files;
  if (f && f.length) taxUploadFiles(kind, tax, form, f);
}
// ตรึง 4 คอลัมน์แรกของบอร์ดภาษี — วัดความกว้างจริงหลัง render เพื่อให้ระยะ left ตรงเสมอ
// (แม้ผู้ใช้จะปรับความกว้างหรือสลับลำดับคอลัมน์เอง)
function applyPinnedCols(){
  ['tax','taxy'].forEach(grp=>{
    const th0 = document.querySelector(`#dash th[data-draggrp="${grp}"]`);
    if (!th0) return;
    const table = th0.closest('table'); if (!table) return;
    const all = [...table.querySelectorAll('th[data-dragkey]')];
    const keys = all.map(t=>t.getAttribute('data-dragkey'));
    const ths = all.slice(0, taxPinCount(keys, grp));
    if (!ths.length) return;
    let acc = 0; const lefts = [];
    ths.forEach(th => { lefts.push(acc); acc += th.getBoundingClientRect().width; });
    // เงาซ้าย -24px = ทาสีคลุมช่องว่าง padding ของ #dash ไม่ให้เห็นคอลัมน์ที่เลื่อนลอดไปด้านหลัง
    const shadow = (i, n, bg) => [ i===0 ? `-24px 0 0 ${bg}` : '', i===n-1 ? '2px 0 0 var(--line)' : '' ].filter(Boolean).join(',');
    ths.forEach((th, i) => {
      th.style.position = 'sticky'; th.style.left = lefts[i] + 'px'; th.style.zIndex = 8;
      th.style.boxShadow = shadow(i, ths.length, 'var(--bg)');
    });
    [...table.rows].forEach(tr => {
      const tds = [...tr.children].filter(x => x.tagName === 'TD');
      if (tds.length < ths.length) return;            // ข้ามแถวหัวกลุ่ม (colspan)
      const isFilter = !!tr.querySelector('select[onchange^="setTaxColF"], input[onchange^="setTaxColF"]');
      for (let i = 0; i < ths.length; i++){
        const td = tds[i]; if (!td) break;
        td.style.position = 'sticky'; td.style.left = lefts[i] + 'px'; td.style.zIndex = isFilter ? 3 : 2;
        if (!td.style.background) td.style.background = isFilter ? 'var(--bg)' : '#fff';
        td.style.boxShadow = shadow(i, ths.length, td.style.background || '#fff');
      }
    });
  });
}

// นับเฉพาะ "ช่วงหัวแถวที่ติดกัน" — ถ้าผู้ใช้ลากคอลัมน์แบบภาษีมาแทรก จะหยุดตรึงตรงนั้น (กันคอลัมน์ตรึงไม่ติดกัน)
function taxPinCount(order, grp){

// เช็คว่าบริษัทผ่านตัวกรองไหม
function taxRowPass(scope, c, forms, getRow, ay, skipKey){
  const F = scope==='y' ? taxYColF : taxColF;
  const y = ay || year();
  if (F.co && skipKey!=='co'){ const q = F.co.toLowerCase(); if (!((c.client_code||'')+' '+(c.name_th||'')).toLowerCase().includes(q)) return false; }
  const roleMap = { prep:'Prepare', supp:'Support', close:'Closing', partner:'Partner', supv:'Supervisor' };
  for (const k of ['prep','supp','close','partner','supv']){
    const want = fArr(F[k]);
    if (!want.length || k===skipKey) continue;
    const list = D.assigns.filter(a=>a.tax_id===c.tax_id && a.work_year===y && a.role===roleMap[k]).map(a=>a.staff_token);
    const has = list.length ? list : ['(none)'];
    if (!want.some(v=>has.includes(v))) return false;
  }
  for (const f of forms){
    const want = fArr(F[f.k]);
    if (!want.length || f.k===skipKey) continue;
    const r = getRow(c.tax_id, f.k);
    const st = (r && r.status) || '(none)';
    if (!want.includes(st)) return false;
  }
  return true;
}

function dashCellValue(cell){
  const sels = [...cell.querySelectorAll('select')];
  // type=date ที่เหลือในหน้าเป็น "ตัวเลือกปฏิทินที่ซ่อนอยู่" ของ beDateBox — ตัดทิ้ง ไม่งั้นวันที่จะซ้ำสองครั้ง
  // type=color เป็นปุ่มเลือกสีประจำตัว ไม่ใช่ข้อมูล
  const inps = [...cell.querySelectorAll('input')].filter(x=>!['checkbox','file','date','color'].includes(x.type));
  if (sels.length || inps.length){
    const parts = sels.map(x=>x.selectedIndex>=0 ? (x.options[x.selectedIndex]||{}).text : '')
      .concat(inps.map(x=>x.value));
    const extra = (cell.textContent.match(/\d+ ไฟล์/)||[])[0] || '';
    return parts.concat(extra?[extra]:[]).filter(x=>x && x!=='—').join(' · ');
  }
  const cl = cell.cloneNode(true);
  cl.querySelectorAll('.cmb,.colmenu,.cwh,button').forEach(e=>e.remove());
  return cl.textContent.replace(/[⋯▲▼]/g,'').replace(/\s+/g,' ').trim();
}

// ================= ตรวจไฟล์ใน OneDrive แล้วอัปเดตสถานะให้อัตโนมัติ (3 ก.ย. 2569) =================
// เครื่องมือที่ใช้: File System Access API ของเบราว์เซอร์ (showDirectoryPicker)
//   - แอดมินกดปุ่ม → เลือกโฟลเดอร์ OneDrive ที่ sync ไว้ในเครื่อง → หน้าเว็บอ่าน "ชื่อไฟล์" เองได้
//   - ใช้ได้ทั้ง Windows และ Mac บน Chrome / Edge (Safari กับ Firefox ยังไม่รองรับ)
//   - อ่านอย่างเดียว ไม่แก้/ไม่ลบไฟล์ · ไม่อัปโหลดตัวไฟล์ขึ้นเซิร์ฟเวอร์ เก็บแค่ "ที่อยู่" เป็น onedrive:...
let odBusy = false;
function odSupported(){ return typeof window.showDirectoryPicker === 'function'; }
// ---- จำโฟลเดอร์ OneDrive ที่แอดมินเลือกไว้ (เก็บ handle ใน IndexedDB — ครั้งต่อไปไม่ต้องเลือกใหม่) ----
// 4 ก.ย. — แยกโฟลเดอร์ตามบอร์ด เพราะเอกสารคนละที่:
//   scope 'm' = ภาษีรายเดือน (ภ.พ.30 · ภ.ง.ด.1/3/53 · ประกันสังคม)  · scope 'y' = ภาษีรายปี (ภ.ง.ด.50/51 · งบ · ส.บช.3)
// จำ handle แยกกันคนละคีย์ใน IndexedDB — เลือกโฟลเดอร์ของแถบไหนก็มีผลเฉพาะแถบนั้น
const OD_SCOPES = {
  m: { key:'dir-m', pick:'bbt-onedrive-month', lb:'ภาษีรายเดือน', hint:'เช่นโฟลเดอร์ "PND and PP30"' },
  y: { key:'dir-y', pick:'bbt-onedrive-year',  lb:'ภาษีรายปี',    hint:'เช่นโฟลเดอร์ "RD SSO Submission 2026"' },
};
const odScope = s => OD_SCOPES[s] || OD_SCOPES.m;
const odDirCache = { m:null, y:null };
function odIDB(){
  return new Promise((res, rej)=>{
    const q = indexedDB.open('bbt-onedrive', 1);
    q.onupgradeneeded = ()=>{ try { q.result.createObjectStore('h'); } catch(e){} };
    q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error);
  });
}
async function odSaveDir(key, h){
  try { const db = await odIDB(); await new Promise((res, rej)=>{
    const t = db.transaction('h','readwrite'); t.objectStore('h').put(h, key);
    t.oncomplete = res; t.onerror = ()=>rej(t.error); }); } catch(e){}
}
async function odLoadDir(key){
  try { const db = await odIDB(); return await new Promise(res=>{
    const t = db.transaction('h','readonly'); const r = t.objectStore('h').get(key);
    r.onsuccess = ()=>res(r.result||null); r.onerror = ()=>res(null); }); } catch(e){ return null; }
}
async function odForget(scope){
  const s = odScope(scope); odDirCache[scope] = null;
  try { const db = await odIDB(); await new Promise(res=>{
    const t = db.transaction('h','readwrite'); t.objectStore('h').delete(s.key); t.oncomplete = res; t.onerror = res; }); } catch(e){}
}
// คืน handle ของโฟลเดอร์ที่จำไว้ของแถบนั้น · ask=true ให้ขอสิทธิ์/เปิดหน้าต่างเลือกได้ · pick=true บังคับเลือกใหม่
async function odDir(scope, ask, pick){
  if (!odSupported()) return null;
  const s = odScope(scope);
  if (!pick){
    // 'dir' คือคีย์เดิมสมัยยังใช้โฟลเดอร์เดียวร่วมกัน — ยังอ่านได้เพื่อไม่ให้คนที่เคยเลือกไว้ต้องเริ่มใหม่
    let h = odDirCache[scope] || await odLoadDir(s.key) || await odLoadDir('dir');
    if (h){
      let perm = 'denied';
      try { perm = await h.queryPermission({ mode:'read' }); } catch(e){}
      if (perm !== 'granted' && ask){ try { perm = await h.requestPermission({ mode:'read' }); } catch(e){} }
      if (perm === 'granted'){ odDirCache[scope] = h; return h; }
    }
  }
  if (!ask) return null;
  let h2;
  try { h2 = await window.showDirectoryPicker({ id:s.pick, mode:'read' }); } catch(e){ return null; }
  odDirCache[scope] = h2; await odSaveDir(s.key, h2);
  return h2;
}
// เปิดไฟล์: ไม่รู้ว่าอยู่โฟลเดอร์ไหน ลองทีละอันที่จำไว้
async function odResolveAny(loc){
  for (const sc of ['m','y']){
    const dir = await odDir(sc, true);
    if (!dir) continue;
    try { const fh = await odResolve(dir, loc); if (fh) return fh; } catch(e){}
  }
  return null;
}
// หาไฟล์จริงในโฟลเดอร์ที่จำไว้ จาก path ที่เก็บใน onedrive:
async function odResolve(dir, rel){
  const parts = String(rel).split('/').filter(Boolean);
  const base = parts[parts.length-1];
  for (let start = 0; start < parts.length; start++){
    let cur = dir, ok = true;
    for (let i = start; i < parts.length - 1; i++){
      try { cur = await cur.getDirectoryHandle(parts[i]); } catch(e){ ok = false; break; }
    }
    if (!ok) continue;
    try { return await cur.getFileHandle(base); } catch(e){}
  }
  return await odFind(dir, base, 0);
}
async function odFind(dir, name, depth){
  if (depth > 7) return null;
  const subs = [];
  try {
    for await (const [n, h] of dir.entries()){
      if (h.kind === 'file'){ if (n === name) return h; }
      else if (!n.startsWith('.')) subs.push(h);
    }
  } catch(e){ return null; }
  for (const d of subs){ const r = await odFind(d, name, depth+1); if (r) return r; }
  return null;
}
